<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>資源即時報 - 大螢幕</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; padding: 20px; margin: 0; }
        .board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-row { background: #111; border: 1px solid #333; padding: 12px; border-radius: 10px; display: flex; align-items: center; }
        .name-tag { width: 100px; font-size: 1.2em; color: #ffd700; font-weight: bold; overflow: hidden; }
        .res-display { flex: 1; display: flex; justify-content: space-around; }
        .res-v { text-align: center; }
        .res-v span { display: block; font-size: 0.7em; color: #888; }
        .res-v b { font-size: 1.4em; }
        .c-gold { color: #f1c40f; } .c-wood { color: #2ecc71; } 
        
        .c-water { color: #3498db; } .c-fire { color: #e74c3c; } .c-earth { color: #deb887; }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#ffd700;">人生履歷 - 全員資源監控</h1>
    <div class="board" id="board"></div>
    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const resTypes = { gold: '金', wood: '木', water: '水', fire: '火', earth: '土' };
        const board = document.getElementById('board');
        for (let i = 1; i <= 10; i++) {
            board.innerHTML += `<div class="p-row"><div class="name-tag" id="d${i}-name">-</div><div class="res-display">
                ${Object.keys(resTypes).map(k => `<div class="res-v c-${k}"><span>${resTypes[k]}</span><b id="d${i}-${k}">0</b></div>`).join('')}
            </div></div>`;
            db.ref(`players/p${i}`).on('value', s => {
                const d = s.val() || {};
                document.getElementById(`d${i}-name`).innerText = d.name || '等待中';
                Object.keys(resTypes).forEach(k => document.getElementById(`d${i}-${k}`).innerText = (d.res && d.res[k]) || 0);
            });
        }
    </script>
</body>
</html>
