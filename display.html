<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>人生履歷 - 即時排名榜</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #d9d8d0; color: rgb(11, 4, 4); font-family: sans-serif; padding: 20px; }
        .leaderboard { max-width: 1000px; margin: auto; }
        .p-row { background: #111; margin-bottom: 15px; padding: 20px; border-radius: 15px; display: flex; align-items: center; border-left: 8px solid #444; animation: slideIn 0.5s ease-out; }
        .rank { width: 60px; font-size: 2em; font-weight: bold; color: #888; }
        .name { width: 200px; font-size: 1.5em; color: #ffd700; font-weight: bold; }
        .res-summary { flex: 1; display: flex; justify-content: space-around; color: #aaa; }
        .total-score { width: 150px; text-align: right; font-size: 1.8em; font-weight: bold; color: #00d4ff; }
        /* 排名特效 */
        .rank-1 { border-left-color: #ffd700; background: linear-gradient(90deg, #221a00, #111); }
        .rank-2 { border-left-color: #c0c0c0; }
        .rank-3 { border-left-color: #cd7f32; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#b13383; font-size: 3em;"><i class="fas fa-trophy"></i> 人生資源 積分榜</h1>
    <div class="leaderboard" id="leaderboard"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('players').on('value', s => {
            const data = s.val();
            let playersArray = [];
            for(let id in data) {
                const p = data[id];
                const res = p.res || {};
                const total = (res.time||0) + (res.money||0) + (res.health||0) + (res.knowledge||0) + (res.social||0);
                playersArray.push({ name: p.name || '---', res: res, total: total });
            }
            // 排序
            playersArray.sort((a, b) => b.total - a.total);

            const container = document.getElementById('leaderboard');
            container.innerHTML = "";
            playersArray.forEach((p, index) => {
                const rank = index + 1;
                let rankClass = rank <= 3 ? `rank-${rank}` : "";
                container.innerHTML += `
                    <div class="p-row ${rankClass}">
                        <div class="rank">${rank}</div>
                        <div class="name">${p.name}</div>
                        <div class="res-summary">
                            <span><i class="fas fa-clock"></i> ${p.res.time||0}</span>
                            <span><i class="fas fa-wallet"></i> ${p.res.money||0}</span>
                            <span><i class="fas fa-heartbeat"></i> ${p.res.health||0}</span>
                            <span><i class="fas fa-book"></i> ${p.res.knowledge||0}</span>
                            <span><i class="fas fa-users"></i> ${p.res.social||0}</span>
                        </div>
                        <div class="total-score">${p.total} Pts</div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
