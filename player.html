<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資源盤 - 活潑更新版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 活潑風全域設定 */
        body { 
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            color: #333; padding: 15px; text-align: center; margin: 0; min-height: 100vh;
        }
        .box { 
            background: #ffffff; padding: 25px; border-radius: 30px; max-width: 450px; 
            margin: auto; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            border: 2px solid #fff;
        }
        h2 { color: #ff6b6b; font-weight: 800; margin-top: 0; }
        
        /* 資源網格 */
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .res-item { 
            background: #fff; padding: 15px; border-radius: 20px; 
            border: 2px solid #f1f2f6; transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .res-item:active { transform: scale(0.95); }
        .res-item i { font-size: 1.4em; margin-bottom: 8px; display: block; }
        .num { font-size: 2.2em; font-weight: 900; display: block; }

        /* 活潑五色 */
        .c-time { border-color: #a29bfe; color: #6c5ce7; }
        .c-money { border-color: #ffeaa7; color: #f39c12; }
        .c-health { border-color: #ff7675; color: #d63031; }
        .c-knowledge { border-color: #74b9ff; color: #0984e3; }
        .c-social { border-color: #55efc4; color: #00b894; }

        .chart-container { 
            background: #fff; border-radius: 25px; padding: 15px; 
            margin: 20px 0; border: 2px solid #f1f2f6;
        }

        /* 商店設計 */
        .shop-card { 
            background: #f8f9fa; padding: 18px; border-radius: 20px; 
            margin-top: 15px; text-align: left; border-left: 6px solid #6c5ce7; 
            position: relative;
        }
        .btn-buy { 
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); 
            color: white; padding: 10px 15px; border-radius: 12px; 
            border: none; cursor: pointer; font-weight: bold; width: 100%;
            margin-top: 10px; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
        }
        
        .hide { display: none; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 2px solid #eee; font-size: 16px; box-sizing: border-box; }
        #me { color: #6c5ce7; font-size: 1.8em; font-weight: 900; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box" id="login">
        <h2><i class="fas fa-smile-beam"></i> 準備好了嗎？</h2>
        <select id="pid">
            <option value="1">1 號</option><option value="2">2 號</option>
            <option value="3">3 號</option><option value="4">4 號</option>
            <option value="5">5 號</option><option value="6">6 號</option>
            <option value="7">7 號</option><option value="8">8 號</option>
            <option value="9">9 號</option><option value="10">10 號</option>
        </select>
        <input type="text" id="pname" placeholder="請輸入你的超酷暱稱">
        <button onclick="join()" style="width:100%; background:#00b894; color:white; padding:15px; border-radius:15px; border:none; font-weight:bold; font-size:1.1em; cursor:pointer;">開始遊戲之旅</button>
    </div>

    <div class="box hide" id="game">
        <h2 id="me">---</h2>
        <div id="msg" style="min-height:24px; font-weight:bold; margin-bottom:10px;"></div>
        
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="res-grid">
            <div class="res-item c-time"><i class="fas fa-clock"></i> 時間 <span id="time" class="num">0</span></div>
            <div class="res-item c-money"><i class="fas fa-wallet"></i> 金錢 <span id="money" class="num">0</span></div>
            <div class="res-item c-health"><i class="fas fa-heartbeat"></i> 健康 <span id="health" class="num">0</span></div>
            <div class="res-item c-knowledge"><i class="fas fa-book"></i> 知識 <span id="knowledge" class="num">0</span></div>
            <div class="res-item c-social" style="grid-column: span 2;"><i class="fas fa-users"></i> 人際 <span id="social" class="num">0</span></div>
        </div>

        <h3 style="margin-top:30px; color:#636e72;"><i class="fas fa-shopping-cart"></i> 驚喜商店</h3>
        <div id="shop-display"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const resNames = { time:'時間', money:'金錢', health:'健康', knowledge:'知識', social:'人際' };
        let myRes = { time:0, money:0, health:0, knowledge:0, social:0 };
        let myId = "";
        let radarChart;

        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['時間', '金錢', '健康', '知識', '人際'],
                    datasets: [{
                        label: '能力分佈',
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: 'rgba(108, 92, 231, 0.2)',
                        borderColor: '#6c5ce7',
                        pointBackgroundColor: '#ff7675',
                        pointRadius: 4
                    }]
                },
                options: {
                    scales: { r: { beginAtZero: true, grid: { color: '#eee' }, ticks: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function join() {
            myId = document.getElementById('pid').value;
            const name = document.getElementById('pname').value;
            if(!name) return alert("要取名字才能出發喔！");
            db.ref(`players/p${myId}`).update({ name: name });
            document.getElementById('login').classList.add('hide');
            document.getElementById('game').classList.remove('hide');
            document.getElementById('me').innerText = name;
            initChart();

            Object.keys(resNames).forEach(k => {
                db.ref(`players/p${myId}/res/${k}`).on('value', s => {
                    myRes[k] = s.val() || 0;
                    document.getElementById(k).innerText = myRes[k];
                    radarChart.data.datasets[0].data = [myRes.time, myRes.money, myRes.health, myRes.knowledge, myRes.social];
                    radarChart.update();
                });
            });

            db.ref('shopSettings/isOpen').on('value', s => {
                const isOpen = s.val();
                document.getElementById('shop-display').style.opacity = isOpen ? "1" : "0.3";
                document.getElementById('shop-display').style.pointerEvents = isOpen ? "auto" : "none";
                document.getElementById('msg').innerText = isOpen ? "" : "🏪 商店午休中...";
            });

            db.ref('shop/items').on('value', s => {
                const list = document.getElementById('shop-display');
                list.innerHTML = "";
                const data = s.val();
                for(let key in data) {
                    const item = data[key];
                    let costs = Object.keys(resNames).map(k => item.cost[k] > 0 ? `${resNames[k]}:${item.cost[k]}` : '').filter(v => v !== '').join(' ');
                    list.innerHTML += `<div class="shop-card"><strong>${item.name}</strong><br><small>代價: ${costs || '免費'}</small><br>
                        <button class="btn-buy" onclick='buy("${item.name}", ${JSON.stringify(item.cost)})'>手刀購買</button></div>`;
                }
            });
        }

        function buy(name, cost) {
            for(let k in cost) { if((myRes[k]||0) < cost[k]) return alert(`哎呀！你的「${resNames[k]}」不夠喔！`); }
            if(confirm(`準備好帶走「${name}」了嗎？`)) {
                for(let k in cost) db.ref(`players/p${myId}/res/${k}`).set(myRes[k] - cost[k]);
            }
        }
    </script>
</body>
</html>
