<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的資源盤</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .res-card { background: #2a2a2a; padding: 15px; border-radius: 15px; border-top: 4px solid #444; }
        .num { font-size: 2.5em; font-weight: bold; display: block; margin-top: 5px; }
        .gold { border-color: #f1c40f; color: #f1c40f; }
        .wood { border-color: #2ecc71; color: #2ecc71; }
        .water { border-color: #3498db; color: #3498db; }
        .fire { border-color: #e74c3c; color: #e74c3c; }
        .earth { border-color: #a52a2a; color: #deb887; }
        .hidden { display: none; }
        input { width: 80%; padding: 12px; margin: 10px; border-radius: 8px; border: none; }
        button { width: 85%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-zone">
        <h2>登入玩家號碼</h2>
        <input type="number" id="pid" placeholder="輸入玩家號碼 (1-10)" min="1" max="10">
        <input type="text" id="pname" placeholder="輸入你的名字">
        <button onclick="join()">進入遊戲</button>
    </div>

    <div id="status-zone" class="hidden">
        <h2 id="display-name">---</h2>
        <div class="res-grid">
            <div class="res-card gold">金 <span class="num" id="my-gold">0</span></div>
            <div class="res-card wood">木 <span class="num" id="my-wood">0</span></div>
            <div class="res-card water">水 <span class="num" id="my-water">0</span></div>
            <div class="res-card fire">火 <span class="num" id="my-fire">0</span></div>
            <div class="res-card earth">土 <span class="num" id="my-earth">0</span></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function join() {
            const id = document.getElementById('pid').value;
            const name = document.getElementById('pname').value;
            if(!id || !name) return alert('請填寫完整');

            db.ref(`players/p${id}`).update({ name: name });
            document.getElementById('login-zone').classList.add('hidden');
            document.getElementById('status-zone').classList.remove('hidden');
            document.getElementById('display-name').innerText = name;

            const keys = ['gold', 'wood', 'water', 'fire', 'earth'];
            keys.forEach(k => {
                db.ref(`players/p${id}/res/${k}`).on('value', s => {
                    document.getElementById(`my-${k}`).innerText = s.val() || 0;
                });
            });
        }
    </script>
</body>
</html>
