<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的資源盤</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; text-align: center; margin: 0; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        select, input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .res-item { background: #333; padding: 15px; border-radius: 10px; border-top: 4px solid #444; }
        .num { font-size: 2.2em; font-weight: bold; display: block; margin-top: 5px; }
        .hide { display: none; }
    </style>
</head>
<body>
    <div class="box" id="login">
        <h2>登入號碼與名字</h2>
        <select id="pid">
            <option value="1">1號玩家</option><option value="2">2號玩家</option>
            <option value="3">3號玩家</option><option value="4">4號玩家</option>
            <option value="5">5號玩家</option><option value="6">6號玩家</option>
            <option value="7">7號玩家</option><option value="8">8號玩家</option>
            <option value="9">9號玩家</option><option value="10">10號玩家</option>
        </select>
        <input type="text" id="pname" placeholder="輸入暱稱">
        <button onclick="join()">開始遊戲</button>
    </div>

    <div class="box hide" id="game">
        <h1 id="me" style="color:#ffd700; margin:0;">---</h1>
        <p style="font-size: 14px; color:#888;">我的五行資源盤</p>
        <div class="res-grid">
            <div class="res-item" style="border-color:#f1c40f; color:#f1c40f;">金 <span class="num" id="gold">0</span></div>
            <div class="res-item" style="border-color:#2ecc71; color:#2ecc71;">木 <span class="num" id="wood">0</span></div>
            <div class="res-item" style="border-color:#3498db; color:#3498db;">水 <span class="num" id="water">0</span></div>
            <div class="res-item" style="border-color:#e74c3c; color:#e74c3c;">火 <span class="num" id="fire">0</span></div>
            <div class="res-item" style="border-color:#deb887; color:#deb887;">土 <span class="num" id="earth">0</span></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function join() {
            const id = document.getElementById('pid').value;
            const name = document.getElementById('pname').value;
            if(!name) return alert("請輸入名字");
            db.ref(`players/p${id}`).update({ name: name });
            document.getElementById('login').classList.add('hide');
            document.getElementById('game').classList.remove('hide');
            document.getElementById('me').innerText = name;
            ['gold','wood','water','fire','earth'].forEach(k => {
                db.ref(`players/p${id}/res/${k}`).on('value', s => {
                    document.getElementById(k).innerText = s.val() || 0;
                });
            });
        }
    </script>
</body>
</html>
