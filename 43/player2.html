<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>玩家掃碼扣資源</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <!-- 專案共用 -->
  <script src="js/firebase.js"></script>
  <script src="js/common.js"></script>

  <!-- QR 掃描 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>

  <style>
    body{margin:0;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#f6f8fb;color:#0f172a}
    .wrap{max-width:900px;margin:0 auto;padding:18px}
    .card{background:#fff;border:1px solid rgba(2,6,23,.14);border-radius:18px;
      padding:16px;box-shadow:0 10px 24px rgba(2,6,23,.06);margin-bottom:14px}
    h1{margin:0 0 10px 0}
    label{font-weight:900;display:block;margin-bottom:6px}
    input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(2,6,23,.14);font-size:16px}
    .btn{border:1px solid rgba(2,6,23,.14);background:#fff;padding:10px 12px;border-radius:12px;
      font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
    .btn.blue{background:rgba(59,130,246,.12)}
    .btn.ok{background:rgba(34,197,94,.12)}
    .btn.danger{background:rgba(239,68,68,.12)}
    .hint{font-size:13px;opacity:.72}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid rgba(2,6,23,.14);
      margin:4px 6px 0 0;font-weight:900}
    #reader{width:100%;border:1px dashed rgba(2,6,23,.14);border-radius:16px}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap}
  </style>
</head>

<body>
<div class="wrap">
  <h1>📷 玩家掃碼扣資源</h1>

  <div class="card">
    <label>玩家 ID</label>
    <select id="pid">
      <option value="1">玩家 1</option><option value="2">玩家 2</option><option value="3">玩家 3</option>
      <option value="4">玩家 4</option><option value="5">玩家 5</option>
      <option value="6">玩家 6</option><option value="7">玩家 7</option>
      <option value="8">玩家 8</option><option value="9">玩家 9</option>
      <option value="10">玩家 10</option>
    </select>

    <label style="margin-top:10px">暱稱（可選）</label>
    <input id="pname" placeholder="小明">
  </div>

  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn blue" id="btnCam">📷 相機掃描</button>
      <button class="btn danger" id="btnStop" disabled>■ 停止</button>

      <label class="btn">
        📁 選擇截圖
        <input id="imgPick" type="file" accept="image/*" style="display:none">
      </label>
    </div>

    <div id="reader" style="margin-top:10px"></div>

    <div class="hint" id="status">尚未掃描</div>

    <div style="margin-top:10px">
      <b>將扣除：</b>
      <div id="costBox"></div>
    </div>

    <button class="btn ok" id="btnConfirm" disabled style="margin-top:12px">確認扣除</button>

    <div class="mono" id="raw" style="margin-top:10px"></div>
  </div>
</div>

<script>
  if(!firebase.apps.length){ alert("Firebase 尚未初始化"); throw new Error("no firebase"); }
  const db = firebase.database();

  const COST = { time:3, money:2, health:2, social:1, knowledge:2 };
  const NAMES = { time:'時間', money:'金錢', health:'健康', social:'人際', knowledge:'知識' };

  const statusEl = document.getElementById("status");
  const costBox = document.getElementById("costBox");
  const rawEl = document.getElementById("raw");
  const btnConfirm = document.getElementById("btnConfirm");

  let scanner = null;
  let ready = false;

  function showCost(){
    costBox.innerHTML = "";
    Object.keys(COST).forEach(k=>{
      costBox.insertAdjacentHTML("beforeend",
        `<span class="pill">${NAMES[k]} -${COST[k]}</span>`);
    });
  }
  showCost();

  function onDecoded(text){
    rawEl.textContent = text;
    statusEl.textContent = "✅ 掃描成功，請確認扣除";
    btnConfirm.disabled = false;
    ready = true;
  }

  document.getElementById("btnCam").onclick = async ()=>{
    if(scanner) return;
    scanner = new Html5Qrcode("reader");
    document.getElementById("btnStop").disabled = false;

    try{
      await scanner.start({facingMode:"environment"}, {fps:10,qrbox:250},
        (text)=>{ stopScan(); onDecoded(text); });
      statusEl.textContent = "相機已開啟，對準 QR";
    }catch(e){
      statusEl.textContent = "❌ 相機啟動失敗";
      scanner = null;
    }
  };

  async function stopScan(){
    if(!scanner) return;
    try{ await scanner.stop(); await scanner.clear(); }catch(e){}
    scanner = null;
    document.getElementById("btnStop").disabled = true;
  }
  document.getElementById("btnStop").onclick = stopScan;

  document.getElementById("imgPick").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    await stopScan();
    const tmp = new Html5Qrcode("reader");
    try{
      const text = await tmp.scanFile(file,true);
      await tmp.clear();
      onDecoded(text);
    }catch(e){
      statusEl.textContent = "❌ 圖片解碼失敗";
    }
  });

  btnConfirm.onclick = async ()=>{
    if(!ready) return;

    const pid = document.getElementById("pid").value;
    const pname = document.getElementById("pname").value || ("玩家"+pid);

    btnConfirm.disabled = true;
    statusEl.textContent = "扣除中…";

    const ref = db.ref("players/p"+pid+"/res");

    const tx = await ref.transaction(cur=>{
      cur = cur || {};
      for(const k in COST){
        if((cur[k]||0) < COST[k]) return;
      }
      for(const k in COST){
        cur[k] = (cur[k]||0) - COST[k];
      }
      return cur;
    });

    if(!tx.committed){
      statusEl.textContent = "❌ 資源不足，扣除失敗";
      btnConfirm.disabled = false;
      return;
    }

    db.ref("purchaseFeed").push({
      playerId: pid,
      playerName: pname,
      via: "qr",
      cost: COST,
      ts: Date.now()
    });

    statusEl.textContent = "🎉 扣除成功！";
    ready = false;
  };
</script>
</body>
</html>
