<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>人生履歷-10人英雄榜(雙重排序優化版)</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 白底風格優化 */
        body { 
            background: #ffffff; 
            color: #2c3e50; 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
            padding: 10px 20px; 
            margin: 0; 
            overflow: hidden; /* 確保不會出現捲軸 */
        }

        /* 頂部標頭佈局 */
        #display-header { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 12px; 
            height: 60px;
        }

        #announcement-bar {
            flex: 3;
            background: #3498db;
            border-radius: 12px;
            display: none;
            overflow: hidden;
            white-space: nowrap;
        }
        #msg-box {
            display: inline-block;
            padding-left: 100%;
            /* 需求：跑馬燈速度快一點（原本 15s） */
            animation: marquee var(--marquee-duration, 10s) linear infinite;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            line-height: 60px;
            margin: 0;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        #timer-bar {
            flex: 1;
            background: #e74c3c;
            border-radius: 12px;
            text-align: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #timer-box { margin: 0; font-size: 2.5em; font-family: monospace; font-weight: 900; }

        /* 10 人列表排版優化 */
        .p-row { 
            background: #fdfdfd; 
            margin-bottom: 5px; 
            padding: 5px 15px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            border: 1px solid #eee;
            height: 7vh; /* 根據螢幕高度自動分配 */
        }
        
        /* 前三名色塊 */
        .rank-1 { background: #fffcf0; border-color: #ffd700; border-left: 10px solid #ffd700; }
        .rank-2 { background: #fafdff; border-color: #bdc3c7; border-left: 10px solid #bdc3c7; }
        .rank-3 { background: #fff9f5; border-color: #e67e22; border-left: 10px solid #e67e22; }

        .rank-num { font-size: 1.4em; font-weight: 900; width: 35px; color: #95a5a6; }
        .rank-1 .rank-num { color: #f1c40f; }
        
        .player-name { font-size: 1.2em; font-weight: 800; width: 140px; color: #34495e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* 資源數據呈現優化 */
        .res-summary { flex: 1; display: flex; justify-content: space-around; font-size: 0.95em; padding: 0 10px; }
        .res-item { display: flex; align-items: center; gap: 4px; font-weight: 700; }
        .res-label { font-size: 0.85em; }

        /* 分數顯示強調 */
        .res-score {
            color: #e67e22; 
            background: rgba(230, 126, 34, 0.1); 
            padding: 2px 10px; 
            border-radius: 6px;
            border: 1px solid rgba(230, 126, 34, 0.2);
        }
        
        .total-box { width: 100px; text-align: right; border-left: 1px dashed #ddd; padding-left: 10px; }
        .total-val { font-size: 1.6em; font-weight: 900; color: #2980b9; }
        .pts { font-size: 0.5em; color: #7f8c8d; margin-left: 2px; }
    
        /* Danmaku overlay */
        #danmaku-layer{
            position:fixed;
            left:0; top:0;
            width:100vw;
            min-height:100vh;
            pointer-events:none;
            overflow:hidden;
            z-index:3;
        }
        .danmaku{
            font-size: var(--danmaku-font-size, 22px);
            position:absolute;
            right:-40vw;
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:6px 12px;
            border-radius:999px;
            font-weight:900;
            color:#ffffff;
            background:rgba(243,156,18,0.95);
            box-shadow:0 8px 20px rgba(0,0,0,0.12);
            border:1px solid rgba(255,255,255,0.18);
            animation: danmaku-move var(--danmaku-duration, 10s) linear forwards;
            backdrop-filter: blur(4px);
            max-width: 70vw;
        }
        .danmaku img{
            width:22px;height:22px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,0.22);
        }
        @keyframes danmaku-move{
            from { transform: translateX(0); }
            to { transform: translateX(-160vw); }
        }

</style>


<!-- ==== Unified Mobile Theme v3 (light + lively) ==== -->
<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --row:rgba(2,6,23,0.05);
    --text:#0f172a;
    --muted:rgba(15,23,42,0.72);
    --shadow:rgba(2,6,23,0.12);

    --blue:#3b82f6;
    --ok:#22c55e;
    --warn:#f59e0b;
    --danger:#ef4444;
    --violet:#8b5cf6;
    --yellow:#fbbf24;

    --radius:18px;
  }

  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Microsoft JhengHei',system-ui,-apple-system,sans-serif !important;
    background:
      radial-gradient(900px 420px at 18% 0%, rgba(59,130,246,0.12), transparent 60%),
      radial-gradient(900px 420px at 82% 0%, rgba(34,197,94,0.10), transparent 60%),
      radial-gradient(900px 520px at 50% 100%, rgba(139,92,246,0.10), transparent 65%),
      var(--bg) !important;
    color:var(--text) !important;
    margin:0 !important;
    padding:14px !important;
    -webkit-text-size-adjust:100%;
  }

  /* mobile-first container */
  .wrap,.menu,.container,.main,.app{
    width:100%;
    max-width:720px;
    margin:0 auto;
  }

  /* common card look */
  .card,.box,.config-card,#auth-overlay>div{
    background:var(--card) !important;
    color:var(--text) !important;
    border-radius:var(--radius) !important;
    box-shadow:0 10px 26px var(--shadow) !important;
    border:1px solid rgba(2,6,23,0.08) !important;
  }

  /* tighten text */
  p,.hint,.sub,.small{color:var(--muted) !important;}

  h1{font-size:1.6rem;margin:10px 0 12px;}
  h2{font-size:1.25rem;}
  h3{font-size:1.1rem;}

  /* buttons */
  .btn,.global-btn,.menu .btn,a.btn{
    border-radius:14px !important;
    font-weight:900 !important;
    letter-spacing:0.2px;
    box-shadow:0 6px 14px rgba(2,6,23,0.10);
  }
  .btn.plus{background:var(--ok) !important;}
  .btn.plus10{background:rgba(34,197,94,0.92) !important;}
  .btn.minus{background:rgba(239,68,68,0.75) !important;}
  .btn.minus10{background:var(--danger) !important;}
  .btn.warn{background:var(--warn) !important; color:#1b1203 !important;}
  .btn.danger{background:var(--danger) !important;}
  .btn.blue{background:var(--blue) !important;}
  .btn.purple{background:var(--violet) !important;}

  /* inputs */
  input,select,textarea{
    border-radius:12px !important;
    font-size:16px !important;
    background:#ffffff !important;
    color:var(--text) !important;
    border:1px solid rgba(2,6,23,0.14) !important;
    box-shadow:0 6px 16px rgba(2,6,23,0.06);
  }

  /* rows */
  .res-row,.row{flex-wrap:wrap;}
  .res-row{background:var(--row) !important;}

  /* values */
  .val{color:var(--blue) !important;}

  /* bottom actions */
  .bottom-actions{width:100%;max-width:720px;margin:24px auto !important;}

  /* overlay */
  #auth-overlay{background:rgba(15,23,42,0.55) !important; backdrop-filter: blur(6px);}
</style>


  <!-- Shared Firebase + helpers -->
  <script src="js/firebase.js"></script>
  <script src="js/common.js"></script>
</head>
<body>

    <div id="display-header">
        <div id="announcement-bar">
            <p id="msg-box"></p>
        </div>
        <div id="timer-bar">
            <h1 id="timer-box">00:00</h1>
        </div>
    </div>

    <div id="board-list"></div>

    <script>
        
        const db = firebase.database();

// ===== 彈幕跑道邏輯 =====
let MAX_DANMAKU_ONSCREEN = 8;
let danmakuEnabled = true;
let currentLane = 0;
// ===== Danmaku settings sync (from /danmakuSettings) =====
LR && LR.listen ? LR.listen('danmakuSettings','value',(snap)=>{
  const v = snap.val() || {};
  danmakuEnabled = (v.enabled ?? true);
  MAX_DANMAKU_ONSCREEN = Math.max(1, Number(v.maxLines ?? v.danmakuMaxOnScreen ?? 8));
  const fontSize = Math.max(12, Number(v.fontSize ?? 22));
  const opacity  = Math.min(1, Math.max(0.2, Number(v.opacity ?? 0.9)));
  const durSec   = Math.max(3, Number(v.durationSec ?? v.danmakuDurationSec ?? 10));

  document.documentElement.style.setProperty('--danmaku-font-size', fontSize + 'px');
  // per-item uses --danmaku-duration
  document.documentElement.style.setProperty('--danmaku-duration', durSec + 's');
  // layer opacity
  const layer = document.getElementById('danmaku-layer');
  if(layer) layer.style.opacity = String(opacity);
}) : db.ref('danmakuSettings').on('value',(snap)=>{});

// Clear signal
(LR && LR.listen ? LR.listen('danmakuClearAt','value',(snap)=>{
  const t = snap.val(); if(!t) return;
  const layer = document.getElementById('danmaku-layer'); if(!layer) return;
  layer.innerHTML = '';
}) : db.ref('danmakuClearAt').on('value',()=>{}));

const TOTAL_LANES = 6;
// ===== 控制台參數（從 /controls 讀取）=====
const controlsRef = db.ref("controls");
controlsRef.on("value", (snap) => {
  const c = snap.val() || {};

  // 跑馬燈速度
  const marqueeSec = Number(c.marqueeDurationSec ?? 10);
  document.documentElement.style.setProperty("--marquee-duration", `${Math.max(3, Math.min(60, marqueeSec))}s`);

  // 彈幕（由 admin controls 管）
  const danmakuSec = Number(c.danmakuDurationSec ?? 10);
  const fontPx = Number(c.danmakuFontSizePx ?? 22);
  const maxOn = Number(c.danmakuMaxOnScreen ?? 8);
  danmakuEnabled = (c.danmakuEnabled === undefined) ? true : !!c.danmakuEnabled;

  document.documentElement.style.setProperty("--danmaku-duration", `${Math.max(3, Math.min(60, danmakuSec))}s`);
  document.documentElement.style.setProperty("--danmaku-font-size", `${Math.max(12, Math.min(64, fontPx))}px`);
  MAX_DANMAKU_ONSCREEN = Math.max(1, Math.min(30, maxOn));

  const layer = document.getElementById("danmaku-layer");
  if (layer) layer.style.display = danmakuEnabled ? "block" : "none";
});
// 廣播監聽
        db.ref('broadcast').on('value', s => {
            const d = s.val();
            const bar = document.getElementById('announcement-bar');
            if (d && d.message && d.message.trim() !== "") {
                bar.style.display = "block";
                document.getElementById('msg-box').innerText = "📢 " + d.message;
            } else { bar.style.display = "none"; }
        });

        // 計時器同步
        db.ref('timerSync').on('value', s => {
            const d = s.val();
            if (d) {
                const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
                const sc = (d.timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer-box').innerText = `${m}:${sc}`;
                document.getElementById('timer-bar').style.background = (d.timeLeft <= 0) ? "#95a5a6" : "#e74c3c";
            }
        });

        // 排名監聽：執行「分數第一、PTS 第二」排序
        db.ref('players').on('value', s => {
            const data = s.val();
            let arr = [];
            for(let i=1; i<=10; i++) {
                const pKey = `p${i}`;
                const pData = data[pKey] || {};
                const r = pData.res || {};
                const pts = (r.time||0) + (r.money||0) + (r.health||0) + (r.knowledge||0) + (r.social||0);
                const score = r.score || 0;
                arr.push({ name: pData.name || `玩家 ${i}`, res: r, pts: pts, score: score });
            }

            // 雙重排序邏輯
            arr.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return b.pts - a.pts;
            });
            
            const list = document.getElementById('board-list');
            list.innerHTML = "";
            arr.forEach((p, i) => {
                const rank = i + 1;
                let rClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
                list.innerHTML += `
                    <div class="p-row ${rClass}">
                        <div class="rank-num">${rank}</div>
                        <div class="player-name">${p.name}</div>
                        <div class="res-summary">
                            <div class="res-item" style="color:#8e44ad"><span class="res-label">時</span><i class="fas fa-clock"></i>${p.res.time||0}</div>
                            <div class="res-item" style="color:#f39c12"><span class="res-label">金</span><i class="fas fa-wallet"></i>${p.res.money||0}</div>
                            <div class="res-item" style="color:#c0392b"><span class="res-label">健</span><i class="fas fa-heartbeat"></i>${p.res.health||0}</div>
                            <div class="res-item" style="color:#2980b9"><span class="res-label">知</span><i class="fas fa-book"></i>${p.res.knowledge||0}</div>
                            <div class="res-item" style="color:#27ae60"><span class="res-label">人</span><i class="fas fa-users"></i>${p.res.social||0}</div>
                            <div class="res-item res-score"><span class="res-label">分</span><i class="fas fa-star"></i>${p.score}</div>
                        </div>
                        <div class="total-box"><span class="total-val">${p.pts}</span><span class="pts">PTS</span></div>
                    </div>`;
            });
        });
    

// ===== 彈幕：監聽 purchaseFeed（達成/兌換）=====
db.ref('purchaseFeed').limitToLast(10).on('child_added', s => {
  const d = s.val();
  if (!d) return;
  if (!danmakuEnabled) return;

  const layer = document.getElementById('danmaku-layer');
  if (!layer) return;

  while (layer.children.length >= MAX_DANMAKU_ONSCREEN) {
    layer.removeChild(layer.firstElementChild);
  }

  const el = document.createElement('div');
  el.className = 'danmaku';

  const headerHeight = 80;
  const laneHeight = 60;
  const top = headerHeight + (currentLane * laneHeight);
  el.style.top = `${top}px`;
  currentLane = (currentLane + 1) % TOTAL_LANES;

  const who = d.playerName || `玩家${d.playerId || ''}`;
  const what = d.itemName || d.text || '物品';
  const img = (d.imageUrl || '').trim();

  el.innerHTML = `
    ${img ? `<img src="${img}" onerror="this.style.display='none'" />` : ''}
    <span>${who} 達成了（${what}）</span>
  `;

  layer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
});
</script>

<div id="danmaku-layer"></div>
</body>
</html>
