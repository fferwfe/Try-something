<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>人生履歷-萬能管理主控台 (全功能整合終極版)</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    :root {
      --bg: #121a24; --card: #1b2a3a; --shadow: rgba(0,0,0,0.4); --row: rgba(255,255,255,0.06);
      --yellow: #f1c40f; --teal: #1abc9c; --blue: #3498db; --purple: #8e44ad; --gray: #7f8c8d;
      --ok: #22c55e; --warn: #f39c12; --danger: #e74c3c;
      --plus: #4ade80; --plus10: #16a34a; --minus: #f87171; --minus10: #b91c1c;
      --violet: #a78bfa; --muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI','Microsoft JhengHei',sans-serif;
      background: var(--bg); color: #fff; padding: 20px; text-align: center; margin: 0;
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    .card {
      background: var(--card); padding: 18px 20px; border-radius: 20px; margin: 15px auto;
      text-align: left; position: relative; border-left: 6px solid var(--teal);
      box-shadow: 0 4px 15px var(--shadow);
    }

    .res-row {
      display: flex; align-items: center; justify-content: space-between; margin: 8px 0;
      background: var(--row); padding: 8px 15px; border-radius: 12px; gap: 10px; flex-wrap: wrap;
    }

    .label-text { font-weight: bold; font-size: 1.1em; display: flex; align-items: center; gap: 8px; }
    .val { font-size: 1.5em; font-weight: bold; color: var(--yellow); min-width: 60px; text-align: center; }

    input, textarea, select {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none;
      box-sizing: border-box; font-size: 16px; background: #ecf0f1; color: #333;
    }

    .hint { opacity: .85; font-size: .92em; line-height: 1.4; margin-top: 4px; }

    .btn {
      border: none; border-radius: 14px; padding: 10px 14px; cursor: pointer;
      font-weight: 800; color: #fff; transition: transform .15s, filter .15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; user-select: none; white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.96); }

    .btn.plus { background: var(--plus); } .btn.plus10 { background: var(--plus10); }
    .btn.minus { background: var(--minus); } .btn.minus10 { background: var(--minus10); }
    .btn.warn { background: var(--warn); color: #1b1203; }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.blue { background: var(--blue); } .btn.gray { background: var(--gray); }
    .btn.ok { background: var(--ok); } .btn.violet { background: var(--violet); color:#1b102e; }

    .global-btn {
      width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold;
      cursor: pointer; color: #fff; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .bottom-actions { max-width: 650px; margin: 40px auto; display: flex; flex-direction: column; gap: 15px; align-items: center; }

    .clear-single {
      position: absolute; top: 15px; right: 15px; background: var(--purple);
      font-size: 13px; padding: 6px 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer;
    }

    .inv-tag { background: var(--purple); color: #fff; padding: 4px 12px; border-radius: 8px; margin: 4px; display: inline-block; font-size: 14px; }
    .inv-tag i { cursor: pointer; margin-left: 8px; color: #ffbcbc; }
    .inv-input { width: 60% !important; display: inline-block !important; padding: 10px !important; margin: 0 !important; }

    #auth-overlay {
      position: fixed; inset: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .hide { display: none !important; }
    #local-timer { font-size: 2.5em; font-weight: 900; font-family: monospace; color: var(--yellow); text-align: center; margin: 10px 0; }
    .row { margin: 10px 0; }
    .row label { display: block; font-weight: 700; margin-bottom: 6px; text-align: left;}
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,0.22); font-weight: 800; font-size: 0.95em; }
    .pill b { color: var(--yellow); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 950; font-size: 0.86em; margin-left: 8px; }
    .badge.ok { background: rgba(34,197,94,0.18); color: #b7f7c7; }
    .badge.danger { background: rgba(239,68,68,0.18); color: #ffc2c2; }
    .badge.warn { background: rgba(245,158,11,0.18); color: #ffe2b6; }
    .kbd { font-family: monospace; background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 8px; display: inline-block; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
<div class="wrap">

  <div id="auth-overlay">
    <div style="background:var(--card); padding:34px; border-radius:25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 380px;">
      <h2 style="margin:0 0 12px;"><i class="fas fa-lock"></i> 管理員登入</h2>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="global-btn" style="background:var(--blue);" id="btnLogin">登入</button>
      <div class="hint" style="margin-top:10px;">※ 需透過主控核准 deviceId 才能進入系統。</div>
    </div>
  </div>

  <div id="blocked-panel" class="card hide" style="border-left-color:var(--danger);">
    <h3 class="label-text"><i class="fas fa-ban"></i> 此設備尚未授權</h3>
    <div class="row">
      <label>設備名稱（label）</label>
      <input id="deviceLabel" type="text" placeholder="例如：管理員手機A">
    </div>
    <div class="row">
      <label>管理員等級</label>
      <select id="reqType">
        <option value="admin1">admin1 (資源/公告/計時)</option>
        <option value="admin2">admin2 (含大螢幕控制)</option>
      </select>
    </div>
    <div class="row">
      <label>申請密碼</label>
      <input id="reqPass" type="password" placeholder="輸入 345721">
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn warn" id="btnSubmitReq">送出申請</button>
      <button class="btn danger" id="btnLogoutBlocked">登出</button>
      <button class="btn blue" id="btnResetDevice">重設本機裝置</button>
    </div>
    <div class="hint" style="margin-top:10px;">本機 deviceId：<b id="deviceIdText"></b></div>
  </div>

  <div id="admin-main" class="hide">
    <h1>🎮 人生履歷 控制中心</h1>

    <div class="card" style="border-left-color:var(--gray);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div class="pill">Email：<span id="whoEmail">-</span></div>
        <div class="pill">Role：<b id="whoRole">-</b></div>
        <div class="pill">Device：<b id="whoDev">-</b></div>
        <button class="btn danger" id="btnLogout">登出</button>
      </div>
    </div>

    <div id="super-panel" class="card hide" style="border-left-color:var(--warn);">
      <h3 class="label-text"><i class="fas fa-crown"></i> SUPER 主控管理</h3>
      <div class="res-row">
        <div>Admin 鎖定：<span id="adminLockBadge" class="badge">-</span></div>
        <div style="display:flex; gap:5px;">
          <button class="btn danger" id="btnAdminLock" style="padding:4px 8px;">上鎖</button>
          <button class="btn ok" id="btnAdminUnlock" style="padding:4px 8px;">解鎖</button>
        </div>
      </div>
      <div class="res-row">
        <div>Player 鎖定：<span id="playerLockBadge" class="badge">-</span></div>
        <div style="display:flex; gap:5px;">
          <button class="btn danger" id="btnPlayerLock" style="padding:4px 8px;">上鎖</button>
          <button class="btn ok" id="btnPlayerUnlock" style="padding:4px 8px;">解鎖</button>
        </div>
      </div>
      <div id="reqList" style="margin-top:10px;"></div>
      <div id="deviceList整合" class="grid2" style="margin-top:10px;">
        <div><h3>Admin 列表</h3><div id="adminDevicesContainer"></div></div>
        <div><h3>Player 列表</h3><div id="playerDevicesContainer"></div></div>
      </div>
      <div id="seenList" style="font-size:0.8em; margin-top:10px; max-height:150px; overflow-y:auto; background:var(--row); padding:5px;"></div>
    </div>

    <div class="card" style="border-left-color:#3498db;">
      <h3 class="label-text"><i class="fas fa-bullhorn"></i> 跑馬燈公告</h3>
      <textarea id="broadcastMsg" placeholder="輸入公告內容..."></textarea>
      <div style="display:flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <button class="btn blue" style="flex:2;" id="btnBroadcast">發送公告</button>
        <button class="btn gray" style="flex:1;" id="btnBroadcastClear">清除</button>
        <label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" id="broadcastEnable" checked> 啟用</label>
        
           
          
        </label>
      </div>
    </div>

    <div class="card" style="border-left-color:#9b59b6;">
      <h3 class="label-text"><i class="fas fa-stopwatch"></i> 計時控制</h3>
      <div id="local-timer">00:00</div>
      <div style="display:flex; gap:10px;">
        <input type="number" id="setTimerSec" value="60" style="flex:1;">
        <button class="btn plus" id="btnTimerStart">▶️ 開始</button>
        <button class="btn warn" id="btnTimerPause">⏸️ 暫停</button>
      </div>
      <button class="global-btn" style="background:var(--danger); margin-top:10px;" id="btnTimerReset">🔄 重置時間</button>
    </div>

       <div id="controls-card" class="card" style="border-left-color:#f39c12;">
      
      <h2 style="margin:0 0 10px 0;"><i class="fa-solid fa-sliders"></i> 大螢幕控制 (admin2/super)</h2>
      <div class="row">
        <label>跑馬燈速度 (秒)</label>
        <input id="ctrlMarquee" type="range" min="3" max="60" step="1" value="10">
        <div class="hint">目前：<span id="ctrlMarqueeVal">10</span>s</div>
      </div>
      <div class="row">
        <label>跑馬燈字體大小</label>
        <input id="ctrlMarqueeFont" type="range" min="12" max="64" step="1" value="22">
        <div class="hint">目前：<span id="ctrlMarqueeFontVal">22</span>px</div>
      </div>
      </div>
     <div id="controls-card" class="card" style="border-left-color:#f39c12;">
      <div class="res-row" style="margin-bottom: 20px; background: rgba(0,0,0,0.25);">
    <div class="label-text">
     <i class="fas fa-comment-dots"></i> 彈幕顯示狀態
    </div>
     <button class="btn ok" id="btnToggleDanmaku" style="min-width: 100px;">
      <i class="fas fa-toggle-on"></i> <span id="danmakuStatusText">開啟中</span>
     </button>
    </div>
      <div class="row">
        <label>彈幕速度 (秒)</label>
        <input id="ctrlDanmaku" type="range" min="3" max="60" step="1" value="10">
        <div class="hint">目前：<span id="ctrlDanmakuVal">10</span>s</div>
       </div>
       <div class="row">
        <label>彈幕字體大小 (px)</label>
        <input id="ctrlFont" type="range" min="12" max="64" step="1" value="22">
        <div class="hint">目前：<span id="ctrlFontVal">22</span>px</div>
      </div>
    <div class="row">
        <label>彈幕透明度 (0.2 ~ 1)</label>
        <input id="ctrlOpacity" type="range" min="0.2" max="1" step="0.05" value="0.9">
        <div class="hint">目前：<span id="ctrlOpacityVal">0.9</span></div>
      </div>
      <div class="row">
        <label>同時彈幕上限</label>
        <input id="ctrlMaxOn" type="range" min="1" max="30" step="1" value="8">
        <div class="hint">目前：<span id="ctrlMaxOnVal">8</span> 條</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 20px;">
  <button class="btn blue" id="btnSaveCtrl" style="flex: 1;">立即套用</button>
  <button class="btn warn" id="btnResetCtrl" style="flex: 1;">還原預設</button>
  <button class="btn danger" id="btnClearDanmaku" style="flex: 1;">清空彈幕</button>
  </div>
      <div id="controls-lock-hint" class="hint hide" style="color:var(--danger);">大螢幕控制已鎖定。</div>
      </div>
    </div>

    <div id="player-list"></div>

    <div class="bottom-actions">
      <button class="global-btn" style="background:var(--warn);" id="btnResetAllRes">清空資源、分數與背包</button>
      <button class="global-btn" style="background:#c0392b;" id="btnResetTotal">徹底重置遊戲</button>
    </div>
  </div>
</div>

<script>
  // 1. Firebase 初始化 (請確保路徑正確)
  const firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const SUPER_UID = "AT3xEkjygoZEcCbrG8VdZVklEfj1";
  const ADMIN_REQUEST_PASSWORD = "345721";

  // 2. 核心輔助工具
  function getDeviceId() {
    let id = localStorage.getItem("device_id");
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
      localStorage.setItem("device_id", id);
    }
    return id;
  }
  function escapeHtml(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

  // 3. 資源配置與邏輯 (合併 admin super 快速連點)
  const resConfig = {
    time: { name:'時間', icon:'fa-clock', color:'#8b5cf6' },
    money: { name:'金錢', icon:'fa-wallet', color:'#fbbf24' },
    health: { name:'健康', icon:'fa-heartbeat', color:'#ef4444' },
    knowledge: { name:'知識', icon:'fa-book', color:'#3b82f6' },
    social: { name:'人際', icon:'fa-users', color:'#22c55e' },
    score: { name:'分數', icon:'fa-star', color:'#f59e0b' }
  };
  const __pendingDelta = {}; let __flushTimer = null;
  function adj(playerId, key, delta) {
    const el = document.getElementById(`p${playerId}-${key}`);
    if (el) el.innerText = String(Math.max(0, (Number(el.innerText)||0) + delta));
    const k = `p${playerId}.${key}`; __pendingDelta[k] = (__pendingDelta[k] || 0) + delta;
    if (__flushTimer) return;
    __flushTimer = setTimeout(() => {
      __flushTimer = null;
      for (const path in __pendingDelta) {
        const d = __pendingDelta[path]; if (!d) continue; __pendingDelta[path] = 0;
        const [pid, rkey] = path.split(".");
        db.ref(`players/${pid}/res/${rkey}`).transaction(cur => Math.max(0, (cur || 0) + d));
      }
    }, 150);
  }

  // 4. 公告控制 (同步速度與字體滑桿)
  function sendBroadcast() {
    const msg = document.getElementById("broadcastMsg").value || "";
    const enabled = document.getElementById("broadcastEnable").checked;
    const dir = document.getElementById("broadcastDir").value;
    db.ref("marquee").update({
      enabled, text: msg, direction: dir,
      bgColor: "#6c5ce7", textColor: "#ffffff",
      updatedAt: Date.now()
    });
  }

  // 5. 計時器
  let timeLeft = 60, isRunning = false;
  function syncTimer() { db.ref("timerSync").set({ timeLeft, isRunning, lastUpdate: Date.now() }); }
  db.ref("timerSync").on("value", s => {
    const d = s.val()||{}; timeLeft = d.timeLeft??timeLeft; isRunning = d.isRunning??isRunning;
    const m = Math.floor(timeLeft/60).toString().padStart(2,'0'), sc = (timeLeft%60).toString().padStart(2,'0');
    document.getElementById("local-timer").innerText = `${m}:${sc}`;
  });
  setInterval(() => { if (isRunning && timeLeft > 0) { timeLeft--; syncTimer(); } }, 1000);

  // 6. 大螢幕滑桿 UI 同步 (包含 MarqueeFont 與 Opacity)
  const $m = document.getElementById("ctrlMarquee"), $mf = document.getElementById("ctrlMarqueeFont"), 
        $d = document.getElementById("ctrlDanmaku"), $f = document.getElementById("ctrlFont"), 
        $x = document.getElementById("ctrlMaxOn"), $o = document.getElementById("ctrlOpacity");

  function updateSliderDisp() {
    document.getElementById("ctrlMarqueeVal").innerText = $m.value;
    document.getElementById("ctrlMarqueeFontVal").innerText = $mf.value;
    document.getElementById("ctrlDanmakuVal").innerText = $d.value;
    document.getElementById("ctrlFontVal").innerText = $f.value;
    document.getElementById("ctrlMaxOnVal").innerText = $x.value;
    document.getElementById("ctrlOpacityVal").innerText = $o.value;
  }
  [$m,$mf,$d,$f,$x,$o].forEach(el => el.addEventListener("input", updateSliderDisp));

  // 7. 渲染清單
  function renderPlayerList() {
    const list = document.getElementById("player-list"); list.innerHTML = "";
    for (let i=1; i<=10; i++) {
      let h = `<div class="card"><button class="clear-single" data-clear="${i}">清除玩家</button><h3><i class="fas fa-user"></i> <span id="p${i}-n"></span> (ID:${i})</h3>`;
      Object.keys(resConfig).forEach(k => {
        h += `<div class="res-row"><span class="label-text" style="color:${resConfig[k].color}"><i class="fas ${resConfig[k].icon}"></i> ${resConfig[k].name}</span>
              <div style="display:flex; align-items:center; gap:6px;">
                ${k!=='score'?`<button class="btn minus10" data-adj="${i}|${k}|-10">-10</button>`:''}
                <button class="btn minus" data-adj="${i}|${k}|-1">-1</button>
                <span class="val" id="p${i}-${k}">0</span>
                <button class="btn plus" data-adj="${i}|${k}|1">+1</button>
                ${k!=='score'?`<button class="btn plus10" data-adj="${i}|${k}|10">+10</button>`:''}
              </div></div>`;
      });
      h += `<div style="border-top:1px solid #ddd; margin-top:10px; padding-top:10px;">人生背包: <div id="p${i}-inv-display"></div>
            <input type="text" id="p${i}-inv-in" class="inv-input" placeholder="物品名"><button class="btn plus" data-addinv="${i}">新增</button></div></div>`;
      list.insertAdjacentHTML("beforeend", h);
      db.ref(`players/p${i}`).on("value", s => {
        const d = s.val()||{}; document.getElementById(`p${i}-n`).innerText = d.name || "空位";
        Object.keys(resConfig).forEach(k => { document.getElementById(`p${i}-${k}`).innerText = d.res?.[k] || 0; });
        const invDiv = document.getElementById(`p${i}-inv-display`); invDiv.innerHTML = "";
        if (d.inventory) Object.entries(d.inventory).forEach(([key, item]) => {
          invDiv.insertAdjacentHTML("beforeend", `<span class="inv-tag">${escapeHtml(item.name)}<i class="fas fa-times" data-delinv="${i}|${key}"></i></span>`);
        });
      });
    }
  }

  // 8. 權限與設備管理渲染
  function bindSuperData() {
    db.ref("joinRequests").on("value", s => {
      const list = document.getElementById("reqList"), entries = Object.entries(s.val()||{});
      list.innerHTML = entries.map(([k,r])=>`<div class="res-row"><div>${r.label} (${r.want})</div><button class="btn ok" data-approve="${k}">核准</button></div>`).join("");
    });
    db.ref("adminDevices").on("value", s => {
      const cont = document.getElementById("adminDevicesContainer"), entries = Object.entries(s.val()||{}).filter(e=>!e[1].revoked);
      cont.innerHTML = entries.map(([id,v])=>`<div class="res-row" style="font-size:0.7em;">${v.label}<button class="btn danger" data-revoke="adminDevices|${id}" style="padding:2px;">剔</button></div>`).join("");
    });
    db.ref("playerDevices").on("value", s => {
      const cont = document.getElementById("playerDevicesContainer"), entries = Object.entries(s.val()||{}).filter(e=>!e[1].revoked);
      cont.innerHTML = entries.map(([id,v])=>`<div class="res-row" style="font-size:0.7em;">${v.label}<button class="btn danger" data-revoke="playerDevices|${id}" style="padding:2px;">剔</button></div>`).join("");
    });
    db.ref("deviceLocks").on("value", s => {
      const d = s.val()||{};
      document.getElementById("adminLockBadge").innerText = d.adminLocked ? "LOCKED" : "UNLOCKED";
      document.getElementById("playerLockBadge").innerText = d.playerLocked ? "LOCKED" : "UNLOCKED";
    });
  }

document.addEventListener("DOMContentLoaded", () => {
    renderPlayerList();
    updateSliderDisp();

    // --- 10. 遠端數據真同步 (定義函數) ---
    function startRemoteSync() {
        // 監聽大螢幕控制參數 (controls)
        db.ref("controls").on("value", (snapshot) => {
            const data = snapshot.val() || {};
            const mapping = {
                marqueeDurationSec: "ctrlMarquee",
                danmakuDurationSec: "ctrlDanmaku",
                danmakuFontSizePx: "ctrlFont",
                danmakuMaxOnScreen: "ctrlMaxOn",
                danmakuOpacity: "ctrlOpacity"
            };
            for (const [key, id] of Object.entries(mapping)) {
                const el = document.getElementById(id);
                if (el && data[key] !== undefined) {
                    el.value = data[key];
                    const disp = document.getElementById(id + "Val");
                    if (disp) disp.innerText = el.value;
                }
            }
        });

        // 監聽跑馬燈設定 (marquee)
        db.ref("marquee").on("value", (snap) => {
            const m = snap.val() || {};
            if (m.fontSize) {
                document.getElementById("ctrlMarqueeFont").value = m.fontSize;
                document.getElementById("ctrlMarqueeFontVal").innerText = m.fontSize;
            }
            if (m.enabled !== undefined) {
                document.getElementById("broadcastEnable").checked = m.enabled;
            }
        });

        // 監聽彈幕設定 (danmakuSettings)
        db.ref("danmakuSettings").on("value", (snap) => {
            const d = snap.val() || {};
            const isEnabled = d.enabled ?? true;
            const btn = document.getElementById("btnToggleDanmaku");
            const txt = document.getElementById("danmakuStatusText");
            const icon = btn.querySelector("i");

            if (btn && txt) {
                btn.className = isEnabled ? "btn ok" : "btn danger";
                txt.innerText = isEnabled ? "開啟中" : "已關閉";
                if (icon) icon.className = isEnabled ? "fas fa-toggle-on" : "fas fa-toggle-off";
            }
            if (d.fontSize) {
                document.getElementById("ctrlFont").value = d.fontSize;
                document.getElementById("ctrlFontVal").innerText = d.fontSize;
            }
            if (d.opacity) {
                document.getElementById("ctrlOpacity").value = d.opacity;
                document.getElementById("ctrlOpacityVal").innerText = d.opacity;
            }
        });
    } // startRemoteSync 結束

    // --- 11. 按鈕事件綁定 ---
    
    // 彈幕開關點擊
    document.getElementById("btnToggleDanmaku").addEventListener("click", async () => {
        // Atomic toggle: flip /danmakuSettings/enabled
        const ref = db.ref("danmakuSettings/enabled");
        await ref.transaction((cur) => !(cur ?? true));
    });
    // 登入
    document.getElementById("btnLogin").addEventListener("click", () => auth.signInWithEmailAndPassword(document.getElementById("loginEmail").value, document.getElementById("loginPass").value));
    document.getElementById("btnLogout").addEventListener("click", () => auth.signOut().then(()=>location.reload()));
    document.getElementById("btnLogoutBlocked").addEventListener("click", () => auth.signOut().then(()=>location.reload()));
    
    // 申請
    document.getElementById("btnSubmitReq").addEventListener("click", () => {
      const pass = document.getElementById("reqPass").value;
      if(pass !== ADMIN_REQUEST_PASSWORD) return alert("密碼錯誤");
      db.ref("joinRequests").push({ deviceId: getDeviceId(), label: document.getElementById("deviceLabel").value, want: document.getElementById("reqType").value, createdAt: Date.now(), byEmail: auth.currentUser?.email || "anon" });
      alert("已送出申請");
    });

    // 公告與計時
    document.getElementById("btnBroadcast").addEventListener("click", sendBroadcast);
    document.getElementById("btnBroadcastClear").addEventListener("click", () => {
      db.ref("marquee").update({ enabled: false, text: "", updatedAt: Date.now() });
      document.getElementById("broadcastMsg").value = "";
    });
    document.getElementById("btnTimerStart").addEventListener("click", () => { isRunning = true; syncTimer(); });
    document.getElementById("btnTimerPause").addEventListener("click", () => { isRunning = false; syncTimer(); });
    document.getElementById("btnTimerReset").addEventListener("click", () => { isRunning = false; timeLeft = parseInt(document.getElementById("setTimerSec").value)||60; syncTimer(); });

    // 大螢幕套用 (整合同步至 danmakuSettings)
    document.getElementById("btnSaveCtrl").addEventListener("click", async () => {
      const payload = {
        marqueeDurationSec: Number($m.value), danmakuDurationSec: Number($d.value),
        danmakuFontSizePx: Number($f.value), danmakuMaxOnScreen: Number($x.value),
        danmakuOpacity: Number($o.value)
      };
      await db.ref("controls").update(payload);
      await db.ref("marquee").update({ fontSize: Number($mf.value), updatedAt: Date.now() });
      // 同步到 danmakuSettings
      await db.ref("danmakuSettings").update({
        enabled: true, fontSize: Number($f.value), maxLines: Number($x.value), opacity: Number($o.value),
        speedPxPerSec: Math.round(1400 / Math.max(3, Number($d.value))), updatedAt: Date.now()
      });

    // 還原預設（只改滑桿值 + 直接套用）
    document.getElementById("btnResetCtrl").addEventListener("click", async () => {
      document.getElementById("ctrlMarquee").value = 10;
      document.getElementById("ctrlMarqueeFont").value = 22;
      document.getElementById("ctrlDanmaku").value = 10;
      document.getElementById("ctrlFont").value = 22;
      document.getElementById("ctrlOpacity").value = 0.9;
      document.getElementById("ctrlMaxOn").value = 8;
      updateSliderDisp();
      document.getElementById("btnSaveCtrl").click();
    });

    // 清空彈幕（通知大螢幕把目前在跑的彈幕移除）
    document.getElementById("btnClearDanmaku").addEventListener("click", async () => {
      await db.ref("danmakuClearAt").set(Date.now());
    });

      alert("已套用");
    });

    // 點擊委派
    document.body.addEventListener("click", async e => {
      const t = e.target;
      if (t.hasAttribute("data-adj")) { const [p, k, d] = t.getAttribute("data-adj").split('|'); adj(p, k, Number(d)); }
      if (t.hasAttribute("data-clear")) { if(confirm("清空?")) db.ref(`players/p${t.getAttribute("data-clear")}`).set({name:"",res:{time:0,money:0,health:0,knowledge:0,social:0,score:0}}); }
      if (t.hasAttribute("data-addinv")) { const p = t.getAttribute("data-addinv"), v = document.getElementById(`p${p}-inv-in`).value; if(v){ db.ref(`players/p${p}/inventory`).push({name:v}); document.getElementById(`p${p}-inv-in`).value=""; } }
      if (t.hasAttribute("data-delinv")) { const [p, k] = t.getAttribute("data-delinv").split('|'); if(confirm("移除?")) db.ref(`players/p${p}/inventory/${k}`).remove(); }
      
      // SUPER 功能
      if (t.hasAttribute("data-approve")) {
        const k = t.getAttribute("data-approve"), snap = await db.ref("joinRequests/"+k).once("value"), r = snap.val();
        const path = r.want === "player" ? "playerDevices" : "adminDevices";
        const role = r.want === "admin2" ? "admin2" : "admin1";
        await db.ref(`${path}/${r.deviceId}`).set({ label: r.label, revoked: false, role, createdAt: Date.now() });
        await db.ref("joinRequests/"+k).remove();
      }
      if (t.hasAttribute("data-revoke")) { const [path, id] = t.getAttribute("data-revoke").split('|'); if(confirm("剔除?")) db.ref(`${path}/${id}`).update({revoked:true}); }
    });

 // Auth 與 Gate 邏輯
    auth.onAuthStateChanged(async user => {
        if (!user) { document.getElementById("auth-overlay").classList.remove("hide"); return; }
        document.getElementById("auth-overlay").classList.add("hide");
        
        const devId = getDeviceId();
        document.getElementById("deviceIdText").innerText = devId;
        document.getElementById("whoEmail").innerText = user.email;
        document.getElementById("whoDev").innerText = devId;

        if (user.uid === SUPER_UID) {
            document.getElementById("whoRole").innerText = "super";
            document.getElementById("super-panel").classList.remove("hide");
            document.getElementById("admin-main").classList.remove("hide");
            bindSuperData();
            startRemoteSync(); // 重要：SUPER 進入後啟動同步
        } else {
            const snap = await db.ref("adminDevices/"+devId).once("value");
            const dev = snap.val();
            if (dev && !dev.revoked) {
                document.getElementById("whoRole").innerText = dev.role;
                document.getElementById("admin-main").classList.remove("hide");
                startRemoteSync(); // 重要：Admin 進入後啟動同步
                if (dev.role === "admin1") {
                    document.getElementById("controls-lock-hint").classList.remove("hide");
                    [$m,$mf,$d,$f,$x,$o,"btnSaveCtrl","btnResetCtrl","btnClearDanmaku"].forEach(id => {
                        const el = document.getElementById(id);
                        if(el) el.disabled = true;
                    });
                }
            } else {
                document.getElementById("blocked-panel").classList.remove("hide");
            }
          }
      });
    });//

    // ... 前略 (Auth 與 Gate 邏輯) ...

    // 重置按鈕
    document.getElementById("btnResetAllRes").addEventListener("click", () => {
      if(confirm("清空全部玩家資源?")) {
        for(let i=1; i<=10; i++) {
          db.ref(`players/p${i}`).update({
            res: { time: 0, money: 0, health: 0, knowledge: 0, social: 0, score: 0 },
            inventory: null
          });
        }
      }
    });

    document.getElementById("btnResetTotal").addEventListener("click", () => {
      if(confirm("徹底重置資料庫?")) {
        // 建議連同 danmakuSettings 一起重置
        db.ref().update({
          players: null,
          timerSync: null,
          controls: null,
          purchaseFeed: null,
          marquee: null,
          danmakuSettings: null
        }).then(() => location.reload());
      }
    });
</script>
</body>
</html>
