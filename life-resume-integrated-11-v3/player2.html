<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player2｜人生履歷｜Player</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



<!-- Local bootstrap -->
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --stroke:rgba(2,6,23,.10);
  --text:#0f172a;
  --muted:rgba(15,23,42,.65);
  --shadow:0 16px 42px rgba(2,6,23,.10);
  --r:18px;

  --pri:#2563eb;
  --pri2:#06b6d4;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#f59e0b;

  --mq-sec:10s;
  --mq-anim: marquee-left;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding:12px 12px 24px;
  font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 12% 10%, rgba(37,99,235,.10), transparent 56%),
    radial-gradient(700px 420px at 88% 18%, rgba(6,182,212,.10), transparent 55%),
    linear-gradient(180deg,#ffffff,var(--bg));
  background-size: 140% 140%;
  animation: playerBG 18s ease-in-out infinite;
}
@keyframes playerBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.app{max-width:560px;margin:0 auto}
.hide{display:none!important}
.card{
  background: var(--card);
  border:1px solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}

/* ===== Sticky Top ===== */
.topSticky{
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 8px 0 10px;
  backdrop-filter: blur(10px);
}

/* Marquee */
#notice-bar{
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.85));
  color:#fff;
  border-radius:14px;
  overflow:hidden;
  display:none;
  border:1px solid rgba(255,255,255,.22);
  box-shadow: 0 10px 24px rgba(2,6,23,.14);
}
#notice-text{
  display:inline-block;
  padding:10px 0 10px 100%;
  font-weight:1000;
  animation: var(--mq-anim) var(--mq-sec) linear infinite;
}
@keyframes marquee-left{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
@keyframes marquee-right{
  from{transform:translateX(0)}
  to{transform:translateX(100%)}
}

/* Global timerSync */
#timerBar{
  margin-top:10px;
  background: rgba(220,38,38,.92);
  color:#fff;
  border-radius:14px;
  padding:10px 12px;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow: 0 10px 24px rgba(2,6,23,.14);
}
#timerBar .t{
  font-weight:1100;
  letter-spacing:.8px;
  font-size:18px;
}
#timerBar .s{
  font-size:12px;
  opacity:.9;
  font-weight:900;
}

/* Event timer strip */
.timerStrip{
  margin-top:10px;
  background: rgba(2,6,23,.04);
  border:1px solid rgba(2,6,23,.10);
  border-radius:14px;
  padding:10px 12px;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.timerStrip b{font-size:13px}
.timerStrip .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(2,6,23,.10);
  background: rgba(255,255,255,.95);
  color: rgba(15,23,42,.75);
  font-size:12px;
  font-weight:900;
}
.pill.ok{border-color: rgba(22,163,74,.25); color:#166534; background: rgba(22,163,74,.08)}
.pill.warn{border-color: rgba(245,158,11,.25); color:#92400e; background: rgba(245,158,11,.08)}
.pill.bad{border-color: rgba(220,38,38,.25); color:#991b1b; background: rgba(220,38,38,.08)}

/* Event banner */
#eventBanner{margin-top:10px;display:none}
.bannerCard{
  border-radius:16px;
  border:1px solid rgba(2,6,23,.10);
  background:#fff;
  box-shadow: 0 14px 30px rgba(2,6,23,.08);
  padding:10px 12px;
  text-align:left;
}
.bannerTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bannerTitle{font-weight:1100;font-size:14px;letter-spacing:.2px}
.bannerMeta{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.25}
.bannerBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  border:none;
  border-radius:12px;
  padding:10px 12px;
  font-weight:1000;
  cursor:pointer;
}
.btn.pri{background: rgba(37,99,235,.95); color:#fff}
.btn.sec{background: rgba(2,6,23,.06); color:var(--text); border:1px solid rgba(2,6,23,.10)}
.btn.ok{background: rgba(22,163,74,.95); color:#fff}
.btn.bad{background: rgba(220,38,38,.95); color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ===== Login ===== */
#login.card{padding:18px}
#login h2{margin:6px 0 14px;font-size:18px}
#login select,#login input{
  width:100%;
  padding:12px 12px;
  border-radius:14px;
  border:1px solid rgba(2,6,23,.12);
  background:#fff;
  color: var(--text);
  outline:none;
  margin:8px 0;
}
#join-btn{
  width:100%;
  padding:12px 14px;
  border:none;
  border-radius:14px;
  font-weight:1000;
  cursor:pointer;
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.88));
  color:#fff;
  margin-top:10px;
}
.mini-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.mini-btn{
  flex:1; min-width:160px;
  padding:10px 12px;
  border-radius:12px;
  border:none;
  font-weight:1000;
  cursor:pointer;
  background: rgba(2,6,23,.06);
  border:1px solid rgba(2,6,23,.10);
}
.mini-btn.danger{background: rgba(220,38,38,.92); color:#fff; border:none}
.mini-btn.blue{background: rgba(37,99,235,.92); color:#fff; border:none}

/* ===== Role Info ===== */
.playerCard{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  text-align:left;
}
.avatar{
  width:64px;height:64px;
  border-radius:18px;
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.78));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;
  flex:0 0 auto;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}
.avatar.hasPhoto #avatarEmoji{display:none}
.avatar.hasPhoto{background-size:cover;background-position:center}

.pInfo h2{margin:0;font-size:18px;letter-spacing:.2px}
.pInfo .sub{margin-top:4px;color:var(--muted);font-size:13px}
.badges{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.badge{
  padding:7px 10px;
  border-radius:999px;
  background: rgba(2,6,23,.05);
  border:1px solid rgba(2,6,23,.10);
  font-size:12px;
  color: rgba(15,23,42,.75);
}
.badge b{color:#0f172a}

/* ===== Radar bigger ===== */
.radarWrap{margin-top:12px;padding:14px 12px 12px}
#radarChart{width:100%!important;max-height:360px}
.radarHint{margin-top:8px;color:var(--muted);font-size:12px;text-align:left}

/* ===== Resources bigger, time last ===== */
.sectionTitle{
  margin:14px 4px 8px;
  text-align:left;
  color: rgba(15,23,42,.78);
  font-weight:1100;
  font-size:13px;
}
.resGrid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap:12px;
}
.resItem{padding:14px 14px 12px;text-align:left}
.resItem .k{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:1000}
.resItem .v{margin-top:8px;font-size:26px;font-weight:1100;letter-spacing:.3px}
.resItem.full{grid-column: 1 / -1;}
.bar{
  margin-top:12px;
  height:12px;border-radius:999px;
  background: rgba(2,6,23,.06);
  overflow:hidden;
  border: 1px solid rgba(2,6,23,.08);
}
.fill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, rgba(6,182,212,.95), rgba(37,99,235,.95));
}

/* ===== Achievements ===== */
.achWrap{margin-top:14px;padding:14px;text-align:left}
.achWrap h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.achGrid{display:grid;grid-template-columns: repeat(3, minmax(0,1fr));gap:10px}
.ach{
  border:1px solid rgba(2,6,23,.10);
  background: rgba(2,6,23,.03);
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
}
.ach .icon{font-size:20px}
.ach .name{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.2}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

/* ===== Shop direct buy ===== */
.shopWrap{margin-top:14px;padding:14px;text-align:left}
.shopWrap h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.shopList{display:flex;flex-direction:column;gap:10px}
.shopItem{
  display:flex; gap:10px; align-items:center;
  border:1px solid rgba(2,6,23,.10);
  background: rgba(2,6,23,.03);
  border-radius:14px;
  padding:10px;
}
.shopImg{
  width:56px;height:56px;border-radius:14px;
  background: rgba(2,6,23,.06);
  border:1px solid rgba(2,6,23,.08);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
}
.shopImg img{width:100%;height:100%;object-fit:cover;display:block}
.shopInfo{flex:1}
.shopName{font-weight:1100}
.shopMeta{margin-top:4px;color:var(--muted);font-size:12px}
.shopBuyBtn{
  border:none;border-radius:12px;
  padding:10px 12px;
  font-weight:1100; cursor:pointer;
  background: rgba(37,99,235,.95); color:#fff;
}
.shopBuyBtn:disabled{opacity:.55;cursor:not-allowed}

/* ===== Fullscreen Event Modal ===== */
#eventModal{
  position:fixed;
  inset:0;
  z-index:9999;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.modalCard{
  width:min(560px,100%);
  border-radius:22px;
  background:#fff;
  border:1px solid rgba(2,6,23,.10);
  box-shadow: 0 30px 80px rgba(2,6,23,.18);
  padding:16px;
  text-align:left;
}
.modalTitle{font-size:18px;font-weight:1200;letter-spacing:.2px;margin:0 0 8px}
.modalSub{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.35}
.kv{
  background: rgba(2,6,23,.03);
  border:1px solid rgba(2,6,23,.08);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
}
.kv b{display:block;font-size:12px;color:rgba(15,23,42,.72)}
.kv .v{margin-top:6px;font-weight:1000}
.modalBtns{display:flex;gap:10px;margin-top:12px}
.modalBtns .btn{flex:1}

body.lockScroll{overflow:hidden}
</style>
</head>

<body data-page="player">
<div class="app">

  <!-- login -->
  <div class="card" id="login">
    <h2>角色登入</h2>
    <select id="pid">
      <option value="1">1號玩家</option><option value="2">2號玩家</option>

<script>
/* ========= Firebase 初始化 ========= */
const firebaseConfig = {
  apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
  authDomain: "try-something-ddd1e.firebaseapp.com",
  databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "try-something-ddd1e",
  storageBucket: "try-something-ddd1e.firebasestorage.app",
  messagingSenderId: "245905464126",
  appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f",
  measurementId: "G-CG44LW3L84"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ========= constants ========= */
const resNames={time:"時間",money:"金錢",health:"健康",knowledge:"知識",social:"人際",score:"分數"};
const RES_KEYS=["time","money","health","knowledge","social","score"];

/* ========= state ========= */
let myId=null,myName="";
let radar=null;
let currentEvent=null;
let countdownTimer=null;
let myRes={ time:0, money:0, health:0, knowledge:0, social:0, score:0 };

/* ========= device + login (auto + lock + force logout) ========= */
const LOGIN_KEY="player_login_v1";
const LOGIN_AT_KEY="player_loginAtMs_v1";
const DEVICE_ID_KEY="lifeResume_deviceId_v3";
const DEVICE_LABEL_KEY="device_label";
let _forceLogoutRef=null;

function getDeviceId(){
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(36).slice(2) + "_" + Date.now().toString(36)));
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}
function getDeviceLabel(){ return (localStorage.getItem(DEVICE_LABEL_KEY)||"").trim(); }
function setDeviceLabel(v){
  v = String(v||"").trim();
  if(v) localStorage.setItem(DEVICE_LABEL_KEY, v);
  else localStorage.removeItem(DEVICE_LABEL_KEY);
}
function saveLogin(pid, name){
  localStorage.setItem(LOGIN_KEY, JSON.stringify({ pid:String(pid), name:String(name||""), ts:Date.now() }));
}
function loadLogin(){
  try{
    const raw = localStorage.getItem(LOGIN_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(!o || !o.pid || !o.name) return null;
    return o;
  }catch(e){ return null; }
}
function clearLogin(){ localStorage.removeItem(LOGIN_KEY); }
function setLoginAtMs(ms){ localStorage.setItem(LOGIN_AT_KEY, String(ms||Date.now())); }
function getLoginAtMs(){ return Number(localStorage.getItem(LOGIN_AT_KEY)||0)||0; }
function clearLoginAtMs(){ localStorage.removeItem(LOGIN_AT_KEY); }

function detachForceLogoutListener(){
  try{ _forceLogoutRef?.off?.(); }catch(e){}
  _forceLogoutRef=null;
}
function doLogoutToLogin(msg){
  if(msg) alert(msg);
  detachForceLogoutListener();
  clearLoginAtMs();
  clearLogin();
  document.getElementById("game").classList.add("hide");
  document.getElementById("login").classList.remove("hide");
}

function attachForceLogoutListener(devId){
  const loginAtMs = getLoginAtMs();
  _forceLogoutRef = db.ref(`devices/${devId}/forceLogoutAt`);
  _forceLogoutRef.on("value", (snap)=>{
    const kickAt = snap.val();
    if(!kickAt) return;
    if(loginAtMs && Number(kickAt) <= Number(loginAtMs)) return;
    doLogoutToLogin("你已被管理員強制登出。");
  });
}

async function tryUnlockSeat(pid){
  try{
    await db.ref(`seatLocks/p${pid}`).remove();
    return true;
  }catch(e){
    alert("解除鎖定失敗（可能 permission_denied）：\n" + (e?.message || e));
    return false;
  }
}
async function enforceSeatLockOrMaybeSelfUnlock(pid, playerName){
  const deviceId = getDeviceId();
  const label = getDeviceLabel() || ("玩家設備-" + deviceId.slice(0,6));
  const lockRef = db.ref(`seatLocks/p${pid}`);

  let snap;
  try{ snap = await lockRef.get(); }
  catch(err){ doLogoutToLogin("系統無法確認位子鎖定狀態，已中止登入。"); return false; }

  const lock = snap.val();
  if(lock && lock.deviceId && lock.deviceId !== deviceId){
    const ok = confirm(
      `此玩家位子（p${pid}）已被其他裝置使用：\n` +
      `${lock.label || lock.deviceId}\n\n` +
      `如果那台是你之前的裝置或已當機，你可以按「確定」解除舊鎖並重新登入。\n` +
      `如果不是你，請按「取消」。`
    );
    if(!ok){ doLogoutToLogin("已取消登入。"); return false; }
    const unlocked = await tryUnlockSeat(pid);
    if(!unlocked){ doLogoutToLogin("解除舊鎖失敗，已回到登入頁。"); return false; }
    return await enforceSeatLockOrMaybeSelfUnlock(pid, playerName);
  }

  if(!lock || !lock.deviceId){
    try{ await lockRef.set({ deviceId, name: playerName || "", label, ts: Date.now() }); }
    catch(err){ doLogoutToLogin("位子鎖定寫入失敗，已中止登入。"); return false; }
  }else{
    try{ await lockRef.update({ name: playerName || lock.name || "", label, ts: Date.now() }); }catch(e){}
  }
  return true;
}

/* ========= marquee (use /marquee like admin.html) ========= */
let _marqueeBound=false;
function bindMarquee(){
  if(_marqueeBound) return; _marqueeBound=true;

  const bar = document.getElementById("notice-bar");
  const text = document.getElementById("notice-text");

  db.ref("marquee").on("value", (snap)=>{
    const v = snap.val() || {};
    const enabled = (v.enabled !== false);
    const msg = String(v.text||"").trim();
    const speedSec = Math.max(3, Number(v.speedSec ?? 10));
    const dir = (v.direction === "right") ? "right" : "left";
    const fontSize = Math.max(12, Number(v.fontSize ?? 22));

    if(!enabled || !msg){
      bar.style.display="none";
      return;
    }

    bar.style.display="block";
    text.textContent = msg + "　　";
    text.style.fontSize = fontSize + "px";

    document.documentElement.style.setProperty("--mq-sec", `${speedSec}s`);
    document.documentElement.style.setProperty("--mq-anim", `marquee-${dir}`);

    if(v.bgColor) bar.style.background = v.bgColor;
    if(v.textColor) bar.style.color = v.textColor;

    // restart animation
    text.style.animation = "none";
    void text.offsetWidth;
    text.style.animation = `var(--mq-anim) var(--mq-sec) linear infinite`;
  });
}

/* ========= timerSync (global timer) ========= */
let _timerBound=false;
function bindTimerSync(){
  if(_timerBound) return; _timerBound=true;

  const bar = document.getElementById("timerBar");

  const sEl = document.getElementById("timerState");

  db.ref("timerSync").on("value", (snap)=>{

    const sec = Number(d.timeLeft||0);

    sEl.textContent = d.isRunning ? "進行中" : "暫停";

/* ========= shop: support cost (multi res) + bonus score + inventory + purchaseFeed ========= */
function normalizeImgSrc(raw){
  const s = String(raw||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(s.startsWith("./") || s.startsWith("/")) return s;
  if(s.startsWith("images/")) return "./" + s;
  return "./images/shop/" + s;
}

function bindShop(){
  const list = document.getElementById("shopList");
  const empty = document.getElementById("shopEmpty");

  db.ref("shop/items").on("value", s=>{
    const obj = s.val() || {};
    const items = Object.entries(obj)
      .map(([id,v])=>({id, ...(v||{})}))
      .filter(it=>it && it.enabled !== false);

    if(!items.length){
      list.innerHTML = "";
      empty.classList.remove("hide");
      return;
    }
    empty.classList.add("hide");

    list.innerHTML = items.map(it=>{
      const name = it.name || it.id;
      const imgSrc = normalizeImgSrc(it.imageUrl || it.image || it.imagePath || it.img || "");
      const bonus = Number(it.bonus||0);

      // ✅ 支援 cost（多資源）；若只有 price，視為 money cost
      let cost = {};
      if(it.cost && typeof it.cost==="object") cost = it.cost;
      else if(Number.isFinite(Number(it.price))) cost = { money: Number(it.price)||0 };

      const costText = Object.keys(cost)
        .map(k => (Number(cost[k])>0)?`${resNames[k]||k}:${Number(cost[k])}`:'')
        .filter(Boolean).join(" ");

      return `
        <div class="shopItem">
          <div class="shopImg">
            ${imgSrc ? `<img src="${escapeHtml(imgSrc)}" alt="">` : "🛍️"}
          </div>
          <div class="shopInfo">
            <div class="shopName">${escapeHtml(name)}</div>
            <div class="shopMeta">代價：${escapeHtml(costText||"免費")} ${bonus>0?`｜🏆 +${bonus}`:""}</div>
          </div>
          <button class="shopBuyBtn" onclick="buyItem('${escapeHtml(it.id)}')">兌換</button>
        </div>
      `;
    }).join("");
  });
}

window.buyItem = async (itemId)=>{
  if(!myId) return alert("請先登入玩家。");

  const snap = await db.ref(`shop/items/${itemId}`).get();
  const item = snap.val();
  if(!item || item.enabled === false) return alert("商品不存在或已下架");

  const name = item.name || itemId;
  const imgSrc = normalizeImgSrc(item.imageUrl || item.image || item.imagePath || item.img || "");
  const bonus = Number(item.bonus||0);

  let cost = {};
  if(item.cost && typeof item.cost==="object") cost = item.cost;
  else if(Number.isFinite(Number(item.price))) cost = { money: Number(item.price)||0 };

  // check
  for(const k of Object.keys(cost)){
    const need = Number(cost[k]||0);
    if(need<=0) continue;
    if((myRes[k]||0) < need) return alert(`❌ 你的「${resNames[k]||k}」不足！`);
  }

  if(!confirm(`準備好兌換「${name}」了嗎？`)) return;

  // deduct
  for(const k of Object.keys(cost)){
    const need = Number(cost[k]||0);
    if(need<=0) continue;
    await db.ref(`players/p${myId}/res/${k}`).transaction(cur=>{
      const now = Number(cur)||0;
      const next = now - need;
      if(next<0) return;
      return next;
    });
  }

  // inventory (成就/背包)
  await db.ref(`players/p${myId}/inventory`).push({ name, imageUrl: imgSrc, time: Date.now() });

  // purchase feed for display danmaku
  await db.ref("purchaseFeed").push({
    playerId: myId,
    playerName: myName || `玩家${myId}`,
    itemName: name,
    imageUrl: imgSrc,
    ts: Date.now()
  });

  // bonus score
  if(bonus>0){
    await db.ref(`players/p${myId}/res/score`).transaction(cur => (Number(cur)||0) + bonus);
  }

  alert(`🎉 成功獲得「${name}」！${bonus>0?`並額外獲得 ${bonus} 分！`:""}`);
};

/* ========= event deposit/refund + "later" fixed ========= */
function sanitizeKey(s){ return String(s||"").replace(/[.#$\[\]\/]/g, "_"); }
function getLockIdFromEvent(ev){
  const base = (ev && (ev.lockId || ev.assignId || ev.eid || ev.id || ev.createdAt || ev.deadlineTs || ev.title)) || "ev";
  return sanitizeKey(base);
}

async function applyEventDepositIfNeeded(ev){
  try{
    if(!ev || ev.status!=="pending") return;
    const evRef = db.ref(`players/p${myId}/activeEvent`);
    if(ev.depositApplied===true || ev.depositApplied==="LOCKED") return;

    const lockTx = await evRef.child("depositApplied").transaction(v=>{
      if(v===true || v==="LOCKED") return;
      return "LOCKED";
    });
    if(!lockTx.committed || lockTx.snapshot.val()!=="LOCKED") return;

    const cost = (ev.cost && typeof ev.cost === "object") ? ev.cost : null;
    if(!cost || !Object.keys(cost).length){
      await evRef.update({ depositApplied:true, depositAt:Date.now(), lockId:null, depositError:null });
      return;
    }

    const lockId = ev.lockId || getLockIdFromEvent(ev);
    const lockRef = db.ref(`players/p${myId}/eventLocks/${lockId}`);

    const committed=[];
    for(const k of Object.keys(cost)){
      const delta = Number(cost[k]||0);
      if(!isFinite(delta) || delta<=0) continue;

      const ref = db.ref(`players/p${myId}/res/${k}`);
      const tx = await ref.transaction(cur=>{
        const now = Number(cur)||0;
        const next = now - delta;
        if(next<0) return;
        return next;
      });

      if(!tx.committed){
        for(const c of committed){
          await db.ref(`players/p${myId}/res/${c.k}`).transaction(cur=> Number(cur||0)+c.delta);
        }
        await evRef.update({
          depositApplied:false,
          depositError:`資源不足：${resNames[k]||k} 不足，押金扣除失敗`,
          depositErrorAt:Date.now(),
          lockId
        });
        alert("⚠️ 押金扣除失敗（資源不足），請通知管理員調整。");
        return;
      }
      committed.push({k, delta});
    }

    await lockRef.set({ cost, eventTitle: ev.title||"", createdAt:Date.now(), status:"locked" });
    await evRef.update({ depositApplied:true, depositAt:Date.now(), lockId, depositError:null });
  }catch(e){ console.error(e); }
}

async function refundEventDepositIfNeeded(ev){
  try{
    if(!ev || ev.status!=="success") return;
    if(ev.depositApplied!==true) return;
    if(ev.refundApplied===true || ev.refundApplied==="LOCKED") return;

    const evRef = db.ref(`players/p${myId}/activeEvent`);
    const lockTx = await evRef.child("refundApplied").transaction(v=>{
      if(v===true || v==="LOCKED") return;
      return "LOCKED";
    });
    if(!lockTx.committed || lockTx.snapshot.val()!=="LOCKED") return;

    const lockId = ev.lockId || getLockIdFromEvent(ev);
    const lockSnap = await db.ref(`players/p${myId}/eventLocks/${lockId}`).get();
    const lock = lockSnap.val();
    const cost = (lock && lock.cost) ? lock.cost : ((ev.cost && typeof ev.cost==="object") ? ev.cost : null);

    if(cost && typeof cost==="object"){
      for(const k of Object.keys(cost)){
        const delta = Number(cost[k]||0);
        if(!isFinite(delta) || delta<=0) continue;
        await db.ref(`players/p${myId}/res/${k}`).transaction(cur => Number(cur||0) + delta);
      }
    }

    await db.ref(`players/p${myId}/eventLocks/${lockId}`).remove();
    await evRef.update({ refundApplied:true, refundAt:Date.now() });
  }catch(e){ console.error(e); }
}

/* ========= activeEvent: "later" never stuck ========= */
let _eventBound=false;
function bindActiveEvent(){
  if(_eventBound) return; _eventBound=true;

  db.ref(`players/p${myId}/activeEvent`).on("value", async s=>{
    const ev = s.val();
    currentEvent = ev || null;

    if(!ev){
      hideEventModal(); hideBanner(); hideTimer(); stopCountdown();
      return;
    }

    await applyEventDepositIfNeeded(ev);
    await refundEventDepositIfNeeded(ev);

    updateTimerFromEvent(ev);

    // ✅ 核心修正：不靠 listener 觸發，而是靠 uiState
    // uiState:
    // - "active"  -> 彈窗打開
    // - "pending" -> 只顯示 banner（可再打開）
    const uiState = (ev.uiState || "active");

    if(ev.status==="pending"){
      if(uiState==="active"){
        showEventModal(ev);
      }else{
        hideEventModal();
        showBanner(ev);
      }
      return;
    }

    if(ev.status==="success"){
      alert("🎉 管理員已同意：任務完成（押金已返還/並可能發放獎勵）");
      hideEventModal(); hideBanner(); hideTimer(); stopCountdown();
      return;
    }
    if(ev.status==="fail"){
      alert("❌ 管理員判定：任務未完成 / 失敗（押金不返還）");
      hideEventModal(); hideBanner(); hideTimer(); stopCountdown();
      return;
    }
  });

  document.getElementById("bannerOpenBtn").onclick = ()=>{
    if(!currentEvent) return;
    // ✅ 重新打開：把 uiState 改回 active
    db.ref(`players/p${myId}/activeEvent`).update({ uiState:"active", openedAt:Date.now() }).catch(()=>{});
  };

  document.getElementById("bannerHideBtn").onclick = ()=>{ document.getElementById("eventBanner").style.display="none"; };

  document.getElementById("bannerDoneBtn").onclick = async ()=>{
    if(!currentEvent || currentEvent.status!=="pending") return alert("目前沒有可回報的任務。");
    const fr = currentEvent.finishRequest || null;
    if(fr && fr.status==="pending") return alert("你已送出完成申請，等待管理員確認。");
    await db.ref(`players/p${myId}/activeEvent`).update({
      playerDone:true,
      playerDoneAt:Date.now(),
      finishRequest:{ status:"pending", requestedAt:Date.now() }
    });
    alert("✅ 已送出完成申請，等待管理員確認。");
  };
}

/* ===== Banner rendering ===== */
function showBanner(ev){
  const fr = ev.finishRequest || null;

  let stateText = "進行中";
  let stateClass = "pill ok";
  let metaExtra = "可點「查看任務」或完成後回報";

  if(ev.depositApplied === true){
    metaExtra = "押金已扣除｜完成後送出申請，待管理員同意才返還押金";
  }
  if(ev.depositError){
    metaExtra = "⚠️ 押金扣除失敗（資源不足）｜請通知管理員調整";
    stateText = "押金失敗";
    stateClass = "pill bad";
  }

  if(fr && fr.status==="pending"){
    stateText = "待管理員同意";
    stateClass = "pill warn";
    metaExtra = "你已送出完成申請，等待管理員確認（同意後才返還押金）";
  }
  if(fr && fr.status==="approved"){
    stateText = "已同意";
    stateClass = "pill ok";
    metaExtra = "管理員已同意完成（押金已返還/並可能發放獎勵）";
  }
  if(fr && fr.status==="rejected"){
    stateText = "被駁回";
    stateClass = "pill bad";
    metaExtra = "管理員駁回完成申請（可再次回報）";
  }

  document.getElementById("bannerTitle").innerText = `📌 ${ev.title || "目前任務"}`;
  document.getElementById("bannerMeta").innerText = [
    ev.pool ? `時段：${ev.pool}` : null,
    ev.eid ? `事件：${ev.eid}` : null,
    metaExtra
  ].filter(Boolean).join("｜");

  const bannerState = document.getElementById("bannerState");
  bannerState.className = stateClass;
  bannerState.innerText = stateText;

  const disabled = !!(fr && (fr.status==="pending" || fr.status==="approved"));
  document.getElementById("bannerDoneBtn").disabled = disabled;

  document.getElementById("eventBanner").style.display="block";
}
function hideBanner(){ document.getElementById("eventBanner").style.display="none"; }

/* ===== Timer strip + countdown ===== */
function updateTimerFromEvent(ev){
  if(ev.status==="pending" && ev.deadlineTs){
    document.getElementById("timerStrip").style.display = "flex";
    document.getElementById("evtPoolPill").innerText = "時段：" + (ev.pool || "-");
    document.getElementById("evtIdPill").innerText   = "事件：" + (ev.eid || "-");
    startCountdown(ev.deadlineTs);
  }else{
    hideTimer();
    stopCountdown();
  }
}
function hideTimer(){ document.getElementById("timerStrip").style.display="none"; }

function startCountdown(deadlineTs){
  stopCountdown();
  countdownTimer = setInterval(()=>{
    const left = Math.max(0, Number(deadlineTs||0) - Date.now());
    const m = Math.floor(left/60000);
    const s = Math.floor(left/1000)%60;
    document.getElementById("evtLeft").innerText = `${m}:${String(s).padStart(2,"0")}`;
    if(left<=0){
      stopCountdown();
      document.getElementById("evtLeft").innerText = "0:00";
    }
  }, 1000);
}
function stopCountdown(){
  if(countdownTimer){
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

/* ===== Formatting ===== */
function fmtImpact(cost, impactText){
  if(impactText && String(impactText).trim()) return String(impactText).trim();
  if(!cost || typeof cost!=="object" || !Object.keys(cost).length) return "（無押金）";
  return Object.keys(cost).map(k=>`${resNames[k]||k} -${cost[k]}`).join("、") + "（派發即扣）";
}
function fmtReward(reward){
  if(!reward || typeof reward!=="object" || !Object.keys(reward).length) return "（完成後由管理員發放）";
  return Object.keys(reward).map(k=>`${resNames[k]||k} +${reward[k]}`).join("、") + "（同意後發放）";
}

/* ===== Avatar (local + sync to players/pX.avatar) ===== */
function avatarKey(){ return `lr_avatar_p${myId}`; }

function setAvatar(dataUrl){
  const btn = document.getElementById("avatarBtn");
  btn.style.backgroundImage = `url('${dataUrl}')`;
  btn.classList.add("hasPhoto");
}
function clearAvatar(){
  const btn = document.getElementById("avatarBtn");
  btn.style.backgroundImage = "";
  btn.classList.remove("hasPhoto");
}

function loadAvatarFromLocal(){
  try{
    const v = localStorage.getItem(avatarKey());
    if(v) setAvatar(v);
  }catch(e){}
}

function saveAvatarToLocal(dataUrl){
  try{
    localStorage.setItem(avatarKey(), dataUrl);
  }catch(e){
    alert("照片太大導致無法儲存（可改小或之後改 Firebase Storage 同步）");
  }
}

function bindAvatarPicker(){
  const btn = document.getElementById("avatarBtn");
  const input = document.getElementById("avatarInput");

  btn.onclick = ()=> input.click();

  input.onchange = async ()=>{
    const file = input.files && input.files[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
      alert("請選擇圖片檔");
      return;
    }

    const dataUrl = await fileToDataUrl(file);
    const compressed = await compressImage(dataUrl, 360, 0.84);

    setAvatar(compressed);
    saveAvatarToLocal(compressed);

    // ✅ sync to Super/Admin/Display
    db.ref(`players/p${myId}`).update({
      avatar: compressed,
      avatarUpdatedAt: Date.now()
    }).catch(()=>{});

    input.value = "";
  };

  btn.ondblclick = ()=>{
    if(confirm("要清除照片，回到預設頭像嗎？")){
      clearAvatar();
      localStorage.removeItem(avatarKey());
      db.ref(`players/p${myId}`).update({ avatar:null, avatarUpdatedAt: Date.now() }).catch(()=>{});
    }
  };
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=> resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

function compressImage(dataUrl, maxSize=360, quality=0.84){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize / Math.max(w,h));
      w = Math.round(w * scale);
      h = Math.round(h * scale);

      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const out = c.toDataURL("image/jpeg", quality);
      resolve(out);
    };
    img.src = dataUrl;
  });
}

/* ===== util ===== */
function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

/* ========= autoJoin ========= */
(async function autoJoinIfPossible(){
  const saved = loadLogin();
  if(!saved) return;

  document.getElementById("pid").value = saved.pid;
  document.getElementById("pname").value = saved.name;

  try{
    await join();
  }catch(e){
    detachForceLogoutListener();
    clearLoginAtMs();
    clearLogin();
    document.getElementById("game").classList.add("hide");
    document.getElementById("login").classList.remove("hide");
  }
})();
