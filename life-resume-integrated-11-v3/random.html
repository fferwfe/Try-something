<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>隨機系統 - 人生履歷</title>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --row:rgba(2,6,23,0.06);
      --text:#0f172a; --muted:rgba(15,23,42,0.72); --shadow:rgba(2,6,23,0.12);
      --blue:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --violet:#8b5cf6;
      --radius:20px;
    }
    html,body{height:100%;margin:0}
    body{
      font-family:'Segoe UI','Microsoft JhengHei',system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(900px 520px at 12% 10%, rgba(37,99,235,.14), transparent 58%),
        radial-gradient(700px 420px at 88% 18%, rgba(6,182,212,.14), transparent 58%),
        radial-gradient(820px 520px at 50% 110%, rgba(139,92,246,.12), transparent 62%),
        linear-gradient(180deg,#ffffff,var(--bg));
      color:var(--text);
      padding:14px;
    }
    .wrap{max-width:820px;margin:0 auto}
    .card{
      background:var(--card);
      border:1px solid rgba(2,6,23,0.08);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:0 10px 26px var(--shadow);
      margin:12px 0;
    }
    h1{margin:4px 0 10px}
    .hint{color:var(--muted);font-weight:700;font-size:.95rem;line-height:1.4}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{
      border:none;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:900;
      display:inline-flex;gap:8px;align-items:center;justify-content:center;
      background:var(--row);color:var(--text);
    }
    .btn.blue{background:var(--blue);color:#fff}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.warn{background:var(--warn);color:#1b1203}
    .btn.violet{background:var(--violet);color:#fff}
    .btn.danger{background:var(--danger);color:#fff}
    input,select{
      width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(2,6,23,0.14);
      background:#fff;color:var(--text);box-shadow:0 4px 10px rgba(2,6,23,0.04);
      outline:none;font-size:16px;
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:720px){.grid2{grid-template-columns:1fr}}
    .result{
      display:flex;gap:12px;align-items:center;flex-wrap:wrap;
      padding:12px;border-radius:16px;background:rgba(2,6,23,0.04);border:1px solid rgba(2,6,23,0.08);
    }
    .ava{
      width:56px;height:56px;border-radius:18px;overflow:hidden;background:rgba(2,6,23,0.06);
      display:flex;align-items:center;justify-content:center;border:1px solid rgba(2,6,23,0.10);
    }
    .ava img{width:100%;height:100%;object-fit:cover;display:block}
    .pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;font-weight:900;background:rgba(2,6,23,0.06);}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}
  </style>

  <script src="./js/firebase.js"></script>
  <script src="./js/site-ui-db.js"></script>
</head>

<body data-page="super">
  <div class="wrap">
    <h1><i class="fa-solid fa-dice" style="color:var(--violet)"></i> 隨機系統</h1>
    <div class="hint">
      這頁是把「隨機抽選」從 Super 移出來，避免 Super 太雜。<br>
      會把結果寫到 <span class="mono">/system/random/latest</span>，其他頁若需要可直接讀這一筆。
    </div>

    <div class="card">
      <div class="grid2">
        <div>
          <div style="font-weight:950;margin:0 0 8px;">抽選範圍</div>
          <select id="scope">
            <option value="1-11">玩家 p1 ~ p11</option>
            <option value="1-10">玩家 p1 ~ p10</option>
          </select>
        </div>
        <div>
          <div style="font-weight:950;margin:0 0 8px;">隨機數字上限</div>
          <input id="maxN" type="number" value="100" min="2" max="9999">
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button class="btn violet" id="btnPickPlayer"><i class="fa-solid fa-user-check"></i> 抽玩家</button>
        <button class="btn blue" id="btnPickNumber"><i class="fa-solid fa-hashtag"></i> 抽數字</button>
        <button class="btn ok" id="btnPickBoth"><i class="fa-solid fa-wand-magic-sparkles"></i> 抽玩家＋數字</button>
        <button class="btn danger" id="btnClear"><i class="fa-solid fa-trash"></i> 清空結果</button>
      </div>

      <div class="result" style="margin-top:12px;">
        <div class="ava" id="avaBox"><span style="font-weight:950;opacity:.7;">-</span></div>
        <div style="min-width:220px;flex:1">
          <div style="font-weight:950;">結果</div>
          <div class="hint" id="resText">尚未抽選</div>
        </div>
        <div class="pill"><i class="fa-regular fa-clock"></i> <span id="tsText" class="mono">--</span></div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:950;margin-bottom:8px;">即時監看（/system/random/latest）</div>
      <div class="hint" id="watch">載入中…</div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const latestRef = db.ref("system/random/latest");
  const playersRef = db.ref("players");

  let playersCache = {};

  playersRef.on("value", s => { playersCache = s.val() || {}; });

  function scopeToRange(){
    const v = $("scope").value || "1-11";
    const [a,b] = v.split("-").map(x=>parseInt(x,10));
    return {a:Math.max(1,a||1), b:Math.max(1,b||11)};
  }

  function randInt(min,max){
    min=Math.ceil(min); max=Math.floor(max);
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function pickPlayer(){
    const {a,b}=scopeToRange();
    const pid = randInt(a,b);
    const p = playersCache["p"+pid] || {};
    return {
      pid: "p"+pid,
      name: (p.name || ("玩家"+pid)).trim(),
      avatar: p.avatar || ""
    };
  }

  function pickNumber(){
    const maxN = Math.max(2, Math.min(9999, parseInt($("maxN").value||"100",10)));
    return randInt(1, maxN);
  }

  function setLocalView(d){
    const avaBox = $("avaBox");
    avaBox.innerHTML = "";
    if(d?.playerAvatar){
      const img=document.createElement("img");
      img.src=d.playerAvatar;
      avaBox.appendChild(img);
    }else{
      const sp=document.createElement("span");
      sp.style.fontWeight="950"; sp.style.opacity=".7";
      sp.textContent = d?.playerId ? d.playerId.replace("p","P") : "-";
      avaBox.appendChild(sp);
    }

    const parts=[];
    if(d?.playerId) parts.push(`🎯 ${d.playerName}（${d.playerId}）`);
    if(Number.isFinite(d?.number)) parts.push(`🔢 數字：${d.number}`);
    $("resText").textContent = parts.length ? parts.join("｜") : "尚未抽選";
    $("tsText").textContent = d?.ts ? new Date(d.ts).toLocaleString() : "--";
  }

  async function writeLatest(partial){
    const payload = Object.assign({
      ts: Date.now(),
      by: "random.html"
    }, partial||{});
    await latestRef.set(payload);
  }

  $("btnPickPlayer").onclick = async ()=>{
    const p = pickPlayer();
    await writeLatest({
      playerId: p.pid,
      playerName: p.name,
      playerAvatar: p.avatar,
      number: null
    });
  };

  $("btnPickNumber").onclick = async ()=>{
    const n = pickNumber();
    await writeLatest({
      playerId: null,
      playerName: null,
      playerAvatar: null,
      number: n
    });
  };

  $("btnPickBoth").onclick = async ()=>{
    const p = pickPlayer();
    const n = pickNumber();
    await writeLatest({
      playerId: p.pid,
      playerName: p.name,
      playerAvatar: p.avatar,
      number: n
    });
  };

  $("btnClear").onclick = async ()=>{
    if(!confirm("確定清空隨機結果？")) return;
    await latestRef.set(null);
  };

  latestRef.on("value", s=>{
    const d=s.val();
    setLocalView(d);
    $("watch").textContent = d ? JSON.stringify(d, null, 2) : "（目前無資料）";
  });
})();
</script>
</body>
</html>
