<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷 - 系統入口</title>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;

  --admin:#ef4444;
  --display:#3b82f6;
  --player:#22c55e;
  --shop:#f59e0b;

  --radius:18px;
}

html,body{height:100%;}

body{
  font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(900px 420px at 15% 0%, rgba(59,130,246,.18), transparent 60%),
    radial-gradient(900px 420px at 85% 0%, rgba(34,197,94,.15), transparent 60%),
    radial-gradient(900px 520px at 50% 100%, rgba(139,92,246,.15), transparent 65%),
    var(--bg);
}

.menu{
  width:90%;
  max-width:420px;
  background:var(--card);
  border-radius:22px;
  padding:28px 22px 30px;
  text-align:center;
  box-shadow:0 20px 40px rgba(2,6,23,.15);
}

h1{
  margin:0 0 18px;
  font-size:1.7rem;
  letter-spacing:.5px;
  color:var(--text);
}

.btn{
  display:block;
  padding:18px;
  margin:14px 0;
  border-radius:16px;
  text-decoration:none;
  font-size:1.15rem;
  font-weight:900;
  color:white;
  transition:.25s ease;
  box-shadow:0 10px 20px rgba(2,6,23,.18);
}

/* ===== 各角色配色 ===== */
.admin-btn{
  background:linear-gradient(135deg,#f87171,var(--admin));
}

.display-btn{
  background:linear-gradient(135deg,#60a5fa,var(--display));
}

.player-btn{
  background:linear-gradient(135deg,#4ade80,var(--player));
}

.shop-btn{
  background:linear-gradient(135deg,#fbbf24,var(--shop));
}

/* hover 效果 */
.btn:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 18px 30px rgba(2,6,23,.25);
  filter:brightness(1.05);
}

p{
  margin-top:16px;
  font-size:.9rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="menu">
  <h1>人生履歷 遊戲系統</h1>

  <a href="admin.html" class="btn admin-btn">管理端</a>
  <a href="display.html" class="btn display-btn">顯示端</a>
  <a href="display_purchases.html" class="btn display-btn">顯示端（含達成／彈幕）</a>
  <a href="player.html" class="btn player-btn">玩家端</a>
  <a href="shop.html" class="btn shop-btn">商品端</a>

  <p>請確保在安全環境下操作，避免誤觸系統功能</p>
</div>
</body>
</html>
