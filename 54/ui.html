<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>UI 設定台｜背景選擇</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:rgba(15,23,42,.65);
      --shadow:rgba(2,6,23,.12);
      --blue:#3b82f6;
      --warn:#f59e0b;
      --radius:18px;
    }
    body{
      margin:0;
      padding:18px;
      min-height:100vh;
      font-family:system-ui,"Microsoft JhengHei",sans-serif;
      background:linear-gradient(135deg,#eef2ff,#f8fafc);
      color:var(--text);
    }
    .wrap{max-width:900px;margin:auto}
    h1{font-size:20px;margin:0 0 6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:16px}

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 18px 40px var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }
    label{
      font-weight:900;
      margin:10px 0 6px;
      display:block
    }
    select,input{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(2,6,23,.15);
      font-size:15px;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
    }
    .btns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px
    }
    .btn{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:12px 14px;
      font-weight:900;
      color:#fff;
      display:inline-flex;
      gap:8px;
      align-items:center;
      background:var(--blue);
      box-shadow:0 8px 18px var(--shadow);
    }
    .btn.warn{
      background:var(--warn);
      color:#1b1203
    }
    .hint{
      font-size:13px;
      color:var(--muted);
      margin-top:6px
    }
    .preview{
      margin-top:12px;
      border-radius:16px;
      overflow:hidden;
      border:1px dashed rgba(2,6,23,.25);
      height:180px;
      background:#f1f5f9;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-weight:900;
      position:relative;
    }
    .preview::after{
      content:"";
      position:absolute;
      inset:0;
      background:var(--preview-bg) center/cover no-repeat;
      opacity:.9;
    }
  </style>
</head>

<body>
<div class="wrap">
  <h1>🖼️ 背景設定</h1>
  <div class="sub">
    選「哪一個網頁」＋「哪一張圖片」當背景  
    （資料來源：<code>/system/uiConfig/bgOverride</code>）
  </div>

  <!-- 背景指定 -->
  <div class="card">
    <div class="grid">
      <div>
        <label>選擇網頁</label>
        <select id="pageKey">
          <option value="player">player</option>
          <option value="admin">admin</option>
          <option value="shop">shop</option>
          <option value="display">display</option>
          <option value="super">super</option>
        </select>
        <div class="hint">你要設定哪一個頁面的背景</div>
      </div>

      <div>
        <label>背景圖片檔名</label>
        <input id="bgFile" placeholder="例如：bg-player.jpg 或 my-bg.jpg">
        <div class="hint">圖片放在 <code>/images/backgrounds/</code></div>
      </div>
    </div>

    <div class="preview" id="preview">背景預覽</div>

    <div class="btns">
      <button class="btn" id="save">
        <i class="fa-solid fa-floppy-disk"></i> 套用背景
      </button>
      <button class="btn warn" id="clear">
        <i class="fa-solid fa-broom"></i> 清除（回固定）
      </button>
    </div>
  </div>

  <!-- 背景樣式 -->
  <div class="card">
    <label>背景透明度</label>
    <input id="bgOpacity" type="number" step="0.01" min="0" max="1" value="0.18">

    <label>背景模糊(px)</label>
    <input id="bgBlurPx" type="number" min="0" max="40" value="0">

    <div class="btns">
      <button class="btn" id="saveStyle">
        <i class="fa-solid fa-sliders"></i> 儲存樣式
      </button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
  authDomain: "try-something-ddd1e.firebaseapp.com",
  databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "try-something-ddd1e",
  storageBucket: "try-something-ddd1e.firebasestorage.app",
  messagingSenderId: "245905464126",
  appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const ref = firebase.database().ref("system/uiConfig");
const $ = id => document.getElementById(id);

function clamp01(v){
  v = Number(v);
  return Number.isFinite(v) ? Math.max(0,Math.min(1,v)) : 0;
}

function updatePreview(){
  const f = $("bgFile").value.trim();
  $("preview").style.setProperty(
    "--preview-bg",
    f ? `url('./images/backgrounds/${f}')` : "none"
  );
}

$("bgFile").addEventListener("input", updatePreview);

$("pageKey").addEventListener("change", async ()=>{
  const s = await ref.get();
  const v = s.val() || {};
  $("bgFile").value = (v.bgOverride || {})[$("pageKey").value] || "";
  updatePreview();
});

ref.on("value", snap=>{
  const v = snap.val() || {};
  $("bgOpacity").value = v.defaults?.bgOpacity ?? 0.18;
  $("bgBlurPx").value = v.defaults?.bgBlurPx ?? 0;
  $("bgFile").value = (v.bgOverride || {})[$("pageKey").value] || "";
  updatePreview();
});

$("save").onclick = async ()=>{
  await ref.child("bgOverride")
    .child($("pageKey").value)
    .set($("bgFile").value.trim());
  await ref.update({updatedAt:Date.now()});
  alert("背景已套用");
};

$("clear").onclick = async ()=>{
  await ref.child("bgOverride")
    .child($("pageKey").value)
    .remove();
  await ref.update({updatedAt:Date.now()});
  alert("已清除，會回固定背景");
};

$("saveStyle").onclick = async ()=>{
  await ref.child("defaults").update({
    bgOpacity: clamp01($("bgOpacity").value),
    bgBlurPx: Number($("bgBlurPx").value) || 0
  });
  await ref.update({updatedAt:Date.now()});
  alert("背景樣式已儲存");
};
</script>
</body>
</html>
