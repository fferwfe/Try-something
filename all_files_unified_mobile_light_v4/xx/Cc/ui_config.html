<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UI 資源庫</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
body{font-family:system-ui,'Microsoft JhengHei';background:#f6f8fb;margin:0;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;
box-shadow:0 6px 18px rgba(0,0,0,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
.plus{background:#3b82f6;color:#fff}
.danger{background:#ef4444;color:#fff}
.ok{background:#22c55e;color:#fff}
input,select{width:100%;padding:8px;margin-top:6px}
.badge{font-size:12px;color:#555}
</style>
</head>

<body>

<div class="card">
  <h2 style="display:flex;justify-content:space-between;align-items:center">
    🎨 UI 背景資源庫
    <button class="btn plus" onclick="openAdd()">➕ 新增</button>
  </h2>
</div>

<div class="grid" id="bgList"></div>

<!-- 新增彈窗 -->
<div id="addBox" style="display:none" class="card">
  <h3>➕ 新增背景</h3>
  名稱 <input id="bgName">
  檔名(images/) <input id="bgFile" placeholder="bg-xxx.jpg">
  <div>
    <label><input type="checkbox" value="player"> player</label>
    <label><input type="checkbox" value="admin"> admin</label>
    <label><input type="checkbox" value="display"> display</label>
  </div>
  <br>
  <button class="btn ok" onclick="saveBg()">儲存</button>
</div>

<script>
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=firebase.database();

const list=document.getElementById("bgList");

db.ref("uiAssets/backgrounds").on("value",snap=>{
  list.innerHTML="";
  snap.forEach(s=>{
    const d=s.val();
    list.innerHTML+=`
      <div class="card">
        <b>${d.name}</b>
        <div class="badge">${d.file}</div>
        <div class="badge">${(d.usableFor||[]).join(", ")}</div>
        <button class="btn ok" onclick="applyBg('${s.key}')">套用</button>
        <button class="btn danger" onclick="delBg('${s.key}')">刪除</button>
      </div>`;
  });
});

function openAdd(){ addBox.style.display="block"; }

function saveBg(){
  const name=bgName.value;
  const file=bgFile.value;
  const usable=[...addBox.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value);
  db.ref("uiAssets/backgrounds").push({name,file,usableFor:usable});
  addBox.style.display="none";
}

function delBg(id){
  if(confirm("刪除？")) db.ref("uiAssets/backgrounds/"+id).remove();
}

function applyBg(id){
  db.ref("system/uiConfig/activeBackground/player").set(id);
  alert("已套用到 player");
}
</script>

</body>
</html>
