<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - 修正版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 10px; margin: 0; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #2a2a2a; padding: 30px; border-radius: 15px; text-align: center; }
        input[type="password"] { padding: 12px; border-radius: 8px; border: 1px solid #444; width: 200px; margin-bottom: 15px; font-size: 20px; text-align: center; }
        .admin-content { display: none; padding: 10px; }
        .player-card { background: #1e1e1e; margin-bottom: 15px; padding: 15px; border-radius: 10px; border-left: 5px solid #ffd700; }
        .res-row { display: grid; grid-template-columns: 1fr 2fr; align-items: center; margin: 8px 0; }
        .controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .val { font-family: monospace; font-size: 1.4em; color: #00d4ff; min-width: 40px; text-align: center; }
        button { padding: 10px 15px; border-radius: 5px; border: none; background: #444; color: white; cursor: pointer; font-weight: bold; }
        .login-btn { background: #e74c3c; width: 100%; height: 50px; font-size: 18px; }
        .reset-btn { background: #c0392b; width: 100%; margin: 30px 0; padding: 15px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2>管理員驗證 (1111)</h2>
            <input type="password" id="admin-pass" placeholder="請輸入密碼" autocomplete="off">
            <button class="login-btn" onclick="checkPass()">登入控制台</button>
        </div>
    </div>

    <div class="admin-content" id="admin-main">
        <h2 style="text-align:center">資源主控台</h2>
        <div id="admin-list"></div>
        <button class="reset-btn" onclick="resetAll()">⚠️ 一鍵重置所有玩家數據</button>
    </div>

    <script>
        // 核心設定
        const MASTER_PASSWORD = "1111"; 
        const firebaseConfig = { 
            databaseURL: "https://try-something-ddd1e-default-rtdb.firebaseio.com" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const resTypes = { gold: '金', wood: '木', water: '水', fire: '火', earth: '土' };

        // 密碼驗證邏輯
        function checkPass() {
            const inputField = document.getElementById('admin-pass');
            const inputVal = inputField.value.trim(); // 去除前後空白
            
            if (inputVal === MASTER_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-main').style.display = 'block';
                initAdmin();
            } else {
                alert("密碼錯誤！\n您輸入的是: [" + inputVal + "]\n預期的是: [1111]");
                inputField.value = ""; // 清空輸入框
            }
        }

        function initAdmin() {
            const listDiv = document.getElementById('admin-list');
            listDiv.innerHTML = ""; 
            for (let i = 1; i <= 10; i++) {
                let resHtml = '';
                Object.keys(resTypes).forEach(key => {
                    resHtml += `
                        <div class="res-row">
                            <span>${resTypes[key]}</span>
                            <div class="controls">
                                <button onclick="updatePRes(${i}, '${key}', -1)">-</button>
                                <span class="val" id="p${i}-${key}">0</span>
                                <button onclick="updatePRes(${i}, '${key}', 1)">+</button>
                            </div>
                        </div>`;
                });
                listDiv.innerHTML += `<div class="player-card"><h3 id="p${i}-name">玩家 ${i}</h3>${resHtml}</div>`;
                
                db.ref(`players/p${i}`).on('value', s => {
                    const d = s.val() || {};
                    document.getElementById(`p${i}-name`).innerText = (d.name || '未加入') + ` (${i})`;
                    Object.keys(resTypes).forEach(k => {
                        const val = (d.res && d.res[k]) ? d.res[k] : 0;
                        document.getElementById(`p${i}-${k}`).innerText = val;
                    });
                });
            }
        }

        function updatePRes(id, k, v) { 
            db.ref(`players/p${id}/res/${k}`).transaction(c => (c || 0) + v); 
        }

        function resetAll() {
            if(confirm("確定歸零所有玩家資源？")) {
                for(let i=1; i<=10; i++) {
                    db.ref(`players/p${i}/res`).set({gold:0, wood:0, water:0, fire:0, earth:0});
                }
            }
        }
    </script>
</body>
</html>
