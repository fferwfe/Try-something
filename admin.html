<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生履歷-管理系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 10px; text-align: center; margin: 0; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #222; padding: 35px; border-radius: 15px; border: 1px solid #444; }
        input { padding: 15px; font-size: 20px; width: 220px; margin-bottom: 20px; border-radius: 8px; border: none; text-align: center; }
        .login-btn { background: #e74c3c; color: white; padding: 15px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .admin-content { display: none; padding-bottom: 50px; }
        .player-card { background: #1e1e1e; margin: 15px auto; padding: 15px; border-radius: 10px; max-width: 500px; border-left: 5px solid #00d4ff; text-align: left; }
        .res-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .val { color: #ffd700; font-weight: bold; font-size: 1.4em; min-width: 40px; text-align: center; }
        .ctrl-btn { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2>管理員驗證 (1111)</h2>
            <input type="password" id="admin-pass" placeholder="輸入密碼">
            <button class="login-btn" onclick="checkPass()">進入控制台</button>
        </div>
    </div>

    <div class="admin-content" id="admin-main">
        <h1>資源主控台</h1>
        <div id="admin-list"></div>
        <button style="background:#c0392b; color:white; padding:15px; width:95%; max-width:500px; border:none; border-radius:8px; margin-top:20px; cursor:pointer;" onclick="resetAll()">⚠️ 一鍵歸零所有玩家</button>
    </div>

    <script>
        // 設定亞洲伺服器
        const firebaseConfig = { 
            databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 更新資源類別
        const resTypes = { time: '時間', money: '金錢', health: '健康', knowledge: '知識', social: '人際' };

        // 登入驗證函式
        function checkPass() {
            const passInput = document.getElementById('admin-pass');
            if (passInput && passInput.value.trim() === "1111") {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-main').style.display = 'block';
                initAdmin();
            } else { 
                alert("密碼錯誤！請輸入 1111"); 
            }
        }

        // 初始化玩家列表
        function initAdmin() {
            const listDiv = document.getElementById('admin-list');
            listDiv.innerHTML = "";
            for (let i = 1; i <= 10; i++) {
                let html = `<div class="player-card"><h3 id="p${i}-name">玩家 ${i}</h3>`;
                Object.keys(resTypes).forEach(k => {
                    html += `<div class="res-row"><span>${resTypes[k]}</span><div>
                        <button class="ctrl-btn" onclick="updateP(${i},'${k}',-1)">-</button>
                        <span class="val" id="p${i}-${k}">0</span>
                        <button class="ctrl-btn" onclick="updateP(${i},'${k}',1)">+</button>
                    </div></div>`;
                });
                html += `</div>`;
                listDiv.innerHTML += html;
                
                // 監聽數據變化
                db.ref(`players/p${i}`).on('value', (s) => {
                    const d = s.val() || {};
                    const nameTag = document.getElementById(`p${i}-name`);
                    if(nameTag) nameTag.innerText = (d.name || '待加入') + ` (${i})`;
                    
                    Object.keys(resTypes).forEach(k => {
                        const valTag = document.getElementById(`p${i}-${k}`);
                        if(valTag) valTag.innerText = (d.res && d.res[k]) ? d.res[k] : 0;
                    });
                });
            }
        }

        // 更新數據函式
        function updateP(id, k, v) { 
            db.ref(`players/p${id}/res/${k}`).transaction(c => (c || 0) + v); 
        }

        // 一鍵重置
        function resetAll() { 
            if(confirm("確定歸零所有玩家嗎？")) { 
                for(let i=1; i<=10; i++) {
                    db.ref(`players/p${i}/res`).set({time:0, money:0, health:0, knowledge:0, social:0}); 
                }
            } 
        }
    </script>
</body>
</html>
