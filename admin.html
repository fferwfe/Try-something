<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生履歷-萬能管理主控台</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; margin: 0; }
        .card { background: #34495e; padding: 15px 20px; border-radius: 20px; max-width: 650px; margin: 15px auto; text-align: left; position: relative; border-left: 6px solid #1abc9c; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .res-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; background: rgba(0,0,0,0.25); padding: 8px 15px; border-radius: 12px; }
        .val { font-size: 1.5em; font-weight: bold; color: #f1c40f; min-width: 60px; text-align: center; }
        .btn { border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; margin: 0 3px; transition: 0.2s; }
        .plus { background: #27ae60; } .plus10 { background: #2ecc71; }
        .minus { background: #c0392b; } .minus10 { background: #e74c3c; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; box-sizing: border-box; font-size: 16px; background: #ecf0f1; color: #333; }
        
        /* 背包管理樣式 */
        .inv-tag { background: #8e44ad; color: white; padding: 4px 12px; border-radius: 8px; margin: 4px; display: inline-block; font-size: 14px; }
        .inv-tag i { cursor: pointer; margin-left: 8px; color: #ffbcbc; }
        .inv-input { width: 60% !important; display: inline-block !important; padding: 10px !important; margin: 0 !important; }

        .bottom-actions { max-width: 650px; margin: 40px auto; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .global-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .clear-single { position: absolute; top: 15px; right: 15px; background: #8e44ad; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: none; color: white; cursor: pointer; }
        .label-text { font-weight: bold; font-size: 1.1em; display: flex; align-items: center; gap: 8px; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .hide { display: none !important; }
        #local-timer { font-size: 2.5em; font-weight: 900; font-family: monospace; color: #f1c40f; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <div style="background:#2c3e50; padding:40px; border-radius:25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h2><i class="fas fa-lock"></i> 管理員驗證</h2>
            <input type="password" id="admin-pass" placeholder="輸入密碼 (1111)">
            <button class="global-btn" style="background:#e74c3c; width: 250px; margin: 20px auto;" onclick="checkPass()">進入控制中心</button>
        </div>
    </div>

    <div id="admin-main" class="hide">
        <h1>🎮 人生履歷 控制中心</h1>

        <div class="card" style="border-left-color: #3498db;">
            <h3 class="label-text"><i class="fas fa-bullhorn"></i> 跑馬燈公告</h3>
            <textarea id="broadcastMsg" placeholder="輸入要廣播的公告內容..."></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="global-btn" style="background:#3498db; flex: 2;" onclick="sendTextBroadcast()">發送公告</button>
                <button class="global-btn" style="background:#7f8c8d; flex: 1;" onclick="clearBroadcast()">清除</button>
            </div>
        </div>

        <div class="card" style="border-left-color: #9b59b6;">
            <h3 class="label-text"><i class="fas fa-stopwatch"></i> 計時控制</h3>
            <div id="local-timer">00:00</div>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="number" id="setTimerSec" value="60" style="flex: 1;">
                <button class="btn plus" style="flex: 1;" onclick="controlTimer('start')">▶️ 開始</button>
                <button class="btn minus" style="background:#f39c12; flex: 1;" onclick="controlTimer('pause')">⏸️ 暫停</button>
            </div>
            <button class="global-btn" style="background:#e74c3c;" onclick="controlTimer('reset')">🔄 重製時間</button>
        </div>

        <div id="player-list"></div>

        <div class="bottom-actions">
            <button class="global-btn" style="background:#f39c12;" onclick="resetAllRes()">
                <i class="fas fa-eraser"></i> 清空資源、分數與背包 (不刪玩家名字)
            </button>
            <button class="global-btn" style="background:#c0392b;" onclick="resetTotal()">
                <i class="fas fa-trash-alt"></i> 徹底重置遊戲 (清空所有資料)
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 修改後的資源配置，包含分數
        const resConfig = { 
            time: { name: '時間', icon: 'fa-clock', color: '#9b59b6' }, 
            money: { name: '金錢', icon: 'fa-wallet', color: '#f1c40f' }, 
            health: { name: '健康', icon: 'fa-heartbeat', color: '#e74c3c' }, 
            knowledge: { name: '知識', icon: 'fa-book', color: '#3498db' }, 
            social: { name: '人際', icon: 'fa-users', color: '#2ecc71' },
            score: { name: '分數', icon: 'fa-star', color: '#f39c12' }
        };

        let timeLeft = 60, isRunning = false;

        function checkPass() {
            if (document.getElementById('admin-pass').value === "1111") {
                document.getElementById('auth-overlay').classList.add('hide');
                document.getElementById('admin-main').classList.remove('hide');
                renderList();
            } else alert("密碼錯誤");
        }

        function renderList() {
            const list = document.getElementById('player-list'); list.innerHTML = "";
            for(let i=1; i<=10; i++) {
                let h = `<div class="card"><button class="clear-single" onclick="clearP(${i})">清除玩家</button><h3><i class="fas fa-user"></i> <span id="p${i}-n"></span> (ID:${i})</h3>`;
                
                Object.keys(resConfig).forEach(k => {
                    const isScore = k === 'score';
                    h += `<div class="res-row"><span class="label-text" style="color:${resConfig[k].color}"><i class="fas ${resConfig[k].icon}"></i> ${resConfig[k].name}</span><div>
                        ${!isScore ? `<button class="btn minus10" onclick="adj(${i},'${k}',-10)">-10</button>` : ''}
                        <button class="btn minus" onclick="adj(${i},'${k}',-1)">-1</button>
                        <span class="val" id="p${i}-${k}">0</span>
                        <button class="btn plus" onclick="adj(${i},'${k}',1)">+1</button>
                        ${!isScore ? `<button class="btn plus10" onclick="adj(${i},'${k}',10)">+10</button>` : ''}
                    </div></div>`;
                });

                // 加入人生背包管理區塊
                h += `
                <div style="border-top:1px solid #555; margin-top:15px; padding-top:15px;">
                    <span class="label-text"><i class="fas fa-briefcase"></i> 人生背包管理:</span>
                    <div id="p${i}-inv-display" style="margin: 8px 0; min-height:30px;"></div>
                    <input type="text" id="p${i}-inv-in" class="inv-input" placeholder="手動增加物品名稱...">
                    <button class="btn plus" onclick="addInv(${i})">新增</button>
                </div></div>`;
                
                list.innerHTML += h;

                db.ref(`players/p${i}`).on('value', s => {
                    const d = s.val() || {};
                    document.getElementById(`p${i}-n`).innerText = d.name || '空位';
                    Object.keys(resConfig).forEach(k => {
                        const target = document.getElementById(`p${i}-${k}`);
                        if(target) target.innerText = (d.res && d.res[k]) || 0;
                    });
                    
                    const invDiv = document.getElementById(`p${i}-inv-display`);
                    invDiv.innerHTML = "";
                    if(d.inventory) {
                        for(let key in d.inventory) {
                            invDiv.innerHTML += `<span class="inv-tag">${d.inventory[key].name} <i class="fas fa-times" onclick="delInv(${i},'${key}')"></i></span>`;
                        }
                    }
                });
            }
        }

        function adj(id, k, v) { db.ref(`players/p${id}/res/${k}`).transaction(c => Math.max(0, (c||0) + v)); }
        
        function addInv(id) {
            const input = document.getElementById(`p${id}-inv-in`);
            if(!input.value) return;
            db.ref(`players/p${id}/inventory`).push({ name: input.value });
            input.value = "";
        }

        function delInv(id, key) { if(confirm("確定移除此清單物品？")) db.ref(`players/p${id}/inventory/${key}`).remove(); }

        function sendTextBroadcast() { db.ref('broadcast').set({ message: document.getElementById('broadcastMsg').value, time: Date.now() }); }
        function clearBroadcast() { db.ref('broadcast').set({ message: "", time: Date.now() }); document.getElementById('broadcastMsg').value = ""; }
        
        function controlTimer(action) {
            if(action === 'start') isRunning = true;
            else if(action === 'pause') isRunning = false;
            else if(action === 'reset') { isRunning = false; timeLeft = parseInt(document.getElementById('setTimerSec').value); }
            syncTimer();
        }
        function adjTimer(v) { timeLeft = Math.max(0, timeLeft + v); syncTimer(); }
        function syncTimer() { db.ref('timerSync').set({ timeLeft: timeLeft, isRunning: isRunning, lastUpdate: Date.now() }); }
        
        setInterval(() => { if(isRunning && timeLeft > 0) { timeLeft--; syncTimer(); } }, 1000);
        db.ref('timerSync').on('value', s => {
            const d = s.val(); if(!d) return;
            timeLeft = d.timeLeft; isRunning = d.isRunning;
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
            const sc = (timeLeft%60).toString().padStart(2,'0');
            document.getElementById('local-timer').innerText = `${m}:${sc}`;
        });

        function clearP(id) { if(confirm("確定清空此玩家名字與數據？")) db.ref(`players/p${id}`).set({ name: "", res: { time:0, money:0, health:0, knowledge:0, social:0, score:0 } }); }
        
        function resetAllRes() { 
            if(confirm("確定清空所有人的資源、分數與背包？")) { 
                for(let i=1; i<=10; i++) db.ref(`players/p${i}`).update({ res: { time:0, money:0, health:0, knowledge:0, social:0, score:0 }, inventory: null }); 
            } 
        }
        
        function resetTotal() { 
            if(confirm("重置將清空整個資料庫（含名字與公告），確定？")) { 
                db.ref('players').remove(); db.ref('broadcast').remove(); db.ref('timerSync').remove(); location.reload(); 
            } 
        }
    </script>
</body>
</html>
