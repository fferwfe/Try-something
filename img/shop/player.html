<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>玩家端（Player）</title>

  <!-- Firebase + helpers（沿用你專案的共用檔） -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/common.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    :root{ --bg:#f6f8fb; --card:#ffffff; --line:rgba(2,6,23,0.14); --text:#0f172a; --muted:rgba(15,23,42,0.72); }
    body{ margin:0; font-family:'Segoe UI','Microsoft JhengHei',sans-serif; background:var(--bg); color:var(--text); }
    .wrap{ max-width:900px; margin:0 auto; padding:18px; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 10px 24px rgba(2,6,23,0.06); margin-bottom:14px; }
    h1{ margin:0 0 10px 0; }
    .row{ margin:10px 0; }
    label{ display:block; font-weight:900; margin-bottom:6px; }
    input,select,textarea{
      width:100%; box-sizing:border-box;
      border-radius:12px; font-size:16px;
      border:1px solid var(--line);
      background:#fff; color:var(--text);
      padding:10px 12px;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff; color:var(--text);
      padding:10px 12px; border-radius:12px;
      font-weight:900; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn.blue{ background:rgba(59,130,246,0.12); }
    .btn.ok{ background:rgba(34,197,94,0.12); }
    .btn.danger{ background:rgba(239,68,68,0.12); }
    .hint{ color:var(--muted); font-size:13px; line-height:1.4; }

    /* 跑馬燈 */
    #notice-bar{ display:none; border-radius:16px; overflow:hidden; border:1px solid var(--line); }
    #notice-bar .marquee-container{ padding:10px 12px; white-space:nowrap; overflow:hidden; background:#6c5ce7; color:#fff; }
    #notice-text{
      display:inline-block; padding-left:100%;
      font-weight:900;
      --mq-sec: 10s;
      --mq-anim: marquee-left;
      animation: var(--mq-anim) var(--mq-sec) linear infinite;
    }
    @keyframes marquee-left  { 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }
    @keyframes marquee-right { 0%{transform:translateX(0)} 100%{transform:translateX(100%)} }

    /* 計時 */
    #timer-display{ display:inline-block; padding:10px 16px; border-radius:14px; background:#e74c3c; color:#fff; font-weight:900; font-family:monospace; font-size:22px; letter-spacing:1px; }

    /* 資源 */
    .grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
    @media(max-width:720px){ .grid{ grid-template-columns:repeat(2,1fr); } }
    .kv{ border:1px solid var(--line); border-radius:16px; padding:12px; background:#fff; }
    .kv .k{ font-weight:900; display:flex; align-items:center; gap:8px; }
    .kv .v{ font-size:26px; font-weight:950; margin-top:6px; }

    /* 商店 */
    #shop-display{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media(max-width:720px){ #shop-display{ grid-template-columns:1fr; } }
    .shop-card{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background:#fff;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .shop-img{
      width:60px;height:60px;border-radius:14px;
      object-fit:cover;border:1px solid var(--line);
      background:#f1f5f9;
      flex:0 0 auto;
    }
    .shop-meta{ flex:1; }
    .cost{ margin-top:6px; font-size:13px; color:var(--muted); line-height:1.35; }
    .buybar{ margin-top:10px; display:flex; justify-content:flex-end; }
    .inv{ display:flex; flex-wrap:wrap; gap:8px; }
    .inv-item{ border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:#fff; font-weight:900; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🎮 玩家端</h1>

    <div id="notice-bar" class="card" style="padding:0;">
      <div class="marquee-container"><span id="notice-text"></span></div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <div><b>計時：</b> <span id="timer-display">00:00</span></div>
        <div class="hint">商店兌換成功會推送彈幕到大螢幕</div>
      </div>
    </div>

    <!-- 登入（玩家選座 + 暱稱） -->
    <div id="login" class="card">
      <h2 style="margin:0 0 10px 0;">加入玩家</h2>

      <div class="row">
        <label>玩家 ID（1~10）</label>
        <select id="pid">
          <option value="1">玩家 1</option><option value="2">玩家 2</option><option value="3">玩家 3</option><option value="4">玩家 4</option><option value="5">玩家 5</option>
          <option value="6">玩家 6</option><option value="7">玩家 7</option><option value="8">玩家 8</option><option value="9">玩家 9</option><option value="10">玩家 10</option>
        </select>
      </div>

      <div class="row">
        <label>暱稱</label>
        <input id="pname" placeholder="輸入你的名字">
      </div>

      <div class="row">
        <label>裝置名稱（可選，給 SUPER 辨識）</label>
        <input id="deviceLabel" placeholder="例如：玩家手機A">
      </div>

      <button class="btn blue" onclick="join()"><i class="fas fa-door-open"></i> 進入</button>
      <div class="hint" style="margin-top:10px;">※ 玩家端不需要 Firebase Auth（你的原設計）。</div>
    </div>

    <!-- 遊戲主畫面 -->
    <div id="game" class="card" style="display:none;">
      <h2 style="margin:0 0 10px 0;">你好，<span id="me">-</span></h2>

      <div class="card" style="margin:0 0 12px 0;">
        <h3 style="margin:0 0 8px 0;">📦 你的資源</h3>
        <div class="grid">
          <div class="kv"><div class="k"><i class="fas fa-clock"></i> 時間</div><div class="v" id="r-time">0</div></div>
          <div class="kv"><div class="k"><i class="fas fa-wallet"></i> 金錢</div><div class="v" id="r-money">0</div></div>
          <div class="kv"><div class="k"><i class="fas fa-heartbeat"></i> 健康</div><div class="v" id="r-health">0</div></div>
          <div class="kv"><div class="k"><i class="fas fa-book"></i> 知識</div><div class="v" id="r-knowledge">0</div></div>
          <div class="kv"><div class="k"><i class="fas fa-users"></i> 人際</div><div class="v" id="r-social">0</div></div>
          <div class="kv"><div class="k"><i class="fas fa-star"></i> 分數</div><div class="v" id="r-score">0</div></div>
        </div>
      </div>

      <div class="card" style="margin:0 0 12px 0;">
        <h3 style="margin:0 0 8px 0;">🏪 商店（達成/兌換）</h3>
        <div id="shop-msg" class="hint"></div>
        <div id="shop-display"></div>
      </div>

      <div class="card" style="margin:0;">
        <h3 style="margin:0 0 8px 0;">🎒 人生背包</h3>
        <div id="inventory-list" class="inv"></div>
      </div>
    </div>
  </div>

<script>
  // 你專案的 firebase.js 應該已經 initializeApp
  const db = firebase.database();

  const resNames = { time:'時間', money:'金錢', health:'健康', knowledge:'知識', social:'人際', score:'分數' };

  let myId = null;
  let myName = "";
  let myRes = {};

  /***********************
   * Device Seen（保留你原本 player 的匿名心跳）
   ***********************/
  function getDeviceId(){
    const KEY = "device_id";
    let id = localStorage.getItem(KEY);
    if(!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
      localStorage.setItem(KEY, id);
    }
    return id;
  }
  function setDeviceLabel(label){
    const v = String(label || "").trim();
    if(v) localStorage.setItem("device_label", v);
  }
  function getDeviceLabel(){
    return (localStorage.getItem("device_label") || "").trim();
  }
  async function heartbeat(){
    try{
      const deviceId = getDeviceId();
      const label = getDeviceLabel() || ("玩家設備-" + deviceId.slice(0,6));
      await db.ref("devicesSeen/" + deviceId).update({
        label,
        kind: "player",
        page: "player.html",
        lastSeen: Date.now()
      });
    }catch(e){
      // rules 擋就算了，不影響遊戲
    }
  }

  function join(){
    myId = Number(document.getElementById("pid").value);
    myName = (document.getElementById("pname").value || "").trim();
    if(!myName) return alert("請輸入暱稱");

    const devLabel = (document.getElementById("deviceLabel").value || "").trim();
    if(devLabel) setDeviceLabel(devLabel);
    heartbeat();
    setInterval(heartbeat, 15000);

    db.ref(`players/p${myId}`).update({ name: myName });

    document.getElementById("login").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("me").innerText = myName;

    syncMyData();
    syncInventory();
    syncShop();
    syncTimer();
    syncMarquee();
  }

  function syncMyData(){
    db.ref(`players/p${myId}/res`).on("value", s=>{
      myRes = s.val() || {};
      ["time","money","health","knowledge","social","score"].forEach(k=>{
        document.getElementById("r-"+k).innerText = myRes[k] || 0;
      });
    });
  }

  function syncInventory(){
    db.ref(`players/p${myId}/inventory`).on("value", s=>{
      const list = document.getElementById("inventory-list");
      list.innerHTML = "";
      const data = s.val();
      if(!data){
        list.innerHTML = `<span class="hint">尚無任何成就物品</span>`;
        return;
      }
      Object.keys(data).forEach(key=>{
        const it = data[key];
        list.insertAdjacentHTML("beforeend", `<span class="inv-item">✨ ${escapeHtml(it.name || "未命名")}</span>`);
      });
    });
  }

  function syncShop(){
    // 商店開關（保留你原本邏輯：shopSettings/isOpen）
    db.ref("shopSettings/isOpen").on("value", s=>{
      const isOpen = s.val() || false;
      const display = document.getElementById("shop-display");
      const msg = document.getElementById("shop-msg");
      if(!isOpen){
        display.style.opacity = "0.35";
        display.style.pointerEvents = "none";
        msg.style.color = "#b45309";
        msg.innerText = "🏪 商店盤點中...";
      }else{
        display.style.opacity = "1";
        display.style.pointerEvents = "auto";
        msg.innerText = "";
      }
    });

    // 商品清單
    db.ref("shop/items").on("value", s=>{
      const box = document.getElementById("shop-display");
      box.innerHTML = "";
      const data = s.val();
      if(!data){
        box.innerHTML = `<div class="hint">目前沒有商品</div>`;
        return;
      }
      Object.keys(data).forEach(key=>{
        const item = data[key] || {};
        const nm = item.name || "未命名";
        const img = (item.imageUrl || "").trim();
        const bonus = Number(item.bonus || 0);
        const cost = item.cost || {};

        const costText = Object.keys(resNames)
          .map(k => (cost[k] > 0) ? `${resNames[k]}:${cost[k]}` : "")
          .filter(Boolean).join(" / ");

        box.insertAdjacentHTML("beforeend", `
          <div class="shop-card">
            ${img ? `<img class="shop-img" src="${img}" onerror="this.style.display='none'">` : `<div class="shop-img" style="display:flex;align-items:center;justify-content:center;">🛍️</div>`}
            <div class="shop-meta">
              <div style="font-weight:950;font-size:16px;">${escapeHtml(nm)}</div>
              <div class="cost">成本：${escapeHtml(costText || "無")}</div>
              ${bonus > 0 ? `<div class="cost" style="color:#b45309;">獎勵分數：+${bonus}</div>` : ``}
              <div class="buybar">
                <button class="btn ok" onclick="processBuy(${JSON.stringify(item).replaceAll('"','&quot;')})">
                  <i class="fas fa-bolt"></i> 達成
                </button>
              </div>
            </div>
          </div>
        `);
      });
    });
  }

  // 兌換/達成：扣資源 -> inventory -> purchaseFeed -> 加分
  function processBuy(item){
    const name = item.name;
    const cost = item.cost || {};
    const bonus = Number(item.bonus || 0);
    const imageUrl = item.imageUrl || "";

    // 檢查資源是否足夠
    for(const k in cost){
      if((myRes[k] || 0) < cost[k]) return alert(`❌ 你的「${resNames[k]}」不足！`);
    }

    if(!confirm(`準備好達成「${name}」了嗎？`)) return;

    // 1) 扣除成本
    for(const k in cost){
      db.ref(`players/p${myId}/res/${k}`).set((myRes[k] || 0) - cost[k]);
    }

    // 2) 入背包
    db.ref(`players/p${myId}/inventory`).push({ name, imageUrl, time: Date.now() });

    // 3) 推送彈幕（大螢幕監聽 purchaseFeed）
    db.ref("purchaseFeed").push({
      playerId: myId,
      playerName: myName || `玩家${myId}`,
      itemName: name,
      imageUrl: imageUrl,
      ts: Date.now()
    });

    // 4) 加分
    if(bonus > 0){
      db.ref(`players/p${myId}/res/score`).transaction(cur => (cur || 0) + bonus);
    }

    alert(`🎉 成功獲得「${name}」！${bonus > 0 ? `並額外獲得 ${bonus} 分！` : ''}`);
  }

  // 計時器同步
  function syncTimer(){
    db.ref("timerSync").on("value", s=>{
      const d = s.val();
      if(!d) return;
      const sec = Number(d.timeLeft || 0);
      const m = Math.floor(sec/60).toString().padStart(2,"0");
      const sc = (sec%60).toString().padStart(2,"0");
      const el = document.getElementById("timer-display");
      el.innerText = `${m}:${sc}`;
      el.style.opacity = d.isRunning ? "1" : "0.55";
    });
  }

  // 跑馬燈同步（玩家也看到公告）
  function syncMarquee(){
    const noticeBar = document.getElementById("notice-bar");
    const noticeText = document.getElementById("notice-text");

    db.ref("marquee").on("value", snap=>{
      const v = snap.val() || {};
      const enabled = v.enabled ?? true;
      const text = (v.text ?? "").toString();
      const direction = (v.direction === "right") ? "right" : "left";
      const fontSize = Math.max(12, Number(v.fontSize ?? 22));
      const speedSec = Math.max(3, Number(v.speedSec ?? v.durationSec ?? 10)); // 兼容你之前兩種欄位

      if(enabled && text.trim()){
        noticeBar.style.display = "block";
        noticeText.textContent = "📢 " + text;
        noticeText.style.fontSize = fontSize + "px";
        noticeText.style.setProperty("--mq-sec", `${speedSec}s`);
        noticeText.style.setProperty("--mq-anim", `marquee-${direction}`);

        if(v.bgColor) noticeBar.querySelector(".marquee-container").style.background = v.bgColor;
        if(v.textColor) noticeBar.querySelector(".marquee-container").style.color = v.textColor;

        noticeText.style.animation = "none";
        void noticeText.offsetWidth;
        noticeText.style.animation = `var(--mq-anim) var(--mq-sec) linear infinite`;
      }else{
        noticeBar.style.display = "none";
      }
    });
  }
</script>
</body>
</html>
