<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Display</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
body{margin:0;background:#020617;color:#fff;overflow:hidden}
#marquee{position:fixed;top:0;width:100%;background:#6c5ce7;padding:10px;font-size:22px}
#danmaku-layer{position:fixed;top:60px;left:0;width:100%;height:100%;pointer-events:none}
.danmaku{
position:absolute;
padding:6px 14px;
border-radius:999px;
background:rgba(245,158,11,var(--danmaku-opacity,0.9));
white-space:nowrap;
font-weight:bold;
animation:fly var(--fly-time,10s) linear forwards;
}
@keyframes fly{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div id="marquee"></div>
<div id="danmaku-layer"></div>

<script>
const firebaseConfig={
apiKey:"YOUR_KEY",
databaseURL:"YOUR_DB_URL"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const marquee=document.getElementById("marquee");
const danLayer=document.getElementById("danmaku-layer");

let controls={};

db.ref("controls").on("value",s=>{
controls=s.val()||{};
document.documentElement.style.setProperty("--danmaku-opacity",controls.danmakuOpacity||0.9);
});

db.ref("marquee").on("value",s=>{
const m=s.val()||{};
if(m.enabled && m.text){
marquee.style.display="block";
marquee.innerText="📢 "+m.text;
marquee.style.fontSize=(m.fontSize||22)+"px";
}else{
marquee.style.display="none";
}
});

db.ref("purchaseFeed").limitToLast(10).on("child_added",s=>{
if(controls.danmakuEnabled===false) return;

const d=s.val();
const div=document.createElement("div");
div.className="danmaku";
div.innerText=d.text;
div.style.top=Math.random()*70+"%";
div.style.setProperty("--fly-time",(controls.danmakuDurationSec||10)+"s");
danLayer.appendChild(div);
setTimeout(()=>div.remove(),(controls.danmakuDurationSec||10)*1000);
});
</script>

</body>
</html>
