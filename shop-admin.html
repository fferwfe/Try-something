<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>商店後台管理 - 主控端</title>
    <style>
        body { font-family: sans-serif; background: #1a202c; color: white; padding: 30px; }
        .config-panel { background: #2d3748; padding: 25px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #60a5fa; margin-top: 0; text-align: center; }
        .door-btn { width: 100%; padding: 20px; font-size: 20px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        .closed { background: #4a5568; color: #cbd5e0; }
        .open { background: #48bb78; color: white; box-shadow: 0 0 20px rgba(72, 187, 120, 0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1a202c; color: white; border: 1px solid #4a5568; border-radius: 5px; box-sizing: border-box; }
        .btn-add { width: 100%; padding: 12px; background: #4299e1; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .item-list { margin-top: 20px; }
        .item { background: #334155; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .del-x { color: #f56565; cursor: pointer; font-weight: bold; padding: 5px; }
    </style>
</head>
<body>

<div class="config-panel">
    <h2>🏪 商店大門控制</h2>
    <button id="door-toggle" class="door-btn closed" onclick="toggleDoor()">商店關閉中 🔒</button>

    <hr style="border: 0; border-top: 1px solid #4a5568; margin-bottom: 20px;">
    
    <h3>➕ 新增商品</h3>
    <input type="text" id="in-name" placeholder="商品名稱 (如：幸福住宅)">
    <div style="font-size: 12px; color: #a0aec0;">格式: money:-50, health:10 (負值為扣除)</div>
    <input type="text" id="in-cost" placeholder="資源變動量">
    <button class="btn-add" onclick="addItem()">上架商品</button>

    <div class="item-list" id="admin-items"></div>
</div>

<script>
    // 門禁控制
    function toggleDoor() {
        let status = localStorage.getItem('shopDoor') === 'open' ? 'closed' : 'open';
        localStorage.setItem('shopDoor', status);
        updateUI();
    }

    function updateUI() {
        const isOpen = localStorage.getItem('shopDoor') === 'open';
        const btn = document.getElementById('door-toggle');
        btn.innerText = isOpen ? "商店已開啟 ✅" : "商店關閉中 🔒";
        btn.className = "door-btn " + (isOpen ? "open" : "closed");
        renderItems();
    }

    // 商品管理
    function addItem() {
        const name = document.getElementById('in-name').value;
        const costStr = document.getElementById('in-cost').value;
        if(!name || !costStr) return;

        let items = JSON.parse(localStorage.getItem('shopInventory') || '[]');
        items.push({ id: Date.now(), name, costStr });
        localStorage.setItem('shopInventory', JSON.stringify(items));
        
        document.getElementById('in-name').value = '';
        document.getElementById('in-cost').value = '';
        renderItems();
    }

    function delItem(id) {
        let items = JSON.parse(localStorage.getItem('shopInventory') || '[]');
        items = items.filter(i => i.id !== id);
        localStorage.setItem('shopInventory', JSON.stringify(items));
        renderItems();
    }

    function renderItems() {
        const items = JSON.parse(localStorage.getItem('shopInventory') || '[]');
        document.getElementById('admin-items').innerHTML = items.map(i => `
            <div class="item">
                <span><b>${i.name}</b> <small>(${i.costStr})</small></span>
                <span class="del-x" onclick="delItem(${i.id})">✖</span>
            </div>
        `).join('');
    }

    updateUI();
</script>
</body>
</html>
