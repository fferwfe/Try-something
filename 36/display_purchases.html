<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大螢幕 - 排行榜 + 達成清單</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    body{
      background:#ffffff;
      color:#2c3e50;
      font-family:'PingFang TC','Microsoft JhengHei',sans-serif;
      margin:0;
      padding:10px 20px;
      overflow:hidden;
    }

    /* Header */
    #display-header{
      display:flex;
      gap:15px;
      margin-bottom:12px;
      height:60px;
      position:relative;
      z-index:2;
    }
    #announcement-bar{
      flex:3;
      background:#3498db;
      border-radius:12px;
      display:none;
      overflow:hidden;
      white-space:nowrap;
    }
    #msg-box{
      display:inline-block;
      padding-left:100%;
      /* 跑馬燈快一點 */
      animation: marquee var(--marquee-duration, 10s) linear infinite;
      font-size:1.5em;
      font-weight:900;
      color:white;
      line-height:60px;
      margin:0;
    }
    @keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

    #timer-bar{
      flex:1;
      background:#e74c3c;
      border-radius:12px;
      text-align:center;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #timer-box{margin:0;font-size:2.5em;font-family:monospace;font-weight:900;}

    /* Layout */
    #main{
      display:flex;
      gap:16px;
      height:calc(100vh - 60px - 24px);
      position:relative;
      z-index:1;
    }
    #left{
      flex:1.2;
      min-width:520px;
      overflow:hidden;
    }
    #right{
      flex:1;
      overflow:hidden;
      border-left:1px dashed #e5e5e5;
      padding-left:16px;
    }

    /* Scoreboard rows (copy from display.html) */
    .p-row{
      background:#fdfdfd;
      margin-bottom:5px;
      padding:5px 15px;
      border-radius:8px;
      display:flex;
      align-items:center;
      border:1px solid #eee;
      height:7vh;
    }
    .rank-1{background:#fffcf0;border-color:#ffd700;border-left:10px solid #ffd700;}
    .rank-2{background:#fafdff;border-color:#bdc3c7;border-left:10px solid #bdc3c7;}
    .rank-3{background:#fff9f5;border-color:#e67e22;border-left:10px solid #e67e22;}

    .rank-num{font-size:1.4em;font-weight:900;width:35px;color:#95a5a6;}
    .rank-1 .rank-num{color:#f1c40f;}

    .player-name{font-size:1.2em;font-weight:800;width:140px;color:#34495e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .res-summary{flex:1;display:flex;justify-content:space-around;font-size:0.95em;padding:0 10px;}
    .res-item{display:flex;align-items:center;gap:4px;font-weight:700;}
    .res-label{font-size:0.85em;}

    .res-score{color:#e67e22;background:rgba(230,126,34,0.1);padding:2px 10px;border-radius:6px;border:1px solid rgba(230,126,34,0.2);}

    .total-box{width:100px;text-align:right;border-left:1px dashed #ddd;padding-left:10px;}
    .total-val{font-size:1.6em;font-weight:900;color:#2980b9;}
    .pts{font-size:0.5em;color:#7f8c8d;margin-left:2px;}

    /* Purchases panel */
    #purchases-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 10px 0;
      font-size:1.3em;
      font-weight:900;
      color:#2c3e50;
    }

    .buy-card{
      background:#fafafa;
      border:1px solid #eee;
      border-radius:12px;
      padding:10px 12px;
      margin-bottom:10px;
    }
    .buy-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }
    .buy-name{
      font-weight:900;
      color:#34495e;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:70%;
    }
    .buy-count{
      font-weight:800;
      color:#f39c12;
      font-size:0.95em;
      background:rgba(243,156,18,0.12);
      border:1px solid rgba(243,156,18,0.25);
      padding:2px 8px;
      border-radius:999px;
    }
    .buy-items{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      max-height:18vh;
      overflow:hidden;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#ffffff;
      border:1px solid #eaeaea;
      padding:4px 8px;
      border-radius:999px;
      font-weight:800;
      font-size:0.92em;
      color:#2c3e50;
    }
    .chip img{
      width:22px;
      height:22px;
      border-radius:6px;
      object-fit:cover;
      border:1px solid #eee;
    }
    .chip .icon{
      width:22px;
      height:22px;
      border-radius:6px;
      border:1px dashed #ddd;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#aaa;
      font-size:0.95em;
    }

    /* Danmaku overlay */
    #danmaku-layer{
      position:fixed;
      left:0;
      top:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      overflow:hidden;
      z-index:3;
    }
    .danmaku{
      font-size: var(--danmaku-font-size, 22px);
      position:absolute;
      right:-40vw;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:6px 12px;
      border-radius:999px;
      font-weight:900;
      color:#ffffff;
      background:rgba(243,156,18,0.95); /* 橙色彈幕 */
      box-shadow:0 6px 18px rgba(0,0,0,0.14);
      will-change:transform;
      animation:fly 10s linear forwards;
    }
    .danmaku img{
      width:28px;
      height:28px;
      border-radius:8px;
      object-fit:cover;
      border:2px solid rgba(255,255,255,0.7);
    }
    @keyframes fly{
      from{transform:translateX(0);} to{transform:translateX(-140vw);} 
    }
  </style>
</head>
<body>
  <div id="danmaku-layer"></div>

  <div id="display-header">
    <div id="announcement-bar"><p id="msg-box"></p></div>
    <div id="timer-bar"><h1 id="timer-box">00:00</h1></div>
  </div>

  <div id="main">
    <div id="left">
      <div id="board-list"></div>
    </div>
    <div id="right">
      <div id="purchases-title"><i class="fas fa-receipt"></i> 玩家達成清單（人生背包）</div>
      <div id="purchases-list"></div>
    </div>
  </div>

  <script>
    const  firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };;
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();


/***********************
 * Device identity + label + reporter
 ***********************/
function getDeviceId() {
  const KEY = "device_id";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
    localStorage.setItem(KEY, id);
  }
  return id;
}
function getDeviceLabel() {
  const KEY = "device_label";
  let label = (localStorage.getItem(KEY) || "").trim();
  if (!label) {
    label = (prompt("請輸入此裝置名稱（例如：教室筆電A / 玩家手機3）") || "").trim();
    if (!label) label = "未命名-" + getDeviceId().slice(0,6);
    localStorage.setItem(KEY, label);
  }
  return label;
}
function startDeviceReporter(db, pageName) {
  const deviceId = getDeviceId();
  const label = getDeviceLabel();
  const ref = db.ref("devicesSeen/" + deviceId);
  const ping = () => ref.update({ label, page: pageName, lastSeen: Date.now() });
  ping();
  setInterval(ping, 15000);
}

startDeviceReporter(db, 'display_purchases.html');
// ===== 控制台參數（從 /controls 讀取）=====
let MAX_DANMAKU_ONSCREEN = 8;
const controlsRef = db.ref("controls");
controlsRef.on("value", (snap) => {
  const c = snap.val() || {};
  const marqueeSec = Number(c.marqueeDurationSec ?? 10);
  const danmakuSec = Number(c.danmakuDurationSec ?? 10);
  const fontPx = Number(c.danmakuFontSizePx ?? 22);
  const maxOn = Number(c.danmakuMaxOnScreen ?? 8);

  document.documentElement.style.setProperty("--marquee-duration", `${Math.max(3, Math.min(60, marqueeSec))}s`);
  document.documentElement.style.setProperty("--danmaku-duration", `${Math.max(3, Math.min(60, danmakuSec))}s`);
  document.documentElement.style.setProperty("--danmaku-font-size", `${Math.max(12, Math.min(64, fontPx))}px`);
  MAX_DANMAKU_ONSCREEN = Math.max(1, Math.min(30, maxOn));
});

    // 廣播監聽
    db.ref('broadcast').on('value', s => {
      const d = s.val();
      const bar = document.getElementById('announcement-bar');
      if (d && d.message && d.message.trim() !== "") {
        bar.style.display = "block";
        document.getElementById('msg-box').innerText = "📢 " + d.message;
      } else {
        bar.style.display = "none";
      }
    });

    // 計時器同步
    db.ref('timerSync').on('value', s => {
      const d = s.val();
      if (d) {
        const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
        const sc = (d.timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-box').innerText = `${m}:${sc}`;
        document.getElementById('timer-bar').style.background = (d.timeLeft <= 0) ? "#95a5a6" : "#e74c3c";
      }
    });

    function safeVal(v){ return (typeof v === 'number' && isFinite(v)) ? v : (v || 0); }

    // 排名監聽：分數第一、PTS 第二
    db.ref('players').on('value', s => {
      const data = s.val() || {};
      const arr = [];
      for (let i = 1; i <= 10; i++) {
        const pKey = `p${i}`;
        const pData = data[pKey] || {};
        const r = pData.res || {};
        const pts = safeVal(r.time) + safeVal(r.money) + safeVal(r.health) + safeVal(r.knowledge) + safeVal(r.social);
        const score = safeVal(r.score);
        arr.push({
          pid: i,
          name: pData.name || `玩家 ${i}`,
          res: r,
          pts,
          score,
          inventory: pData.inventory || {}
        });
      }

      arr.sort((a,b)=> (b.score !== a.score) ? (b.score - a.score) : (b.pts - a.pts));

      // 1) 左邊排行榜
      const list = document.getElementById('board-list');
      list.innerHTML = "";
      arr.forEach((p, i) => {
        const rank = i + 1;
        const rClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
        list.innerHTML += `
          <div class="p-row ${rClass}">
            <div class="rank-num">${rank}</div>
            <div class="player-name">${p.name}</div>
            <div class="res-summary">
              <div class="res-item" style="color:#8e44ad"><span class="res-label">時</span><i class="fas fa-clock"></i>${safeVal(p.res.time)}</div>
              <div class="res-item" style="color:#f39c12"><span class="res-label">金</span><i class="fas fa-wallet"></i>${safeVal(p.res.money)}</div>
              <div class="res-item" style="color:#c0392b"><span class="res-label">健</span><i class="fas fa-heartbeat"></i>${safeVal(p.res.health)}</div>
              <div class="res-item" style="color:#2980b9"><span class="res-label">知</span><i class="fas fa-book"></i>${safeVal(p.res.knowledge)}</div>
              <div class="res-item" style="color:#27ae60"><span class="res-label">人</span><i class="fas fa-users"></i>${safeVal(p.res.social)}</div>
              <div class="res-item res-score"><span class="res-label">分</span><i class="fas fa-star"></i>${safeVal(p.res.score)}</div>
            </div>
            <div class="total-box"><span class="total-val">${p.pts}</span><span class="pts">PTS</span></div>
          </div>`;
      });

      // 2) 右邊達成清單（依玩家編號固定順序，避免跟排名一起跳來跳去）
      const purchases = document.getElementById('purchases-list');
      purchases.innerHTML = "";

      const fixed = [...arr].sort((a,b)=>a.pid-b.pid);
      fixed.forEach(p => {
        const inv = p.inventory || {};
        const items = Object.keys(inv).map(k => inv[k]).filter(Boolean);
        // 最新的放前面
        items.sort((a,b)=> (safeVal(b.time) - safeVal(a.time)));

        purchases.innerHTML += `
          <div class="buy-card">
            <div class="buy-head">
              <div class="buy-name"><i class="fas fa-user"></i> ${p.name}</div>
              <div class="buy-count">${items.length} 件</div>
            </div>
            <div class="buy-items">
              ${items.slice(0, 12).map(it => {
                const nm = it.name || '未命名';
                const img = (it.imageUrl || '').trim();
                return `
                  <div class="chip" title="${nm}">
                    ${img ? `<img src="${img}" alt="${nm}" />` : `<div class="icon">🛍️</div>`}
                    <span>${nm}</span>
                  </div>`;
              }).join('')}
              ${items.length > 12 ? `<div class="chip"><div class="icon">…</div><span>+${items.length-12}</span></div>` : ''}
            </div>
          </div>`;
      });
    });

    // 橙色彈幕：監聽 purchaseFeed 的新增
    db.ref('purchaseFeed').limitToLast(20).on('child_added', s => {
      const d = s.val();
      if(!d) return;

      const layer = document.getElementById('danmaku-layer');
      const el = document.createElement('div');
      el.className = 'danmaku';

      // 隨機高度：避開 header
      const topMin = 80;
      const topMax = Math.max(topMin, window.innerHeight - 80);
      const top = topMin + Math.floor(Math.random() * Math.max(1, topMax - topMin));
      el.style.top = `${top}px`;

      const who = d.playerName || `玩家${d.playerId || ''}`;
      const what = d.itemName || '物品';
      const img = (d.imageUrl || '').trim();

      el.innerHTML = `
        ${img ? `<img src="${img}" alt="${what}" />` : ''}
        <span>${who} 達成：${what}</span>
      `;

      layer.appendChild(el);
      // 動畫結束移除
      el.addEventListener('animationend', () => el.remove());
    });
  </script>
</body>
</html>
