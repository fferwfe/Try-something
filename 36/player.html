<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資源盤 - 終極整合版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 活潑風配色 */
        body { 
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            color: #333; padding: 15px; text-align: center; margin: 0; min-height: 100vh;
        }
        .box { 
            background: #ffffff; padding: 25px; border-radius: 30px; max-width: 450px; 
            margin: auto; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            border: 2px solid #fff;
        }
        h2 { color: #ff6b6b; font-weight: 800; margin-top: 0; }
        
        /* 跑馬燈公告欄位 */
        #notice-bar {
            background: #6c5ce7; color: white; border-radius: 20px;
            margin-bottom: 15px; display: none; overflow: hidden; position: relative;
        }
        .marquee-container { padding: 12px; white-space: nowrap; overflow: hidden; }
        #notice-text { display: inline-block; padding-left: 100%; animation: marquee-play 10s linear infinite; font-weight: bold; }
        @keyframes marquee-play { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* 獨立計時器 */
        #timer-display { 
            background: #e74c3c; color: white; padding: 8px 20px; 
            border-radius: 15px; display: inline-block; margin-bottom: 15px; 
            font-weight: 900; font-size: 1.8em; letter-spacing: 2px;
        }

        /* 資源顯示區 */
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .res-item { background: #fff; padding: 15px; border-radius: 20px; border: 2px solid #f1f2f6; }
        .res-item i { font-size: 1.4em; margin-bottom: 8px; display: block; }
        .num { font-size: 2.2em; font-weight: 900; display: block; }

        /* 中文資源配色與新增「分數」格 */
        .c-time { border-color: #a29bfe; color: #6c5ce7; }
        .c-money { border-color: #ffeaa7; color: #f39c12; }
        .c-health { border-color: #ff7675; color: #d63031; }
        .c-knowledge { border-color: #74b9ff; color: #0984e3; }
        .c-social { border-color: #55efc4; color: #00b894; }
        .c-score { border-color: #ffd700; color: #f39c12; } /* 分數配色 */

        /* 人生背包清單 */
        .inv-item { 
            background: #e1f5fe; padding: 8px 15px; border-radius: 15px; 
            border: 2px solid #3498db; font-weight: bold; color: #0277bd; 
            margin: 5px; display: inline-block; font-size: 0.9em;
        }

        /* 商店樣式 */
        .shop-card { background: #f8f9fa; padding: 18px; border-radius: 20px; margin-top: 15px; text-align: left; border-left: 6px solid #6c5ce7; }
        .shop-btn { background: #6c5ce7; color: white; width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .hide { display: none !important; }
        select, input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 2px solid #eee; font-size: 16px; box-sizing: border-box; }
        #join-btn { background: #00b894; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="event-overlay" class="hide">
        <div class="box" style="border: 5px solid #ff7675;">
            <h1 style="color:#ff7675;"><i class="fas fa-bolt"></i> 突發事件！</h1>
            <p id="event-text" style="font-size:1.2em; font-weight:bold; margin: 20px 0;"></p>
            <button onclick="document.getElementById('event-overlay').classList.add('hide')" style="background:#ff7675;">收到了！</button>
        </div>
    </div>

    <div class="box" id="login">
        <h2>角色登入</h2>
        <select id="pid">
            <option value="1">1號玩家</option><option value="2">2號玩家</option><option value="3">3號玩家</option><option value="4">4號玩家</option><option value="5">5號玩家</option><option value="6">6號玩家</option><option value="7">7號玩家</option><option value="8">8號玩家</option><option value="9">9號玩家</option><option value="10">10號玩家</option>
        </select>
        <input type="text" id="pname" placeholder="輸入你的暱稱">
        <button id="join-btn" onclick="join()">開始遊戲</button>
    </div>

    <div class="box hide" id="game">
        <div id="notice-bar"><div class="marquee-container"><span id="notice-text"></span></div></div>
        <div id="timer-display">00:00</div>
        <h2 id="me" style="color:#6c5ce7; margin-bottom:10px;">---</h2>
        <canvas id="radarChart" style="margin-bottom:15px;"></canvas>

        <div class="res-grid">
            <div class="res-item c-time"><i class="fas fa-clock"></i> 時間 <span class="num" id="time">0</span></div>
            <div class="res-item c-money"><i class="fas fa-wallet"></i> 金錢 <span class="num" id="money">0</span></div>
            <div class="res-item c-health"><i class="fas fa-heartbeat"></i> 健康 <span class="num" id="health">0</span></div>
            <div class="res-item c-knowledge"><i class="fas fa-book"></i> 知識 <span class="num" id="knowledge">0</span></div>
            <div class="res-item c-social"><i class="fas fa-users"></i> 人際 <span id="social" class="num">0</span></div>
            <div class="res-item c-score"><i class="fas fa-star"></i> 分數 <span id="score" class="num">0</span></div>
        </div>

        <div class="box" style="margin-top: 20px; border-top: 5px solid #3498db; background:#fafafa; padding: 15px;">
            <h3><i class="fas fa-briefcase"></i> 已獲得的人生清單</h3>
            <div id="inventory-list" style="min-height: 40px;"></div>
        </div>

        <h3 style="margin-top:30px; color:#636e72;"><i class="fas fa-shopping-cart"></i> 驚喜商店</h3>
        <div id="shop-msg"></div> <div id="shop-display"></div>
    </div>

    <script>
        const  firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };;
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        

/***********************
 * Device identity + label + reporter
 ***********************/
function getDeviceId() {
  const KEY = "device_id";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
    localStorage.setItem(KEY, id);
  }
  return id;
}
function getDeviceLabel() {
  const KEY = "device_label";
  let label = (localStorage.getItem(KEY) || "").trim();
  if (!label) {
    label = (prompt("請輸入此裝置名稱（例如：教室筆電A / 玩家手機3）") || "").trim();
    if (!label) label = "未命名-" + getDeviceId().slice(0,6);
    localStorage.setItem(KEY, label);
  }
  return label;
}
function startDeviceReporter(db, pageName) {
  const deviceId = getDeviceId();
  const label = getDeviceLabel();
  const ref = db.ref("devicesSeen/" + deviceId);
  const ping = () => ref.update({ label, page: pageName, lastSeen: Date.now() });
  ping();
  setInterval(ping, 15000);
}

startDeviceReporter(db, 'player.html');

/***********************
 * Player gate (only when playerLocked=true)
 * - If locked: require playerAllowed/<deviceId> === true
 ***********************/
async function playerGate(db) {
  const deviceId = getDeviceId();
  const lockedSnap = await db.ref("deviceLocks/playerLocked").get();
  const locked = lockedSnap.val() === true;
  if (!locked) return { ok:true, locked:false };

  const allowSnap = await db.ref("playerAllowed/" + deviceId).get();
  const allowed = allowSnap.val() === true;

  if (allowed) return { ok:true, locked:true };

  // Block UI
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;";
  overlay.innerHTML = `
    <div style="max-width:520px;width:100%;background:#132033;border-radius:18px;padding:18px 18px 16px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.55);border-left:6px solid #ef4444;">
      <h2 style="margin:0 0 10px;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;">
        ⛔ 玩家端已鎖定（禁止更換裝置）
      </h2>
      <div style="opacity:.88;line-height:1.5;margin-bottom:12px;">
        遊戲已開始，玩家裝置已凍結。<br>
        請使用<strong>原本已加入的裝置</strong>登入。<br><br>
        你的 deviceId：<span style="font-family:monospace;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:8px;">${deviceId}</span>
      </div>
      <div style="opacity:.75;font-size:.95em;">
        請聯絡主控（SUPER）解除或加入此裝置。
      </div>
    </div>`;
  document.body.appendChild(overlay);
  return { ok:false, locked:true };
}

playerGate(db);
const resNames = { time: '時間', money: '金錢', health: '健康', knowledge: '知識', social: '人際', score: '分數' };
        let myId, myName, myRes = {}, radarChart;

        function join() {
            myId = document.getElementById('pid').value;
            const name = document.getElementById('pname').value;
            if(!name) return alert("請輸入暱稱");
            myName = name;
            db.ref(`players/p${myId}`).update({ name: name });
            document.getElementById('login').classList.add('hide');
            document.getElementById('game').classList.remove('hide');
            document.getElementById('me').innerText = name;
            initRadar();
            syncData();
        }

        function initRadar() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['時間', '金錢', '健康', '知識', '人際'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: 'rgba(108, 92, 231, 0.2)',
                        borderColor: '#6c5ce7',
                        pointBackgroundColor: '#ff7675'
                    }]
                },
                options: {
                    scales: { r: { beginAtZero: true, ticks: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function syncData() {
            // 同步六大資源 (含分數與管理端修改)
            const keys = ['time','money','health','knowledge','social','score'];
            keys.forEach(k => {
                db.ref(`players/p${myId}/res/${k}`).on('value', s => {
                    myRes[k] = s.val() || 0;
                    const el = document.getElementById(k);
                    if(el) el.innerText = myRes[k];
                    // 雷達圖僅維持顯示五大基礎資源
                    radarChart.data.datasets[0].data = [myRes.time, myRes.money, myRes.health, myRes.knowledge, myRes.social];
                    radarChart.update();
                });
            });

            // 監聽人生背包 (Inventory)
            db.ref(`players/p${myId}/inventory`).on('value', s => {
                const list = document.getElementById('inventory-list');
                list.innerHTML = "";
                const data = s.val();
                if(!data) { list.innerHTML = "<p style='color:#aaa; font-size:0.9em;'>尚無任何成就物品</p>"; return; }
                for(let key in data) { list.innerHTML += `<div class="inv-item">✨ ${data[key].name}</div>`; }
            });

            // 廣播公告與跑馬燈
            db.ref('broadcast').on('value', s => {
                const d = s.val();
                const bar = document.getElementById('notice-bar');
                const text = document.getElementById('notice-text');
                if (d && d.message && d.message.trim() !== "") {
                    bar.style.display = "block";
                    text.innerText = "📢 " + d.message;
                    text.style.animation = 'none'; text.offsetHeight; text.style.animation = null;
                } else { bar.style.display = "none"; }
            });

            // 計時器同步
            db.ref('timerSync').on('value', s => {
                const d = s.val();
                if (d) {
                    const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
                    const sc = (d.timeLeft % 60).toString().padStart(2, '0');
                    const timerDisp = document.getElementById('timer-display');
                    timerDisp.innerText = `${m}:${sc}`;
                    timerDisp.style.opacity = d.isRunning ? "1" : "0.5";
                }
            });

            // 商店開關監聽
            db.ref('shopSettings/isOpen').on('value', s => {
                const isOpen = s.val() || false;
                const display = document.getElementById('shop-display');
                const msg = document.getElementById('shop-msg');
                if(!isOpen) {
                    display.style.opacity = "0.3"; display.style.pointerEvents = "none";
                    msg.style.color = "#e67e22"; msg.innerText = "🏪 商店盤點中...";
                } else {
                    display.style.opacity = "1"; display.style.pointerEvents = "auto";
                    msg.innerText = "";
                }
            });

            // 商店清單與分數獎勵顯示
            db.ref('shop/items').on('value', s => {
                const list = document.getElementById('shop-display');
                list.innerHTML = "";
                const data = s.val();
                for(let key in data) {
                    const item = data[key];
                    let costText = Object.keys(resNames).map(k => (item.cost && item.cost[k]>0)?`${resNames[k]}:${item.cost[k]}`:'').filter(t=>t!=='').join(' ');
                    list.innerHTML += `
                        <div class="shop-card">
                            <div style="display:flex; gap:12px; align-items:center;">
                                ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" style="width:56px;height:56px;object-fit:cover;border-radius:14px;border:2px solid #eee;"/>` : `<div style="width:56px;height:56px;border-radius:14px;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;color:#aaa;">🛍️</div>`}
                                <div style="flex:1;">
                                    <strong>${item.name}</strong>
                                    ${item.bonus > 0 ? `<span style="color:#f39c12; font-size:0.8em; margin-left:10px;">🏆 分數 +${item.bonus}</span>` : ''}
                                    <br><small>代價: ${costText||'免費'}</small>
                                </div>
                            </div>
                            <button class="shop-btn" onclick='processBuy(${JSON.stringify({name: item.name, cost: item.cost||{}, bonus: item.bonus||0, imageUrl: item.imageUrl||""})})'>確認達成</button>
                        </div>`;
                }
            });

            // 突發事件監聽
            db.ref('currentEvent').on('value', s => {
                const d = s.val();
                if(d && d.target == myId) {
                    document.getElementById('event-text').innerText = d.message;
                    document.getElementById('event-overlay').classList.remove('hide');
                }
            });
        }

        // 修改達成邏輯：整合物品入庫與自動加分
        function processBuy(item) {
            const name = item.name;
            const cost = item.cost || {};
            const bonus = item.bonus || 0;
            const imageUrl = item.imageUrl || "";

            for(let k in cost) { if((myRes[k]||0) < cost[k]) return alert(`❌ 你的「${resNames[k]}」不足！`); }

            if(confirm(`準備好達成「${name}」了嗎？`)) {
                // 1. 扣除資源成本
                for(let k in cost) { db.ref(`players/p${myId}/res/${k}`).set(myRes[k] - cost[k]); }
                
                // 2. 物品寫入人生背包 (Inventory)
                db.ref(`players/p${myId}/inventory`).push({ name: name, imageUrl: imageUrl, time: Date.now() });

                // 2.5 將達成事件送到大螢幕（彈幕 / 達成紀錄）
                db.ref('purchaseFeed').push({
                    playerId: myId,
                    playerName: myName || `玩家${myId}`,
                    itemName: name,
                    imageUrl: imageUrl,
                    ts: Date.now()
                });
                
                // 3. 自動增加獎勵分數
                if(bonus > 0) {
                    db.ref(`players/p${myId}/res/score`).transaction(current => (current || 0) + bonus);
                }
                
                alert(`🎉 成功獲得「${name}」！${bonus > 0 ? `並額外獲得 ${bonus} 分！` : ''}`);
            }
        }
    </script>
</body>
</html>
