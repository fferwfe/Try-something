<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>人生履歷-10人英雄榜(雙重排序優化版)</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 白底風格優化 */
        body { 
            background: #ffffff; 
            color: #2c3e50; 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
            padding: 10px 20px; 
            margin: 0; 
            overflow: hidden; /* 確保不會出現捲軸 */
        }

        /* 頂部標頭佈局 */
        #display-header { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 12px; 
            height: 60px;
        }

        #announcement-bar {
            flex: 3;
            background: #3498db;
            border-radius: 12px;
            display: none;
            overflow: hidden;
            white-space: nowrap;
        }
        #msg-box {
            display: inline-block;
            padding-left: 100%;
            /* 需求：跑馬燈速度快一點（原本 15s） */
            animation: marquee var(--marquee-duration, 10s) linear infinite;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            line-height: 60px;
            margin: 0;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        #timer-bar {
            flex: 1;
            background: #e74c3c;
            border-radius: 12px;
            text-align: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #timer-box { margin: 0; font-size: 2.5em; font-family: monospace; font-weight: 900; }

        /* 10 人列表排版優化 */
        .p-row { 
            background: #fdfdfd; 
            margin-bottom: 5px; 
            padding: 5px 15px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            border: 1px solid #eee;
            height: 7vh; /* 根據螢幕高度自動分配 */
        }
        
        /* 前三名色塊 */
        .rank-1 { background: #fffcf0; border-color: #ffd700; border-left: 10px solid #ffd700; }
        .rank-2 { background: #fafdff; border-color: #bdc3c7; border-left: 10px solid #bdc3c7; }
        .rank-3 { background: #fff9f5; border-color: #e67e22; border-left: 10px solid #e67e22; }

        .rank-num { font-size: 1.4em; font-weight: 900; width: 35px; color: #95a5a6; }
        .rank-1 .rank-num { color: #f1c40f; }
        
        .player-name { font-size: 1.2em; font-weight: 800; width: 140px; color: #34495e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* 資源數據呈現優化 */
        .res-summary { flex: 1; display: flex; justify-content: space-around; font-size: 0.95em; padding: 0 10px; }
        .res-item { display: flex; align-items: center; gap: 4px; font-weight: 700; }
        .res-label { font-size: 0.85em; }

        /* 分數顯示強調 */
        .res-score {
            color: #e67e22; 
            background: rgba(230, 126, 34, 0.1); 
            padding: 2px 10px; 
            border-radius: 6px;
            border: 1px solid rgba(230, 126, 34, 0.2);
        }
        
        .total-box { width: 100px; text-align: right; border-left: 1px dashed #ddd; padding-left: 10px; }
        .total-val { font-size: 1.6em; font-weight: 900; color: #2980b9; }
        .pts { font-size: 0.5em; color: #7f8c8d; margin-left: 2px; }
    </style>
</head>
<body>

    <div id="display-header">
        <div id="announcement-bar">
            <p id="msg-box"></p>
        </div>
        <div id="timer-bar">
            <h1 id="timer-box">00:00</h1>
        </div>
    </div>

    <div id="board-list"></div>

    <script>
        const  firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };;
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();


/***********************
 * Device identity + label + reporter
 ***********************/
function getDeviceId() {
  const KEY = "device_id";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
    localStorage.setItem(KEY, id);
  }
  return id;
}
function getDeviceLabel() {
  const KEY = "device_label";
  let label = (localStorage.getItem(KEY) || "").trim();
  if (!label) {
    label = (prompt("請輸入此裝置名稱（例如：教室筆電A / 玩家手機3）") || "").trim();
    if (!label) label = "未命名-" + getDeviceId().slice(0,6);
    localStorage.setItem(KEY, label);
  }
  return label;
}
function startDeviceReporter(db, pageName) {
  const deviceId = getDeviceId();
  const label = getDeviceLabel();
  const ref = db.ref("devicesSeen/" + deviceId);
  const ping = () => ref.update({ label, page: pageName, lastSeen: Date.now() });
  ping();
  setInterval(ping, 15000);
}

startDeviceReporter(db, 'display.html');
// ===== 控制台參數（從 /controls 讀取）=====
const controlsRef = db.ref("controls");
controlsRef.on("value", (snap) => {
  const c = snap.val() || {};
  const marqueeSec = Number(c.marqueeDurationSec ?? 10);
  // 用 CSS 變數控制跑馬燈速度
  document.documentElement.style.setProperty("--marquee-duration", `${Math.max(3, Math.min(60, marqueeSec))}s`);
});

        // 廣播監聽
        db.ref('broadcast').on('value', s => {
            const d = s.val();
            const bar = document.getElementById('announcement-bar');
            if (d && d.message && d.message.trim() !== "") {
                bar.style.display = "block";
                document.getElementById('msg-box').innerText = "📢 " + d.message;
            } else { bar.style.display = "none"; }
        });

        // 計時器同步
        db.ref('timerSync').on('value', s => {
            const d = s.val();
            if (d) {
                const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
                const sc = (d.timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('timer-box').innerText = `${m}:${sc}`;
                document.getElementById('timer-bar').style.background = (d.timeLeft <= 0) ? "#95a5a6" : "#e74c3c";
            }
        });

        // 排名監聽：執行「分數第一、PTS 第二」排序
        db.ref('players').on('value', s => {
            const data = s.val();
            let arr = [];
            for(let i=1; i<=10; i++) {
                const pKey = `p${i}`;
                const pData = data[pKey] || {};
                const r = pData.res || {};
                const pts = (r.time||0) + (r.money||0) + (r.health||0) + (r.knowledge||0) + (r.social||0);
                const score = r.score || 0;
                arr.push({ name: pData.name || `玩家 ${i}`, res: r, pts: pts, score: score });
            }

            // 雙重排序邏輯
            arr.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return b.pts - a.pts;
            });
            
            const list = document.getElementById('board-list');
            list.innerHTML = "";
            arr.forEach((p, i) => {
                const rank = i + 1;
                let rClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
                list.innerHTML += `
                    <div class="p-row ${rClass}">
                        <div class="rank-num">${rank}</div>
                        <div class="player-name">${p.name}</div>
                        <div class="res-summary">
                            <div class="res-item" style="color:#8e44ad"><span class="res-label">時</span><i class="fas fa-clock"></i>${p.res.time||0}</div>
                            <div class="res-item" style="color:#f39c12"><span class="res-label">金</span><i class="fas fa-wallet"></i>${p.res.money||0}</div>
                            <div class="res-item" style="color:#c0392b"><span class="res-label">健</span><i class="fas fa-heartbeat"></i>${p.res.health||0}</div>
                            <div class="res-item" style="color:#2980b9"><span class="res-label">知</span><i class="fas fa-book"></i>${p.res.knowledge||0}</div>
                            <div class="res-item" style="color:#27ae60"><span class="res-label">人</span><i class="fas fa-users"></i>${p.res.social||0}</div>
                            <div class="res-item res-score"><span class="res-label">分</span><i class="fas fa-star"></i>${p.score}</div>
                        </div>
                        <div class="total-box"><span class="total-val">${p.pts}</span><span class="pts">PTS</span></div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
