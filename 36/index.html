<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>人生履歷｜入口</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  <style>
    body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#0b1220;color:#fff;margin:0;padding:20px;}
    .wrap{max-width:860px;margin:0 auto;}
    a{color:#93c5fd;text-decoration:none;font-weight:900;}
    .card{background:#111b2f;border-radius:18px;padding:16px 18px;margin:12px 0;border-left:6px solid rgba(255,255,255,0.12);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:700px){.grid{grid-template-columns:1fr;}}
    .btn{display:block;background:#1f2a44;border-radius:14px;padding:14px 14px;border:1px solid rgba(255,255,255,0.08);}
    .hint{opacity:.8;line-height:1.4;}
  </style>
</head>
<body>
<div class="wrap">
  <h1 style="margin:6px 0 10px;">🎮 人生履歷｜入口</h1>
  <div class="hint">此頁只做入口與裝置回報（devicesSeen）。</div>

  <div class="card">
    <div class="grid">
      <a class="btn" href="player.html">👤 player.html（玩家端）</a>
      <a class="btn" href="admin.html">🛡️ admin.html（管理員端）</a>
      <a class="btn" href="shop.html">🛒 shop.html（商店端）</a>
      <a class="btn" href="display.html">📺 display.html（大螢幕）</a>
      <a class="btn" href="display_purchases.html">💬 display_purchases.html（彈幕）</a>
      <a class="btn" href="board.html">🧩 board.html（看板）</a>
      <a class="btn" href="device_control.html">👑 device_control.html（SUPER）</a>
    </div>
  </div>

  <div class="card">
    <div class="hint">
      你的 deviceId：<span id="did" style="font-family:monospace;"></span><br/>
      裝置名稱：<span id="dlabel" style="font-family:monospace;"></span>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
function getDeviceId() {
  const KEY = "device_id";
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : ("dev_" + Math.random().toString(16).slice(2) + Date.now()));
    localStorage.setItem(KEY, id);
  }
  return id;
}
function getDeviceLabel() {
  const KEY = "device_label";
  let label = (localStorage.getItem(KEY) || "").trim();
  if (!label) {
    label = (prompt("請輸入此裝置名稱（例如：教室筆電A / 玩家手機3）") || "").trim();
    if (!label) label = "未命名-" + getDeviceId().slice(0,6);
    localStorage.setItem(KEY, label);
  }
  return label;
}
function startDeviceReporter(db, pageName) {
  const deviceId = getDeviceId();
  const label = getDeviceLabel();
  const ref = db.ref("devicesSeen/" + deviceId);
  const ping = () => ref.update({ label, page: pageName, lastSeen: Date.now() });
  ping();
  setInterval(ping, 15000);
}

  startDeviceReporter(db, "index.html");
  document.getElementById("did").textContent = getDeviceId();
  document.getElementById("dlabel").textContent = getDeviceLabel();
</script>
