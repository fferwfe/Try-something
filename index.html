<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料夾入口</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family: "Microsoft JhengHei", system-ui, sans-serif;
      color:#fff;
    }
    .wrap{
      width:90%;
      max-width:420px;
      display:grid;
      gap:14px;
    }
    a{
      display:block;
      padding:18px;
      text-align:center;
      border-radius:14px;
      font-size:1.2em;
      font-weight:700;
      text-decoration:none;
      color:white;
      background:#1e293b;
      transition:.2s;
    }
    a:hover{
      background:#334155;
      transform:translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="36/">進入 36</a>
    <a href="40/">進入 40</a>
    <a href="43/">進入 43</a>

</body>
</html>
