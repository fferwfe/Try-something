<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大螢幕 - 玩家總覽（排名 + 資源 + 背包 + 頒獎模式）</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    /* ===== 大螢幕不裁切 + 可滑動 ===== */
    html,body{width:100%;height:100%;margin:0;}
    body{
      min-height:100vh;
      min-height:100svh;
      box-sizing:border-box;
      padding:10px 20px;

      overflow-x:hidden;
      overflow-y:auto;

      background:#ffffff;
      color:#2c3e50;
      font-family:'PingFang TC','Microsoft JhengHei',sans-serif;
      -webkit-text-size-adjust:100%;
    }

    /* Header：置頂（滑動時固定） */
    #display-header{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      gap:15px;
      height:60px;
      margin-bottom:12px;

      background:rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
      padding:6px 0;
    }

    #announcement-bar{
      flex:3;
      background:#3498db;
      border-radius:12px;
      display:none;
      overflow:hidden;
      white-space:nowrap;
      height:60px;
    }
    #msg-box{
      display:inline-block;
      padding-left:100%;
      animation: marquee-left 10s linear infinite;
      font-size:1.5em;
      font-weight:900;
      color:white;
      line-height:60px;
      margin:0;
    }
    @keyframes marquee-left{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
    @keyframes marquee-right{0%{transform:translateX(0);}100%{transform:translateX(100%);}}

    #timer-bar{
      flex:1;
      background:#e74c3c;
      border-radius:12px;
      text-align:center;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:60px;
    }
    #timer-box{margin:0;font-size:2.5em;font-family:monospace;font-weight:900;}

    /* ===== 玩家列表：每位玩家一包 ===== */
    #players-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      padding-bottom:18px;
    }

    .p-card{
      border-radius:14px;
      border:1px solid rgba(2,6,23,0.10);
      background:rgba(255,255,255,0.80);
      box-shadow:0 10px 26px rgba(2,6,23,0.08);
      padding:10px 12px;
    }

    .p-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
    }

    .p-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .rank-badge{
      min-width:64px;
      height:34px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:1000;
      letter-spacing:0.2px;
      border:1px solid rgba(2,6,23,0.10);
      background:#f5f6f7;
      color:#34495e;
      flex:0 0 auto;
    }
    .rank-1 .rank-badge{background:#fffbdf;border-color:#ffd700;color:#8a6a00;}
    .rank-2 .rank-badge{background:#eef6ff;border-color:#bdc3c7;color:#4b5563;}
    .rank-3 .rank-badge{background:#fff0e7;border-color:#e67e22;color:#8a3b00;}

    .pname{
      font-size:1.25em;
      font-weight:1000;
      color:#2c3e50;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .p-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }
    .pts-pill{
      font-weight:1000;
      color:#2980b9;
      background:rgba(41,128,185,0.10);
      border:1px solid rgba(41,128,185,0.22);
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }
    .score-pill{
      font-weight:1000;
      color:#e67e22;
      background:rgba(230,126,34,0.10);
      border:1px solid rgba(230,126,34,0.22);
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .res-grid{
      display:grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap:8px;
      margin-bottom:10px;
    }
    @media (max-width: 1100px){
      .res-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .res-cell{
      border-radius:12px;
      border:1px solid rgba(2,6,23,0.08);
      background:rgba(2,6,23,0.03);
      padding:8px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      min-width:0;
    }
    .res-cell .k{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      white-space:nowrap;
      min-width:0;
    }
    .res-cell .k span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .res-cell .v{
      font-weight:1000;
      font-size:1.1em;
      white-space:nowrap;
    }

    /* 背包區 */
    .bag-title{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:1000;
      color:#2c3e50;
      margin:0 0 8px 0;
    }
    .bag-items{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#ffffff;
      border:1px solid #eaeaea;
      padding:6px 10px;
      border-radius:999px;
      font-weight:900;
      color:#2c3e50;
      max-width:320px;
    }
    .chip span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:250px;
    }
    .chip img{
      width:22px;
      height:22px;
      border-radius:6px;
      object-fit:cover;
      border:1px solid #eee;
      flex:0 0 auto;
    }
    .chip .icon{
      width:22px;height:22px;border-radius:6px;border:1px dashed #ddd;
      display:flex;align-items:center;justify-content:center;color:#aaa;font-size:0.95em;
      flex:0 0 auto;
    }
    .empty{
      color:#7f8c8d;
      font-weight:800;
      font-size:0.95em;
    }

    /* ===== 頒獎模式（證書版面） ===== */
    #award-stage{
      display:none;
      position:relative;
      margin-top:10px;
      border-radius:18px;
      border:1px solid rgba(2,6,23,0.10);
      background:
        radial-gradient(900px 420px at 18% 0%, rgba(59,130,246,0.14), transparent 60%),
        radial-gradient(900px 420px at 82% 0%, rgba(34,197,94,0.12), transparent 60%),
        radial-gradient(900px 520px at 50% 100%, rgba(139,92,246,0.12), transparent 65%),
        #fff;
      box-shadow:0 18px 50px rgba(2,6,23,0.12);
      padding:28px 26px;
      overflow:hidden;
    }
    #award-stage:before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:14px;
      border:2px solid rgba(255,215,0,0.45);
      pointer-events:none;
    }
    .award-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
    }
    .award-mark{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:1000;
      color:#8a6a00;
      background:rgba(255,215,0,0.14);
      border:1px solid rgba(255,215,0,0.35);
      padding:10px 14px;
      border-radius:999px;
      white-space:nowrap;
    }
    .award-title{
      font-size:2.2em;
      font-weight:1100;
      color:#0f172a;
      margin:12px 0 6px 0;
      letter-spacing:0.6px;
    }
    .award-sub{
      font-size:1.1em;
      font-weight:900;
      color:rgba(15,23,42,0.70);
      margin:0 0 14px 0;
    }
    .award-name{
      font-size:3.0em;
      font-weight:1200;
      color:#1f2937;
      margin:8px 0 16px 0;
    }
    .award-metrics{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }
    .award-pill{
      border-radius:999px;
      padding:10px 14px;
      font-weight:1000;
      border:1px solid rgba(2,6,23,0.10);
      background:rgba(255,255,255,0.78);
      white-space:nowrap;
    }
    .award-pill.blue{ color:#1d4ed8; background:rgba(59,130,246,0.10); border-color:rgba(59,130,246,0.25); }
    .award-pill.orange{ color:#b45309; background:rgba(245,158,11,0.12); border-color:rgba(245,158,11,0.28); }

    .award-bag{
      margin-top:8px;
      padding-top:12px;
      border-top:1px dashed rgba(2,6,23,0.14);
    }
    .award-bag h3{
      margin:0 0 10px 0;
      font-size:1.15em;
      font-weight:1000;
      color:#111827;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .award-bag .bag-items{ gap:10px; }
    .award-bag .chip{ padding:8px 12px; }

    /* ===== 控制面板：可輸入獎項 + 切換模式 ===== */
    #award-panel{
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:30;
      width:360px;
      max-width:calc(100vw - 28px);
      border-radius:16px;
      border:1px solid rgba(2,6,23,0.14);
      background:rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      box-shadow:0 14px 40px rgba(2,6,23,0.18);
      padding:12px 12px 10px 12px;
    }
    #award-panel .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    #award-panel label{
      font-weight:1000;
      color:#111827;
      font-size:0.95em;
      white-space:nowrap;
    }
    #award-panel input, #award-panel select{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(2,6,23,0.18);
      padding:10px 10px;
      font-size:16px;
      font-weight:900;
      outline:none;
      box-sizing:border-box;
      background:#fff;
      color:#111827;
    }
    .btns{
      display:flex;
      gap:10px;
      margin-top:8px;
    }
    .btn{
      flex:1;
      border:none;
      border-radius:12px;
      padding:10px 12px;
      font-weight:1100;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(2,6,23,0.12);
    }
    .btn.primary{ background:#22c55e; color:#05210f; }
    .btn.ghost{ background:rgba(15,23,42,0.08); color:#0f172a; }
    .btn.danger{ background:#ef4444; color:#fff; }
    .tiny{
      font-size:0.85em;
      color:rgba(15,23,42,0.65);
      font-weight:800;
      margin-top:8px;
      line-height:1.35;
    }
    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .panel-head .title{
      font-weight:1200;
      font-size:1.05em;
      color:#0f172a;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .panel-head .hint{
      font-weight:1000;
      font-size:0.9em;
      color:rgba(15,23,42,0.60);
      white-space:nowrap;
    }

    /* Danmaku overlay */
    #danmaku-layer{
      position:fixed;
      left:0; top:0;
      width:100vw;
      min-height:100vh;
      min-height:100svh;
      pointer-events:none;
      overflow:hidden;
      z-index:20;
    }
    .danmaku{
      font-size: var(--danmaku-font-size, 22px);
      position:absolute;
      right:-40vw;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:6px 12px;
      border-radius:999px;
      font-weight:1000;
      color:#ffffff;
      background:rgba(243,156,18,0.95);
      box-shadow:0 6px 18px rgba(0,0,0,0.14);
      will-change:transform;
      animation:fly var(--danmaku-duration, 10s) linear forwards;
      max-width:78vw;
    }
    .danmaku span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:70vw;
    }
    .danmaku img{
      width:28px;height:28px;border-radius:8px;object-fit:cover;
      border:2px solid rgba(255,255,255,0.7);
      flex:0 0 auto;
    }
    @keyframes fly{ from{transform:translateX(0);} to{transform:translateX(-140vw);} }
  </style>
</head>

<body data-page="display">
  <div id="danmaku-layer"></div>

  <div id="display-header">
    <div id="announcement-bar"><p id="msg-box"></p></div>
    <div id="timer-bar"><h1 id="timer-box">00:00</h1></div>
  </div>

  <!-- 一般模式：玩家總覽 -->
  <div id="players-wrap"></div>

  <!-- 頒獎模式：證書畫面 -->
  <div id="award-stage" aria-hidden="true">
    <div class="award-top">
      <div class="award-mark"><i class="fas fa-award"></i> 頒獎模式</div>
      <div class="award-mark" id="award-rank-mark"><i class="fas fa-trophy"></i> 排名 #—</div>
    </div>

    <div class="award-title" id="award-title">🏆 獎項名稱</div>
    <div class="award-sub" id="award-sub">特頒此獎，以資鼓勵</div>
    <div class="award-name" id="award-name">玩家姓名</div>

    <div class="award-metrics">
      <div class="award-pill blue" id="award-pts"><i class="fas fa-bolt"></i> PTS：—</div>
      <div class="award-pill orange" id="award-score"><i class="fas fa-star"></i> 分數：—</div>
      <div class="award-pill" id="award-resline"><i class="fas fa-layer-group"></i> 資源：—</div>
    </div>

    <div class="award-bag">
      <h3><i class="fas fa-receipt"></i> 人生背包（最近 18 件）</h3>
      <div class="bag-items" id="award-bag-items"></div>
    </div>
  </div>

  <!-- 控制面板（同頁可操作） -->
  <div id="award-panel">
    <div class="panel-head">
      <div class="title"><i class="fas fa-sliders-h"></i> 顯示控制</div>
      <div class="hint">（面板可直接用）</div>
    </div>

    <div class="row">
      <label style="width:110px;">顯示模式</label>
      <select id="modeSelect">
        <option value="normal">一般模式（玩家總覽）</option>
        <option value="award">頒獎模式（證書）</option>
      </select>
    </div>

    <div class="row">
      <label style="width:110px;">選擇玩家</label>
      <select id="awardPlayerSelect"></select>
    </div>

    <div class="row">
      <label style="width:110px;">獎項名稱</label>
      <input id="awardTitleInput" placeholder="例如：最佳進步獎 / MVP / 最努力獎…" />
    </div>

    <div class="btns">
      <button class="btn primary" id="btnApply">套用（寫入 Firebase）</button>
      <button class="btn ghost" id="btnRefresh">載入目前設定</button>
      <button class="btn danger" id="btnClear">清除頒獎</button>
    </div>

    <div class="tiny">
      會寫入 <b>/award</b>：<code>{ enabled, playerId, title, updatedAt }</code><br/>
      想隱藏面板：把這個區塊刪掉即可（不影響功能）。
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ===== 控制台參數（從 /controls 讀取）=====
    let MAX_DANMAKU_ONSCREEN = 8;
    let DANMAKU_ENABLED = true;
    db.ref("controls").on("value", (snap) => {
      const c = snap.val() || {};
      const danmakuSec = Number(c.danmakuDurationSec ?? 10);
      const fontPx = Number(c.danmakuFontSizePx ?? 22);
      const maxOn = Number(c.danmakuMaxOnScreen ?? 8);

      document.documentElement.style.setProperty("--danmaku-duration", `${Math.max(3, Math.min(60, danmakuSec))}s`);
      document.documentElement.style.setProperty("--danmaku-font-size", `${Math.max(12, Math.min(64, fontPx))}px`);
      MAX_DANMAKU_ONSCREEN = Math.max(1, Math.min(30, maxOn));
      DANMAKU_ENABLED = (c.danmakuEnabled !== false);
    });

    // ===== 跑馬燈公告（從 /marquee 讀取）=====
    const marqueeRef = db.ref("marquee");
    const bar = document.getElementById("announcement-bar");
    const msgBox = document.getElementById("msg-box");
    marqueeRef.on("value", (snap) => {
      const v = snap.val() || {};
      const enabled   = v.enabled ?? true;
      const text      = (v.text ?? "").toString();
      const speedSec  = Math.max(3, Number(v.speedSec ?? 10));
      const direction = (v.direction === "right") ? "right" : "left";
      const fontSize  = Math.max(12, Number(v.fontSize ?? 22));
      if (!bar || !msgBox) return;

      bar.style.display = (enabled && text.trim()) ? "block" : "none";
      if (!(enabled && text.trim())) return;

      msgBox.textContent = "📢 " + text;
      msgBox.style.fontSize = fontSize + "px";

      if (v.bgColor) bar.style.background = v.bgColor;
      if (v.textColor) bar.style.color = v.textColor;

      msgBox.style.animation = "none";
      void msgBox.offsetWidth;
      msgBox.style.animation = `marquee-${direction} ${speedSec}s linear infinite`;
    });

    // ===== 計時器同步 =====
    db.ref('timerSync').on('value', s => {
      const d = s.val();
      if (d) {
        const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
        const sc = (d.timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-box').innerText = `${m}:${sc}`;
        document.getElementById('timer-bar').style.background = (d.timeLeft <= 0) ? "#95a5a6" : "#e74c3c";
      }
    });

    function safeVal(v){ return (typeof v === 'number' && isFinite(v)) ? v : (v || 0); }

    // ===== 玩家資料快取（供一般模式 & 頒獎模式共用）=====
    let PLAYERS = [];         // 原始順序 p1..p10
    let RANKED = [];          // 依排名排序
    let RANK_MAP = new Map(); // pid -> rank

    function computePlayers(players){
      const ranked = [...players].sort((a,b)=> (b.score !== a.score) ? (b.score - a.score) : (b.pts - a.pts));
      const rankMap = new Map();
      ranked.forEach((p, idx) => rankMap.set(p.pid, idx + 1));
      return { ranked, rankMap };
    }

    function renderNormal(){
      const wrap = document.getElementById('players-wrap');
      wrap.innerHTML = "";

      RANKED.forEach(p => {
        const rank = RANK_MAP.get(p.pid) || 0;
        const rankClass = rank === 1 ? "rank-1" : (rank === 2 ? "rank-2" : (rank === 3 ? "rank-3" : ""));

        const inv = p.inventory || {};
        const items = Object.keys(inv).map(k => inv[k]).filter(Boolean);
        items.sort((a,b)=> (safeVal(b.time) - safeVal(a.time)));

        const bagHtml = items.length
          ? items.slice(0, 24).map(it => {
              const nm = (it.name || '未命名').toString();
              const img = (it.imageUrl || '').trim();
              return `
                <div class="chip" title="${nm}">
                  ${img ? `<img src="${img}" alt="${nm}">` : `<div class="icon">🛍️</div>`}
                  <span>${nm}</span>
                </div>`;
            }).join('') + (items.length > 24 ? `
              <div class="chip"><div class="icon">…</div><span>+${items.length-24}</span></div>` : '')
          : `<div class="empty">（尚無背包物品）</div>`;

        wrap.innerHTML += `
          <div class="p-card ${rankClass}">
            <div class="p-head">
              <div class="p-left">
                <div class="rank-badge">#${rank}</div>
                <div class="pname">${p.name}</div>
              </div>
              <div class="p-right">
                <div class="pts-pill">${p.pts} PTS</div>
                <div class="score-pill"><i class="fas fa-star"></i> ${safeVal(p.res.score)}</div>
              </div>
            </div>

            <div class="res-grid">
              <div class="res-cell"><div class="k" style="color:#8e44ad"><i class="fas fa-clock"></i><span>時間</span></div><div class="v">${safeVal(p.res.time)}</div></div>
              <div class="res-cell"><div class="k" style="color:#f39c12"><i class="fas fa-wallet"></i><span>金錢</span></div><div class="v">${safeVal(p.res.money)}</div></div>
              <div class="res-cell"><div class="k" style="color:#c0392b"><i class="fas fa-heartbeat"></i><span>健康</span></div><div class="v">${safeVal(p.res.health)}</div></div>
              <div class="res-cell"><div class="k" style="color:#2980b9"><i class="fas fa-book"></i><span>知識</span></div><div class="v">${safeVal(p.res.knowledge)}</div></div>
              <div class="res-cell"><div class="k" style="color:#27ae60"><i class="fas fa-users"></i><span>人際</span></div><div class="v">${safeVal(p.res.social)}</div></div>
              <div class="res-cell"><div class="k" style="color:#e67e22"><i class="fas fa-star"></i><span>分數</span></div><div class="v">${safeVal(p.res.score)}</div></div>
            </div>

            <div class="bag-title"><i class="fas fa-receipt"></i> 人生背包（達成清單）</div>
            <div class="bag-items">${bagHtml}</div>
          </div>
        `;
      });
    }

    function renderAward(playerId, title){
      const stage = document.getElementById('award-stage');
      const list = document.getElementById('players-wrap');

      const p = RANKED.find(x => x.pid === Number(playerId)) || PLAYERS.find(x => x.pid === Number(playerId));
      if(!p){
        document.getElementById('award-title').textContent = title || "🏆 獎項名稱";
        document.getElementById('award-name').textContent = "（找不到玩家）";
        document.getElementById('award-rank-mark').innerHTML = `<i class="fas fa-trophy"></i> 排名 #—`;
        document.getElementById('award-pts').innerHTML = `<i class="fas fa-bolt"></i> PTS：—`;
        document.getElementById('award-score').innerHTML = `<i class="fas fa-star"></i> 分數：—`;
        document.getElementById('award-resline').innerHTML = `<i class="fas fa-layer-group"></i> 資源：—`;
        document.getElementById('award-bag-items').innerHTML = `<div class="empty">（無資料）</div>`;
      }else{
        const rank = RANK_MAP.get(p.pid) || 0;
        const resTotal = safeVal(p.res.time)+safeVal(p.res.money)+safeVal(p.res.health)+safeVal(p.res.knowledge)+safeVal(p.res.social);
        document.getElementById('award-title').textContent = title || "🏆 獎項名稱";
        document.getElementById('award-name').textContent = p.name;
        document.getElementById('award-rank-mark').innerHTML = `<i class="fas fa-trophy"></i> 排名 #${rank || "—"}`;
        document.getElementById('award-pts').innerHTML = `<i class="fas fa-bolt"></i> PTS：${p.pts}`;
        document.getElementById('award-score').innerHTML = `<i class="fas fa-star"></i> 分數：${safeVal(p.res.score)}`;
        document.getElementById('award-resline').innerHTML =
          `<i class="fas fa-layer-group"></i> 資源：${resTotal}（時${safeVal(p.res.time)} 金${safeVal(p.res.money)} 健${safeVal(p.res.health)} 知${safeVal(p.res.knowledge)} 人${safeVal(p.res.social)}）`;

        const inv = p.inventory || {};
        const items = Object.keys(inv).map(k => inv[k]).filter(Boolean);
        items.sort((a,b)=> (safeVal(b.time) - safeVal(a.time)));

        const bag = items.length
          ? items.slice(0, 18).map(it => {
              const nm = (it.name || '未命名').toString();
              const img = (it.imageUrl || '').trim();
              return `
                <div class="chip" title="${nm}">
                  ${img ? `<img src="${img}" alt="${nm}">` : `<div class="icon">🛍️</div>`}
                  <span>${nm}</span>
                </div>`;
            }).join('')
          : `<div class="empty">（尚無背包物品）</div>`;

        document.getElementById('award-bag-items').innerHTML = bag;
      }

      // 切換可視
      list.style.display = "none";
      stage.style.display = "block";
      stage.setAttribute("aria-hidden", "false");
      // 頒獎模式通常不需要滑動（仍可滑，但證書建議固定）
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    }

    function setMode(mode){
      const stage = document.getElementById('award-stage');
      const list = document.getElementById('players-wrap');

      if(mode === "award"){
        list.style.display = "none";
        stage.style.display = "block";
        stage.setAttribute("aria-hidden", "false");
        window.scrollTo({ top: 0, behavior: "auto" });
      }else{
        stage.style.display = "none";
        stage.setAttribute("aria-hidden", "true");
        list.style.display = "flex";
      }
    }

    // ===== 監聽 players，渲染一般模式 =====
    db.ref('players').on('value', s => {
      const data = s.val() || {};
      const players = [];
      for (let i = 1; i <= 10; i++) {
        const pKey = `p${i}`;
        const pData = data[pKey] || {};
        const r = pData.res || {};
        const pts = safeVal(r.time) + safeVal(r.money) + safeVal(r.health) + safeVal(r.knowledge) + safeVal(r.social);
        const score = safeVal(r.score);
        players.push({
          pid: i,
          name: pData.name || `玩家 ${i}`,
          res: r,
          pts,
          score,
          inventory: pData.inventory || {}
        });
      }
      PLAYERS = players;
      const { ranked, rankMap } = computePlayers(players);
      RANKED = ranked;
      RANK_MAP = rankMap;

      // 更新「玩家選單」（依排名排序）
      const sel = document.getElementById("awardPlayerSelect");
      const current = sel.value;
      sel.innerHTML = "";
      RANKED.forEach(p => {
        const rank = RANK_MAP.get(p.pid) || 0;
        const opt = document.createElement("option");
        opt.value = String(p.pid);
        opt.textContent = `#${rank}｜${p.name}（p${p.pid}）`;
        sel.appendChild(opt);
      });
      if(current) sel.value = current;

      // 一般模式畫面更新
      renderNormal();

      // 若此刻正在頒獎模式，更新證書內容（避免資料變動不同步）
      if(_awardState.enabled){
        renderAward(_awardState.playerId, _awardState.title);
      }
    });

    // ===== 頒獎狀態：/award =====
    // 格式：{ enabled: true/false, playerId: 1..10, title: "xxx", updatedAt: 123456789 }
    const awardRef = db.ref("award");
    let _awardState = { enabled:false, playerId:1, title:"" };

    function loadAwardToPanel(a){
      const modeSel = document.getElementById("modeSelect");
      const pSel = document.getElementById("awardPlayerSelect");
      const tInp = document.getElementById("awardTitleInput");

      modeSel.value = a.enabled ? "award" : "normal";
      if(a.playerId) pSel.value = String(a.playerId);
      tInp.value = (a.title || "");
    }

    awardRef.on("value", snap => {
      const a = snap.val() || {};
      _awardState = {
        enabled: a.enabled === true,
        playerId: Number(a.playerId || 1),
        title: (a.title || "").toString()
      };

      loadAwardToPanel(_awardState);

      if(_awardState.enabled){
        setMode("award");
        renderAward(_awardState.playerId, _awardState.title);
      }else{
        setMode("normal");
      }
    });

    // 面板按鈕：寫入 Firebase
    document.getElementById("btnApply").addEventListener("click", () => {
      const mode = document.getElementById("modeSelect").value;
      const playerId = Number(document.getElementById("awardPlayerSelect").value || 1);
      const title = (document.getElementById("awardTitleInput").value || "").toString().trim();

      awardRef.set({
        enabled: mode === "award",
        playerId,
        title,
        updatedAt: Date.now()
      });
    });

    // 重新載入：只是把目前 Firebase 狀態回填（其實 on(value) 已會自動）
    document.getElementById("btnRefresh").addEventListener("click", async () => {
      const snap = await awardRef.get();
      const a = snap.val() || {};
      loadAwardToPanel({
        enabled: a.enabled === true,
        playerId: Number(a.playerId || 1),
        title: (a.title || "").toString()
      });
    });

    // 清除頒獎：回一般模式
    document.getElementById("btnClear").addEventListener("click", () => {
      awardRef.set({ enabled:false, playerId:1, title:"", updatedAt: Date.now() });
    });

    // ===== 橙色彈幕：監聽 purchaseFeed 的新增 =====
    db.ref('purchaseFeed').limitToLast(20).on('child_added', s => {
      if (!DANMAKU_ENABLED) return;
      const d = s.val();
      if(!d) return;

      const layer = document.getElementById('danmaku-layer');

      while (layer.children.length >= MAX_DANMAKU_ONSCREEN) {
        layer.removeChild(layer.firstElementChild);
      }
      const el = document.createElement('div');
      el.className = 'danmaku';

      const topMin = 80;
      const topMax = Math.max(topMin, window.innerHeight - 80);
      const top = topMin + Math.floor(Math.random() * Math.max(1, topMax - topMin));
      el.style.top = `${top}px`;

      const who = d.playerName || `玩家${d.playerId || ''}`;
      const what = d.itemName || '物品';
      const img = (d.imageUrl || '').trim();

      el.innerHTML = `
        ${img ? `<img src="${img}" alt="${what}" />` : ''}
        <span>${who} 達成了（${what}）</span>
      `;

      layer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    });
  </script>

  <!-- 若你原本用它做 UI 同步（可留著） -->
  <script src="./js/site-ui-db.js"></script>
</body>
</html>
