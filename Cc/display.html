<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大螢幕 - 排行榜 + 達成清單</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- ✅ Unified Theme + Display Styles (整合後只留一套) -->
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --row:rgba(2,6,23,0.05);
      --text:#0f172a;
      --muted:rgba(15,23,42,0.72);
      --shadow:rgba(2,6,23,0.12);

      --blue:#3b82f6;
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --violet:#8b5cf6;
      --yellow:#fbbf24;

      --radius:18px;

      /* danmaku default (會被 /controls 覆蓋) */
      --danmaku-font-size: 22px;
      --danmaku-duration: 10s;
    }

    html,body{height:100%;}
    body{
      font-family:'Segoe UI','Microsoft JhengHei',system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(900px 420px at 18% 0%, rgba(59,130,246,0.12), transparent 60%),
        radial-gradient(900px 420px at 82% 0%, rgba(34,197,94,0.10), transparent 60%),
        radial-gradient(900px 520px at 50% 100%, rgba(139,92,246,0.10), transparent 65%),
        var(--bg);
      color:var(--text);
      margin:0;
      padding:14px;
      overflow:hidden;
      -webkit-text-size-adjust:100%;
    }

    /* ✅ Display page: 不限制寬度（投影/大螢幕需要全寬） */
    body[data-page="display"]{
      padding:10px 20px;
    }

    /* ===== Header ===== */
    #display-header{
      display:flex;
      gap:15px;
      margin-bottom:12px;
      height:60px;
      position:relative;
      z-index:2;
    }

    #announcement-bar{
      flex:3;
      background:var(--blue);
      border-radius:12px;
      display:none;
      overflow:hidden;
      white-space:nowrap;
      box-shadow:0 10px 26px var(--shadow);
      border:1px solid rgba(2,6,23,0.08);
    }
    #msg-box{
      display:inline-block;
      padding-left:100%;
      animation: marquee-left 10s linear infinite; /* JS 會覆蓋速度/方向 */
      font-size:1.5em;
      font-weight:900;
      color:#fff;
      line-height:60px;
      margin:0;
    }
    @keyframes marquee-left{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
    @keyframes marquee-right{0%{transform:translateX(0);}100%{transform:translateX(100%);}}

    #timer-bar{
      flex:1;
      background:var(--danger);
      border-radius:12px;
      text-align:center;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 26px var(--shadow);
      border:1px solid rgba(2,6,23,0.08);
    }
    #timer-box{
      margin:0;
      font-size:2.5em;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:900;
    }

    /* ===== Layout ===== */
    #main{
      display:flex;
      gap:16px;
      height:calc(100vh - 60px - 24px - 20px); /* header + spacing + body padding 大概值 */
      position:relative;
      z-index:1;
    }
    #left{
      flex:1.2;
      min-width:520px;
      overflow:hidden;
    }
    #right{
      flex:1;
      overflow:hidden;
      border-left:1px dashed rgba(2,6,23,0.12);
      padding-left:16px;
    }

    /* ===== Scoreboard rows ===== */
    .p-row{
      background:var(--card);
      margin-bottom:6px;
      padding:6px 15px;
      border-radius:12px;
      display:flex;
      align-items:center;
      border:1px solid rgba(2,6,23,0.08);
      box-shadow:0 8px 18px rgba(2,6,23,0.06);
      height:7vh;
      min-height:56px;
    }

    .rank-1{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.32);border-left:10px solid var(--yellow);}
    .rank-2{background:rgba(148,163,184,0.12);border-color:rgba(148,163,184,0.32);border-left:10px solid rgba(148,163,184,0.9);}
    .rank-3{background:rgba(245,158,11,0.10);border-color:rgba(245,158,11,0.26);border-left:10px solid var(--warn);}

    .rank-num{font-size:1.4em;font-weight:900;width:35px;color:rgba(15,23,42,0.45);}
    .rank-1 .rank-num{color:var(--yellow);}

    .player-name{
      font-size:1.2em;
      font-weight:900;
      width:140px;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .res-summary{
      flex:1;
      display:flex;
      justify-content:space-around;
      font-size:0.95em;
      padding:0 10px;
      gap:10px;
    }
    .res-item{
      display:flex;
      align-items:center;
      gap:6px;
      font-weight:800;
      white-space:nowrap;
    }
    .res-label{font-size:0.85em;opacity:.9;}

    .res-score{
      color:var(--warn);
      background:rgba(245,158,11,0.14);
      padding:2px 10px;
      border-radius:999px;
      border:1px solid rgba(245,158,11,0.22);
    }

    .total-box{
      width:110px;
      text-align:right;
      border-left:1px dashed rgba(2,6,23,0.14);
      padding-left:10px;
    }
    .total-val{font-size:1.6em;font-weight:900;color:var(--blue);}
    .pts{font-size:0.55em;color:rgba(15,23,42,0.55);margin-left:2px;}

    /* ===== Purchases panel ===== */
    #purchases-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 10px 0;
      font-size:1.3em;
      font-weight:900;
      color:var(--text);
    }

    .buy-card{
      background:var(--card);
      border:1px solid rgba(2,6,23,0.08);
      border-radius:14px;
      padding:10px 12px;
      margin-bottom:10px;
      box-shadow:0 10px 24px rgba(2,6,23,0.06);
    }
    .buy-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
      gap:10px;
    }
    .buy-name{
      font-weight:900;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:70%;
    }
    .buy-count{
      font-weight:900;
      color:var(--warn);
      font-size:0.95em;
      background:rgba(245,158,11,0.14);
      border:1px solid rgba(245,158,11,0.22);
      padding:2px 10px;
      border-radius:999px;
      white-space:nowrap;
    }
    .buy-items{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      max-height:18vh;
      overflow:hidden;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#fff;
      border:1px solid rgba(2,6,23,0.10);
      padding:6px 10px;
      border-radius:999px;
      font-weight:900;
      font-size:0.92em;
      color:var(--text);
    }
    .chip img{
      width:22px;
      height:22px;
      border-radius:8px;
      object-fit:cover;
      border:1px solid rgba(2,6,23,0.10);
    }
    .chip .icon{
      width:22px;
      height:22px;
      border-radius:8px;
      border:1px dashed rgba(2,6,23,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(15,23,42,0.45);
      font-size:0.95em;
      background:rgba(2,6,23,0.02);
    }

    /* ===== Danmaku overlay ===== */
    #danmaku-layer{
      position:fixed;
      left:0;
      top:0;
      width:100vw;
      min-height:100vh;
      pointer-events:none;
      overflow:hidden;
      z-index:3;
    }
    .danmaku{
      font-size: var(--danmaku-font-size);
      position:absolute;
      right:-40vw;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:6px 12px;
      border-radius:999px;
      font-weight:900;
      color:#fff;
      background:rgba(245,158,11,0.95);
      box-shadow:0 10px 26px rgba(2,6,23,0.18);
      will-change:transform;
      animation:fly var(--danmaku-duration) linear forwards;
    }
    .danmaku img{
      width:28px;
      height:28px;
      border-radius:10px;
      object-fit:cover;
      border:2px solid rgba(255,255,255,0.7);
      background:#fff;
    }
    @keyframes fly{
      from{transform:translateX(0);}
      to{transform:translateX(-140vw);}
    }
  </style>
</head>

<body data-page="display">
  <div id="danmaku-layer"></div>

  <div id="display-header">
    <div id="announcement-bar"><p id="msg-box"></p></div>
    <div id="timer-bar"><h1 id="timer-box">00:00</h1></div>
  </div>

  <div id="main">
    <div id="left">
      <div id="board-list"></div>
    </div>

    <div id="right">
      <div id="purchases-title"><i class="fas fa-receipt"></i> 玩家達成清單（人生背包）</div>
      <div id="purchases-list"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ===== 控制台參數（從 /controls 讀取）=====
    let MAX_DANMAKU_ONSCREEN = 8;
    let DANMAKU_ENABLED = true;

    db.ref("controls").on("value", (snap) => {
      const c = snap.val() || {};
      const danmakuSec = Number(c.danmakuDurationSec ?? 10);
      const fontPx = Number(c.danmakuFontSizePx ?? 22);
      const maxOn = Number(c.danmakuMaxOnScreen ?? 8);

      document.documentElement.style.setProperty("--danmaku-duration", `${Math.max(3, Math.min(60, danmakuSec))}s`);
      document.documentElement.style.setProperty("--danmaku-font-size", `${Math.max(12, Math.min(64, fontPx))}px`);

      MAX_DANMAKU_ONSCREEN = Math.max(1, Math.min(30, maxOn));
      DANMAKU_ENABLED = (c.danmakuEnabled !== false);
    });

    // ===== 跑馬燈公告（從 /marquee 讀取）=====
    const marqueeRef = db.ref("marquee");
    const bar = document.getElementById("announcement-bar");
    const msgBox = document.getElementById("msg-box");

    marqueeRef.on("value", (snap) => {
      const v = snap.val() || {};
      const enabled   = v.enabled ?? true;
      const text      = (v.text ?? "").toString();
      const speedSec  = Math.max(3, Number(v.speedSec ?? 10));
      const direction = (v.direction === "right") ? "right" : "left";
      const fontSize  = Math.max(12, Number(v.fontSize ?? 22));

      if (!bar || !msgBox) return;

      bar.style.display = (enabled && text.trim()) ? "block" : "none";
      if (!(enabled && text.trim())) return;

      msgBox.textContent = "📢 " + text;
      msgBox.style.fontSize = fontSize + "px";

      if (v.bgColor) bar.style.background = v.bgColor;
      if (v.textColor) msgBox.style.color = v.textColor;

      msgBox.style.animation = "none";
      void msgBox.offsetWidth; // reflow
      msgBox.style.animation = `marquee-${direction} ${speedSec}s linear infinite`;
    });

    // ===== 計時器同步 =====
    db.ref('timerSync').on('value', s => {
      const d = s.val();
      if (!d) return;
      const m = Math.floor(d.timeLeft / 60).toString().padStart(2, '0');
      const sc = (d.timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-box').innerText = `${m}:${sc}`;
      document.getElementById('timer-bar').style.background = (d.timeLeft <= 0) ? "#94a3b8" : "var(--danger)";
    });

    function safeVal(v){ return (typeof v === 'number' && isFinite(v)) ? v : (v || 0); }

    // ===== 排名監聽：分數第一、PTS 第二 =====
    db.ref('players').on('value', s => {
      const data = s.val() || {};
      const arr = [];

      for (let i = 1; i <= 10; i++) {
        const pKey = `p${i}`;
        const pData = data[pKey] || {};
        const r = pData.res || {};
        const pts = safeVal(r.time) + safeVal(r.money) + safeVal(r.health) + safeVal(r.knowledge) + safeVal(r.social);
        const score = safeVal(r.score);
        arr.push({
          pid: i,
          name: pData.name || `玩家 ${i}`,
          res: r,
          pts,
          score,
          inventory: pData.inventory || {}
        });
      }

      arr.sort((a,b)=> (b.score !== a.score) ? (b.score - a.score) : (b.pts - a.pts));

      // 1) 左邊排行榜
      const list = document.getElementById('board-list');
      list.innerHTML = "";
      arr.forEach((p, i) => {
        const rank = i + 1;
        const rClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));

        list.innerHTML += `
          <div class="p-row ${rClass}">
            <div class="rank-num">${rank}</div>
            <div class="player-name">${p.name}</div>
            <div class="res-summary">
              <div class="res-item" style="color:var(--violet)"><span class="res-label">時</span><i class="fas fa-clock"></i>${safeVal(p.res.time)}</div>
              <div class="res-item" style="color:var(--warn)"><span class="res-label">金</span><i class="fas fa-wallet"></i>${safeVal(p.res.money)}</div>
              <div class="res-item" style="color:var(--danger)"><span class="res-label">健</span><i class="fas fa-heartbeat"></i>${safeVal(p.res.health)}</div>
              <div class="res-item" style="color:var(--blue)"><span class="res-label">知</span><i class="fas fa-book"></i>${safeVal(p.res.knowledge)}</div>
              <div class="res-item" style="color:var(--ok)"><span class="res-label">人</span><i class="fas fa-users"></i>${safeVal(p.res.social)}</div>
              <div class="res-item res-score"><span class="res-label">分</span><i class="fas fa-star"></i>${safeVal(p.res.score)}</div>
            </div>
            <div class="total-box"><span class="total-val">${p.pts}</span><span class="pts">PTS</span></div>
          </div>`;
      });

      // 2) 右邊達成清單（固定依玩家編號）
      const purchases = document.getElementById('purchases-list');
      purchases.innerHTML = "";

      const fixed = [...arr].sort((a,b)=>a.pid-b.pid);
      fixed.forEach(p => {
        const inv = p.inventory || {};
        const items = Object.keys(inv).map(k => inv[k]).filter(Boolean);
        items.sort((a,b)=> (safeVal(b.time) - safeVal(a.time)));

        purchases.innerHTML += `
          <div class="buy-card">
            <div class="buy-head">
              <div class="buy-name"><i class="fas fa-user"></i> ${p.name}</div>
              <div class="buy-count">${items.length} 件</div>
            </div>
            <div class="buy-items">
              ${items.slice(0, 12).map(it => {
                const nm = it.name || '未命名';
                const img = (it.imageUrl || '').trim();
                return `
                  <div class="chip" title="${nm}">
                    ${img ? `<img src="${img}" alt="${nm}" />` : `<div class="icon">🛍️</div>`}
                    <span>${nm}</span>
                  </div>`;
              }).join('')}
              ${items.length > 12 ? `<div class="chip"><div class="icon">…</div><span>+${items.length-12}</span></div>` : ''}
            </div>
          </div>`;
      });
    });

    // ===== 橙色彈幕：監聽 purchaseFeed 新增 =====
    db.ref('purchaseFeed').limitToLast(20).on('child_added', s => {
      if (!DANMAKU_ENABLED) return;
      const d = s.val();
      if(!d) return;

      const layer = document.getElementById('danmaku-layer');

      while (layer.children.length >= MAX_DANMAKU_ONSCREEN) {
        layer.removeChild(layer.firstElementChild);
      }

      const el = document.createElement('div');
      el.className = 'danmaku';

      const topMin = 80; // 避開 header
      const topMax = Math.max(topMin, window.innerHeight - 80);
      const top = topMin + Math.floor(Math.random() * Math.max(1, topMax - topMin));
      el.style.top = `${top}px`;

      const who = d.playerName || `玩家${d.playerId || ''}`;
      const what = d.itemName || '物品';
      const img = (d.imageUrl || '').trim();

      el.innerHTML = `
        ${img ? `<img src="${img}" alt="${what}" />` : ''}
        <span>${who} 達成了（${what}）</span>
      `;

      layer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    });
  </script>

  <!-- 你原本的外掛 JS 保留 -->
  <script src="./js/site-ui-db.js"></script>
</body>
</html>
