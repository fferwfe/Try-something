<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>人生履歷｜入口</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --row:rgba(2,6,23,0.05);
      --text:#0f172a; --muted:rgba(15,23,42,0.72); --shadow:rgba(2,6,23,0.12);
      --blue:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --violet:#8b5cf6;
      --radius:18px;
    }
    html,body{height:100%;}
    body{
      margin:0; padding:14px;
      font-family:'Segoe UI','Microsoft JhengHei',system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(900px 420px at 18% 0%, rgba(59,130,246,0.12), transparent 60%),
        radial-gradient(900px 420px at 82% 0%, rgba(34,197,94,0.10), transparent 60%),
        radial-gradient(900px 520px at 50% 100%, rgba(139,92,246,0.10), transparent 65%),
        var(--bg);
      color:var(--text);
    }
    .wrap{max-width:860px;margin:0 auto;}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 10px 26px var(--shadow);
      border:1px solid rgba(2,6,23,0.08);
      padding:14px 16px;
      margin:12px 0;
    }
    h1{font-size:1.5rem;margin:8px 0 6px;}
    .hint{color:var(--muted);font-size:.95em;line-height:1.4;margin-top:6px;}
    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:12px;
      margin-top:12px;
    }
    @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
    a.btn{
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 14px;
      border-radius:16px;
      background:var(--row);
      border:1px solid rgba(2,6,23,0.10);
      color:var(--text);
      font-weight:1000;
      box-shadow:0 6px 16px rgba(2,6,23,0.06);
      transition:transform .12s, filter .12s;
    }
    a.btn:hover{filter:brightness(1.03);}
    a.btn:active{transform:scale(.99);}
    .left{display:flex;align-items:center;gap:10px;}
    .tag{font-size:.85em;color:var(--muted);font-weight:900;}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      background:rgba(2,6,23,0.06);font-weight:900;font-size:.95em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill"><i class="fa-solid fa-compass"></i> 入口導航</div>
      <h1>人生履歷｜系統入口</h1>
      <div class="hint">
        你可以從這裡進入各角色頁面。<br>
        UI 主題（背景/音效）統一由 <b>ui_config.html</b> 控制。
      </div>

      <div class="grid">
        <a class="btn" href="player2.html">
          <div class="left"><i class="fa-solid fa-user" style="color:var(--ok)"></i> 玩家端</div>
          <span class="tag">player2.html</span>
        </a>

        <a class="btn" href="shop.html">
          <div class="left"><i class="fa-solid fa-store" style="color:var(--warn)"></i> 商店端</div>
          <span class="tag">shop.html</span>
        </a>

        <a class="btn" href="admin.html">
          <div class="left"><i class="fa-solid fa-screwdriver-wrench" style="color:var(--blue)"></i> 管理主控台</div>
          <span class="tag">admin.html</span>
        </a>

        <a class="btn" href="super2.html">
          <div class="left"><i class="fa-solid fa-crown" style="color:var(--violet)"></i> SUPER 控制</div>
          <span class="tag">super2.html</span>
        </a>

        <a class="btn" href="display_purchases.html">
          <div class="left"><i class="fa-solid fa-tv" style="color:#6c5ce7"></i> 顯示端</div>
          <span class="tag">display.html</span>
        </a>

        <a class="btn" href="display_purchases.html">
          <div class="left"><i class="fa-solid fa-bullhorn" style="color:#e84393"></i> 顯示端＋彈幕</div>
          <span class="tag">display_purchases.html</span>
        </a>

        <a class="btn" href="ui.html">
          <div class="left"><i class="fa-solid fa-palette" style="color:#00b894"></i> UI 設定台</div>
          <span class="tag">ui_config.html</span>
        </a>
      </div>
    </div>

    <div class="card">
      <div class="hint">
        小提醒：如果你放在子資料夾（例如 /Try-something/），連結也仍然可用，因為都是相對路徑 <code>./xxx.html</code>。
      </div>
    </div>
  </div>
</body>
</html>
