<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜Player</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --stroke:rgba(2,6,23,.10);
  --text:#0f172a;
  --muted:rgba(15,23,42,.65);
  --shadow:0 16px 42px rgba(2,6,23,.10);
  --r:18px;

  --pri:#2563eb;
  --pri2:#06b6d4;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#f59e0b;

  --mq-sec:10s;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding:12px 12px 24px;
  font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 12% 10%, rgba(37,99,235,.10), transparent 56%),
    radial-gradient(700px 420px at 88% 18%, rgba(6,182,212,.10), transparent 55%),
    linear-gradient(180deg,#ffffff,var(--bg));
}
.app{max-width:560px;margin:0 auto}
.hide{display:none!important}
.card{
  background: var(--card);
  border:1px solid var(--stroke);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}

/* ===== Sticky Top ===== */
.topSticky{
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 8px 0 10px;
  backdrop-filter: blur(10px);
}

/* Marquee */
#notice-bar{
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.85));
  color:#fff;
  border-radius:14px;
  overflow:hidden;
  display:none;
  border:1px solid rgba(255,255,255,.22);
  box-shadow: 0 10px 24px rgba(2,6,23,.14);
}
#notice-text{
  display:inline-block;
  padding:10px 0 10px 100%;
  font-weight:1000;
  animation:marquee-left var(--mq-sec,10s) linear infinite;
}
@keyframes marquee-left{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}

/* Timer strip */
.timerStrip{
  margin-top:10px;
  background: rgba(2,6,23,.04);
  border:1px solid rgba(2,6,23,.10);
  border-radius:14px;
  padding:10px 12px;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.timerStrip b{font-size:13px}
.timerStrip .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(2,6,23,.10);
  background: rgba(255,255,255,.95);
  color: rgba(15,23,42,.75);
  font-size:12px;
  font-weight:900;
}
.pill.ok{border-color: rgba(22,163,74,.25); color:#166534; background: rgba(22,163,74,.08)}
.pill.warn{border-color: rgba(245,158,11,.25); color:#92400e; background: rgba(245,158,11,.08)}
.pill.bad{border-color: rgba(220,38,38,.25); color:#991b1b; background: rgba(220,38,38,.08)}

/* Event banner (after ACK) */
#eventBanner{margin-top:10px;display:none}
.bannerCard{
  border-radius:16px;
  border:1px solid rgba(2,6,23,.10);
  background:#fff;
  box-shadow: 0 14px 30px rgba(2,6,23,.08);
  padding:10px 12px;
  text-align:left;
}
.bannerTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bannerTitle{font-weight:1100;font-size:14px;letter-spacing:.2px}
.bannerMeta{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.25}
.bannerBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  border:none;
  border-radius:12px;
  padding:10px 12px;
  font-weight:1000;
  cursor:pointer;
}
.btn.pri{background: rgba(37,99,235,.95); color:#fff}
.btn.sec{background: rgba(2,6,23,.06); color:var(--text); border:1px solid rgba(2,6,23,.10)}
.btn.ok{background: rgba(22,163,74,.95); color:#fff}
.btn.bad{background: rgba(220,38,38,.95); color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ===== Login ===== */
#login.card{padding:18px}
#login h2{margin:6px 0 14px;font-size:18px}
#login select,#login input{
  width:100%;
  padding:12px 12px;
  border-radius:14px;
  border:1px solid rgba(2,6,23,.12);
  background:#fff;
  color: var(--text);
  outline:none;
  margin:8px 0;
}
#join-btn{
  width:100%;
  padding:12px 14px;
  border:none;
  border-radius:14px;
  font-weight:1000;
  cursor:pointer;
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.88));
  color:#fff;
  margin-top:10px;
}

/* ===== Role Info ===== */
.playerCard{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  text-align:left;
}
.avatar{
  width:64px;height:64px;
  border-radius:18px;
  background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(6,182,212,.78));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;
  flex:0 0 auto;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}
.avatar.hasPhoto #avatarEmoji{display:none}
.avatar.hasPhoto{background-size:cover;background-position:center}

.pInfo h2{margin:0;font-size:18px;letter-spacing:.2px}
.pInfo .sub{margin-top:4px;color:var(--muted);font-size:13px}
.badges{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.badge{
  padding:7px 10px;
  border-radius:999px;
  background: rgba(2,6,23,.05);
  border:1px solid rgba(2,6,23,.10);
  font-size:12px;
  color: rgba(15,23,42,.75);
}
.badge b{color:#0f172a}

/* ===== Radar bigger ===== */
.radarWrap{margin-top:12px;padding:14px 12px 12px}
#radarChart{width:100%!important;max-height:360px}
.radarHint{margin-top:8px;color:var(--muted);font-size:12px;text-align:left}

/* ===== Resources bigger, time last ===== */
.sectionTitle{
  margin:14px 4px 8px;
  text-align:left;
  color: rgba(15,23,42,.78);
  font-weight:1100;
  font-size:13px;
}
.resGrid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap:12px;
}
.resItem{padding:14px 14px 12px;text-align:left}
.resItem .k{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:1000}
.resItem .v{margin-top:8px;font-size:26px;font-weight:1100;letter-spacing:.3px}
.resItem.full{grid-column: 1 / -1;}
.bar{
  margin-top:12px;
  height:12px;border-radius:999px;
  background: rgba(2,6,23,.06);
  overflow:hidden;
  border: 1px solid rgba(2,6,23,.08);
}
.fill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, rgba(6,182,212,.95), rgba(37,99,235,.95));
}

/* ===== Achievements ===== */
.achWrap{margin-top:14px;padding:14px;text-align:left}
.achWrap h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.achGrid{display:grid;grid-template-columns: repeat(3, minmax(0,1fr));gap:10px}
.ach{
  border:1px solid rgba(2,6,23,.10);
  background: rgba(2,6,23,.03);
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
}
.ach .icon{font-size:20px}
.ach .name{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.2}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

/* ===== Shop direct buy ===== */
.shopWrap{margin-top:14px;padding:14px;text-align:left}
.shopWrap h3{margin:0 0 10px;font-size:15px;letter-spacing:.2px}
.shopList{display:flex;flex-direction:column;gap:10px}
.shopItem{
  display:flex; gap:10px; align-items:center;
  border:1px solid rgba(2,6,23,.10);
  background: rgba(2,6,23,.03);
  border-radius:14px;
  padding:10px;
}
.shopImg{
  width:56px;height:56px;border-radius:14px;
  background: rgba(2,6,23,.06);
  border:1px solid rgba(2,6,23,.08);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
}
.shopImg img{width:100%;height:100%;object-fit:cover;display:block}
.shopInfo{flex:1}
.shopName{font-weight:1100}
.shopMeta{margin-top:4px;color:var(--muted);font-size:12px}
.shopBuyBtn{
  border:none;border-radius:12px;
  padding:10px 12px;
  font-weight:1100; cursor:pointer;
  background: rgba(37,99,235,.95); color:#fff;
}
.shopBuyBtn:disabled{opacity:.55;cursor:not-allowed}

/* ===== Fullscreen Event Modal (must ACK) ===== */
#eventModal{
  position:fixed;
  inset:0;
  z-index:9999;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.modalCard{
  width:min(560px,100%);
  border-radius:22px;
  background:#fff;
  border:1px solid rgba(2,6,23,.10);
  box-shadow: 0 30px 80px rgba(2,6,23,.18);
  padding:16px;
  text-align:left;
}
.modalTitle{font-size:18px;font-weight:1200;letter-spacing:.2px;margin:0 0 8px}
.modalSub{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.35}
.kv{
  background: rgba(2,6,23,.03);
  border:1px solid rgba(2,6,23,.08);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
}
.kv b{display:block;font-size:12px;color:rgba(15,23,42,.72)}
.kv .v{margin-top:6px;font-weight:1000}
.modalBtns{display:flex;gap:10px;margin-top:12px}
.modalBtns .btn{flex:1}

body.lockScroll{overflow:hidden}
</style>
</head>

<body>
<div class="app">

  <!-- login -->
  <div class="card" id="login">
    <h2>角色登入</h2>
    <select id="pid">
      <option value="1">1號玩家</option><option value="2">2號玩家</option>
      <option value="3">3號玩家</option><option value="4">4號玩家</option>
      <option value="5">5號玩家</option><option value="6">6號玩家</option>
      <option value="7">7號玩家</option><option value="8">8號玩家</option>
      <option value="9">9號玩家</option><option value="10">10號玩家</option>
      <option value="11">11號玩家</option>
    </select>
    <input id="pname" placeholder="輸入暱稱">
    <button id="join-btn">開始遊戲</button>
  </div>

  <!-- game -->
  <div class="hide" id="game">

    <!-- Top sticky -->
    <div class="topSticky">

      <div id="notice-bar"><span id="notice-text"></span></div>

      <div class="timerStrip" id="timerStrip">
        <div><b>⏱️ 任務倒數</b></div>
        <div class="right">
          <span class="pill warn">剩餘：<span id="evtLeft">--:--</span></span>
          <span class="pill" id="evtPoolPill">時段：-</span>
          <span class="pill" id="evtIdPill">事件：-</span>
        </div>
      </div>

      <div id="eventBanner">
        <div class="bannerCard">
          <div class="bannerTop">
            <div>
              <div class="bannerTitle" id="bannerTitle">（目前任務）</div>
              <div class="bannerMeta" id="bannerMeta">---</div>
            </div>
            <span class="pill ok" id="bannerState">已收到</span>
          </div>
          <div class="bannerBtns">
            <button class="btn pri" id="bannerOpenBtn">查看任務</button>
            <button class="btn ok" id="bannerDoneBtn">我完成了</button>
            <button class="btn sec" id="bannerHideBtn">收起提示</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Role Info -->
    <div class="card playerCard">
      <div class="avatar" id="avatarBtn" title="點我換照片">
        <span id="avatarEmoji">🧑</span>
      </div>
      <input id="avatarInput" type="file" accept="image/*" capture="user" class="hide">

      <div class="pInfo">
        <h2 id="me">---</h2>
        <div class="sub" id="titleText">稱號：冒險者</div>
        <div class="badges">
          <span class="badge">🏆 總分 <b id="scoreTop">0</b></span>
          <span class="badge">📦 總資源 <b id="totalResTop">0</b></span>
        </div>
      </div>
    </div>

    <!-- Radar -->
    <div class="card radarWrap">
      <canvas id="radarChart"></canvas>
      <div class="radarHint">提示：五項能力會同步反映在雷達圖上。</div>
    </div>

    <!-- Resources -->
    <div class="sectionTitle">資源</div>
    <div class="resGrid">

      <div class="card resItem">
        <div class="k">💰 金錢</div>
        <div class="v" id="money">0</div>
        <div class="bar"><div class="fill" id="bar-money"></div></div>
      </div>

      <div class="card resItem">
        <div class="k">❤️ 健康</div>
        <div class="v" id="health">0</div>
        <div class="bar"><div class="fill" id="bar-health"></div></div>
      </div>

      <div class="card resItem">
        <div class="k">📘 知識</div>
        <div class="v" id="knowledge">0</div>
        <div class="bar"><div class="fill" id="bar-knowledge"></div></div>
      </div>

      <div class="card resItem">
        <div class="k">🤝 人際</div>
        <div class="v" id="social">0</div>
        <div class="bar"><div class="fill" id="bar-social"></div></div>
      </div>

      <div class="card resItem full">
        <div class="k">⏳ 時間（放最下面）</div>
        <div class="v" id="time">0</div>
        <div class="bar"><div class="fill" id="bar-time"></div></div>
      </div>

    </div>

    <!-- Achievements -->
    <div class="card achWrap">
      <h3>🏅 人生成就</h3>
      <div id="achievements-list" class="achGrid"></div>
      <div id="achievements-empty" class="empty hide">尚未獲得成就</div>
    </div>

    <!-- Shop -->
    <div class="card shopWrap">
      <h3>🛒 商店（直接兌換）</h3>
      <div class="shopList" id="shopList"></div>
      <div class="empty" id="shopEmpty">尚無商品</div>
    </div>

  </div>
</div>

<!-- Fullscreen Event Modal -->
<div id="eventModal">
  <div class="modalCard">
    <h2 class="modalTitle" id="evtTitle">隨機事件</h2>
    <p class="modalSub" id="evtDesc">---</p>

    <div class="kv">
      <b>事件影響</b>
      <div class="v" id="evtImpact">---</div>
    </div>

    <div class="kv">
      <b>事件任務</b>
      <div class="v" id="evtTask">---</div>
    </div>

    <div class="kv">
      <b>事件回饋</b>
      <div class="v" id="evtReward">---</div>
    </div>

    <div class="modalBtns">
      <button class="btn pri" id="evtAckBtn">同意（我已收到）</button>
      <button class="btn sec" id="evtCloseBtn">稍後再看</button>
    </div>
  </div>
</div>

<script>
/* ========= Firebase 初始化 ========= */
const firebaseConfig = {
  apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
  authDomain: "try-something-ddd1e.firebaseapp.com",
  databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "try-something-ddd1e",
  storageBucket: "try-something-ddd1e.firebasestorage.app",
  messagingSenderId: "245905464126",
  appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f",
  measurementId: "G-CG44LW3L84"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ========= state ========= */
const resNames={time:"時間",money:"金錢",health:"健康",knowledge:"知識",social:"人際",score:"分數"};
let myId=null,myName="";
let radar=null;
let currentEvent=null;
let countdownTimer=null;

/* ========= login ========= */
document.getElementById("join-btn").onclick=()=>{
  myId=document.getElementById("pid").value;
  myName=document.getElementById("pname").value.trim();
  if(!myName) return alert("請輸入暱稱");

  document.getElementById("login").classList.add("hide");
  document.getElementById("game").classList.remove("hide");
  document.getElementById("me").innerText=myName;

  loadAvatarFromLocal();
  bindAvatarPicker();

  initRadar();
  bindRes();
  bindAchievements();
  bindShop();

  bindMarquee();
  bindActiveEvent();
};

/* ========= marquee ========= */
function bindMarquee(){
  const bar = document.getElementById("notice-bar");
  const text = document.getElementById("notice-text");

  const msgRef1 = db.ref("broadcast/message");
  const msgRef2 = db.ref("broadcast/text");
  const secRef  = db.ref("broadcast/mqSec");

  function setMsg(v){
    const msg = String(v||"").trim();
    if(!msg){
      bar.style.display="none";
      return;
    }
    text.innerText = msg + "　　";
    bar.style.display="block";
  }

  msgRef1.on("value", s=> setMsg(s.val()));
  msgRef2.on("value", s=> setMsg(s.val()));
  secRef.on("value", s=>{
    const sec = Number(s.val()||0);
    if(sec>0) document.documentElement.style.setProperty("--mq-sec", `${sec}s`);
  });
}

/* ========= radar ========= */
function initRadar(){
  radar=new Chart(radarChart,{
    type:"radar",
    data:{
      labels:["金錢","健康","知識","人際","時間"],
      datasets:[{
        data:[0,0,0,0,0],
        borderWidth:2,
        pointRadius:3,
        fill:true
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{r:{beginAtZero:true}}
    }
  });
}

/* ========= resources + top badges ========= */
function bindRes(){
  const keys=["time","money","health","knowledge","social","score"];

  keys.forEach(k=>{
    db.ref(`players/p${myId}/res/${k}`).on("value",s=>{
      const v = Number(s.val()||0);

      if(k==="score"){
        scoreTop.innerText = v;
      }else{
        document.getElementById(k).innerText = v;
        setBar(k, v);
      }

      const r = {
        money:Number(money.innerText||0),
        health:Number(health.innerText||0),
        knowledge:Number(knowledge.innerText||0),
        social:Number(social.innerText||0),
        time:Number(time.innerText||0),
      };

      if(radar){
        radar.data.datasets[0].data=[r.money, r.health, r.knowledge, r.social, r.time];
        radar.update();
      }

      totalResTop.innerText = r.money + r.health + r.knowledge + r.social + r.time;
      titleText.innerText = "稱號：" + genTitle(r);
    });
  });
}
function setBar(k, v){
  const cap = 10;
  const pct = Math.max(0, Math.min(100, (v/cap)*100));
  const el = document.getElementById(`bar-${k}`);
  if(el) el.style.width = pct + "%";
}
function genTitle(r){
  const arr = Object.entries(r).sort((a,b)=>b[1]-a[1]);
  const top = arr[0]?.[0] || "time";
  const map = {
    time:"時間掌控者",
    money:"理財高手",
    health:"鋼鐵之心",
    knowledge:"知識旅人",
    social:"人脈王"
  };
  return map[top] || "冒險者";
}

/* ========= achievements ========= */
function bindAchievements(){
  const listEl = document.getElementById("achievements-list");
  const emptyEl = document.getElementById("achievements-empty");

  db.ref(`players/p${myId}/achievements`).on("value", s=>{
    const val = s.val();
    let items = [];

    if(Array.isArray(val)){
      items = val.filter(Boolean);
    }else if(val && typeof val === "object"){
      items = Object.keys(val).filter(k=>val[k]);
    }

    if(!items.length){
      listEl.innerHTML = "";
      emptyEl.classList.remove("hide");
      return;
    }

    emptyEl.classList.add("hide");
    listEl.innerHTML = items.map(name=>`
      <div class="ach">
        <div class="icon">🏅</div>
        <div class="name">${escapeHtml(String(name))}</div>
      </div>
    `).join("");
  });
}

/* ========= shop (direct buy) ========= */
function bindShop(){
  const list = document.getElementById("shopList");
  const empty = document.getElementById("shopEmpty");

  db.ref("shop/items").on("value", s=>{
    const obj = s.val() || {};
    const items = Object.entries(obj)
      .map(([id,v])=>({id, ...(v||{})}))
      .filter(it=>it && it.enabled !== false);

    if(!items.length){
      list.innerHTML = "";
      empty.classList.remove("hide");
      return;
    }
    empty.classList.add("hide");

    list.innerHTML = items.map(it=>{
      const img = it.img ? `<img src="${escapeHtml(it.img)}" alt="">` : "🛍️";
      const price = Number(it.price||0);
      return `
        <div class="shopItem">
          <div class="shopImg">${img}</div>
          <div class="shopInfo">
            <div class="shopName">${escapeHtml(it.name || it.id)}</div>
            <div class="shopMeta">價格：${isFinite(price)?price:0}（扣金錢）</div>
          </div>
          <button class="shopBuyBtn" onclick="buyItem('${escapeHtml(it.id)}')">兌換</button>
        </div>
      `;
    }).join("");
  });
}

window.buyItem = async (itemId)=>{
  const itemSnap = await db.ref(`shop/items/${itemId}`).get();
  const item = itemSnap.val();
  if(!item || item.enabled === false) return alert("商品不存在或已下架");

  const price = Number(item.price || 0);
  if(price < 0) return alert("價格設定錯誤");

  const moneyRef = db.ref(`players/p${myId}/res/money`);
  const tx = await moneyRef.transaction(curr=>{
    const now = Number(curr)||0;
    if(now < price) return;
    return now - price;
  });

  if(!tx.committed){
    return alert("金錢不足，無法兌換");
  }

  const recRef = db.ref(`players/p${myId}/purchases`).push();
  await recRef.set({
    itemId,
    name: item.name || itemId,
    price,
    at: Date.now()
  });

  alert(`✅ 兌換成功：${item.name || itemId}`);
};

/* ========= active random event ========= */
function bindActiveEvent(){
  db.ref(`players/p${myId}/activeEvent`).on("value", s=>{
    const ev = s.val();
    currentEvent = ev || null;

    if(!ev){
      hideEventModal();
      hideBanner();
      hideTimer();
      stopCountdown();
      return;
    }

    updateTimerFromEvent(ev);

    if(ev.status==="pending"){
      if(!ev.ack){
        showEventModal(ev, {forceAck:true});
      }else{
        showBanner(ev);
      }
      return;
    }

    if(ev.status==="success"){
      alert("🎉 管理員已同意：任務完成（已返還/發放獎勵）");
      hideEventModal();
      hideBanner();
      hideTimer();
      stopCountdown();
      return;
    }
    if(ev.status==="fail"){
      alert("❌ 管理員判定：任務未完成 / 失敗");
      hideEventModal();
      hideBanner();
      hideTimer();
      stopCountdown();
      return;
    }
  });

  bannerOpenBtn.onclick = ()=>{
    if(!currentEvent) return;
    showEventModal(currentEvent, {forceAck:false});
  };

  bannerHideBtn.onclick = ()=>{
    eventBanner.style.display = "none";
  };

  bannerDoneBtn.onclick = async ()=>{
    if(!currentEvent || currentEvent.status!=="pending"){
      return alert("目前沒有可回報的任務。");
    }

    const fr = currentEvent.finishRequest || null;
    if(fr && fr.status==="pending"){
      return alert("你已送出完成申請，等待管理員確認。");
    }
    if(fr && fr.status==="approved"){
      return alert("管理員已同意完成。");
    }

    await db.ref(`players/p${myId}/activeEvent`).update({
      playerDone: true,
      playerDoneAt: Date.now(),
      finishRequest: {
        status: "pending",
        requestedAt: Date.now()
      }
    });

    alert("✅ 已送出完成申請，等待管理員確認。");
  };
}

/* ===== Event Modal ===== */
function showEventModal(ev, opt){
  const forceAck = !!opt?.forceAck;

  evtTitle.innerText = ev.title || "隨機事件";
  evtDesc.innerText  = ev.desc || "";

  evtImpact.innerText = fmtImpact(ev.cost, ev.impactText);
  evtTask.innerText   = ev.taskHint || "完成指定任務";
  evtReward.innerText = fmtReward(ev.reward);

  eventModal.style.display = "flex";
  document.body.classList.add("lockScroll");

  evtAckBtn.innerText = forceAck ? (ev.confirmText || "同意（我已收到）") : "我知道了";
  evtAckBtn.onclick = async ()=>{
    if(forceAck){
      await db.ref(`players/p${myId}/activeEvent`).update({
        ack: true,
        ackAt: Date.now()
      });
    }
    hideEventModal();
  };

  evtCloseBtn.onclick = ()=>{
    if(forceAck){
      alert("請先按「同意」代表你已收到任務。");
      return;
    }
    hideEventModal();
  };
}
function hideEventModal(){
  eventModal.style.display = "none";
  document.body.classList.remove("lockScroll");
}

/* ===== Banner rendering ===== */
function showBanner(ev){
  const fr = ev.finishRequest || null;

  let stateText = "已收到";
  let stateClass = "pill ok";
  let metaExtra = "等待你完成並回報管理員";

  if(fr && fr.status==="pending"){
    stateText = "待管理員同意";
    stateClass = "pill warn";
    metaExtra = "你已送出完成申請，等待管理員確認";
  }
  if(fr && fr.status==="approved"){
    stateText = "已同意";
    stateClass = "pill ok";
    metaExtra = "管理員已同意完成（已返還/發放獎勵）";
  }
  if(fr && fr.status==="rejected"){
    stateText = "被駁回";
    stateClass = "pill bad";
    metaExtra = "管理員駁回完成申請（可再次回報）";
  }

  bannerTitle.innerText = `📌 ${ev.title || "目前任務"}`;
  bannerMeta.innerText = [
    ev.pool ? `時段：${ev.pool}` : null,
    ev.eid ? `事件：${ev.eid}` : null,
    metaExtra
  ].filter(Boolean).join("｜");

  bannerState.className = stateClass;
  bannerState.innerText = stateText;

  const disabled = !!(fr && (fr.status==="pending" || fr.status==="approved"));
  bannerDoneBtn.disabled = disabled;

  eventBanner.style.display = "block";
}
function hideBanner(){ eventBanner.style.display = "none"; }

/* ===== Timer strip + countdown ===== */
function updateTimerFromEvent(ev){
  if(ev.status==="pending" && ev.deadlineTs){
    timerStrip.style.display = "flex";
    evtPoolPill.innerText = "時段：" + (ev.pool || "-");
    evtIdPill.innerText   = "事件：" + (ev.eid || "-");
    startCountdown(ev.deadlineTs);
  }else{
    hideTimer();
    stopCountdown();
  }
}
function hideTimer(){ timerStrip.style.display = "none"; }

function startCountdown(deadlineTs){
  stopCountdown();
  countdownTimer = setInterval(()=>{
    const left = Math.max(0, Number(deadlineTs||0) - Date.now());
    const m = Math.floor(left/60000);
    const s = Math.floor(left/1000)%60;
    evtLeft.innerText = `${m}:${String(s).padStart(2,"0")}`;
    if(left<=0){
      stopCountdown();
      evtLeft.innerText = "0:00";
    }
  }, 1000);
}
function stopCountdown(){
  if(countdownTimer){
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

/* ===== Formatting ===== */
function fmtImpact(cost, impactText){
  if(impactText && String(impactText).trim()) return String(impactText).trim();
  if(!cost || typeof cost!=="object" || !Object.keys(cost).length) return "（無）";
  return Object.keys(cost).map(k=>`${resNames[k]||k} -${cost[k]}`).join("、");
}
function fmtReward(reward){
  if(!reward || typeof reward!=="object" || !Object.keys(reward).length) return "（完成後由管理員發放）";
  return Object.keys(reward).map(k=>`${resNames[k]||k} +${reward[k]}`).join("、") + "（完成後發放）";
}

/* ===== Avatar (local) ===== */
function avatarKey(){ return `lr_avatar_p${myId}`; }

function setAvatar(dataUrl){
  const btn = document.getElementById("avatarBtn");
  btn.style.backgroundImage = `url('${dataUrl}')`;
  btn.classList.add("hasPhoto");
}
function clearAvatar(){
  const btn = document.getElementById("avatarBtn");
  btn.style.backgroundImage = "";
  btn.classList.remove("hasPhoto");
}

function loadAvatarFromLocal(){
  try{
    const v = localStorage.getItem(avatarKey());
    if(v) setAvatar(v);
  }catch(e){}
}

function saveAvatarToLocal(dataUrl){
  try{
    localStorage.setItem(avatarKey(), dataUrl);
  }catch(e){
    alert("照片太大導致無法儲存（可改小或之後改 Firebase Storage 同步）");
  }
}

function bindAvatarPicker(){
  const btn = document.getElementById("avatarBtn");
  const input = document.getElementById("avatarInput");

  btn.onclick = ()=> input.click();

  input.onchange = async ()=>{
    const file = input.files && input.files[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
      alert("請選擇圖片檔");
      return;
    }

    const dataUrl = await fileToDataUrl(file);
    const compressed = await compressImage(dataUrl, 360, 0.84);

    setAvatar(compressed);
    saveAvatarToLocal(compressed);
    input.value = "";
  };

  btn.ondblclick = ()=>{
    if(confirm("要清除照片，回到預設頭像嗎？")){
      clearAvatar();
      localStorage.removeItem(avatarKey());
    }
  };
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=> resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

function compressImage(dataUrl, maxSize=360, quality=0.84){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize / Math.max(w,h));
      w = Math.round(w * scale);
      h = Math.round(h * scale);

      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const out = c.toDataURL("image/jpeg", quality);
      resolve(out);
    };
    img.src = dataUrl;
  });
}

/* ===== util ===== */
function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}
