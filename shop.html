<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店管理 - 人生履歷</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
        .config-card { background: #222; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .status-bar { margin-bottom: 15px; padding: 15px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .open { background: #27ae60; } .closed { background: #c0392b; }
        input { padding: 12px; width: 85%; border-radius: 8px; border: none; margin-bottom: 20px; text-align: center; font-size: 16px; background: #333; color: white; }
        .res-setter { display: grid; grid-template-columns: 1fr 2fr; align-items: center; margin: 8px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .val { color: #ffd700; font-weight: bold; min-width: 35px; display: inline-block; font-size: 1.2em; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; background: #444; color: white; font-weight: bold; }
        .toggle-btn { width: 220px; margin-bottom: 20px; font-size: 1.1em; background: #3498db; }
        .add-btn { background: #27ae60; width: 100%; padding: 15px; margin-top: 20px; font-size: 1.1em; }
        .shop-item { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: left; position: relative; border-left: 4px solid #27ae60; display: flex; justify-content: space-between; align-items: center; }
        .bonus-setter { border-top: 1px dashed #666; margin-top: 15px; padding-top: 15px; }
    </style>
</head>
<body>
    <h1><i class="fas fa-store-cog"></i> 商店系統管理</h1>
    
    <div id="shop-status" class="status-bar closed">載入中...</div>
    <button class="toggle-btn" onclick="toggleShop()"><i class="fas fa-power-off"></i> 切換商店開關</button>

    <div class="config-card">
        <h3><i class="fas fa-plus-circle"></i> 新增商品</h3>
        <input type="text" id="itemName" placeholder="輸入商品名稱 (例如：高級轎車)">
        
        <div id="res-inputs"></div>
        
        <div class="res-setter bonus-setter">
            <span style="color:#f39c12"><i class="fas fa-trophy"></i> 獲得分數</span>
            <div>
                <button onclick="updateBonus(-1)">-1</button>
                <span class="val" id="t-score">0</span>
                <button onclick="updateBonus(1)">+1</button>
            </div>
        </div>

        <button class="add-btn" onclick="addItem()"><i class="fas fa-upload"></i> 上架商品</button>
    </div>

    <div style="max-width:500px; margin: 30px auto; text-align: left;">
        <h3 style="border-bottom: 2px solid #444; padding-bottom: 10px;">目前架上商品</h3>
        <div id="items-display"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const resTypes = { time: '時間', money: '金錢', health: '健康', knowledge: '知識', social: '人際' };
        
        let isShopOpen = false;
        let tempRes = { time: 0, money: 0, health: 0, knowledge: 0, social: 0 };
        let bonusScore = 0;

        // 1. 監聽商店全域狀態
        db.ref('shopSettings/isOpen').on('value', s => {
            isShopOpen = s.val() || false;
            const bar = document.getElementById('shop-status');
            bar.innerText = isShopOpen ? "✅ 商店營業中" : "❌ 商店關閉中";
            bar.className = isShopOpen ? "status-bar open" : "status-bar closed";
        });
        function toggleShop() { db.ref('shopSettings/isOpen').set(!isShopOpen); }

        // 2. 初始化代價輸入 UI
        const resInputs = document.getElementById('res-inputs');
        Object.keys(resTypes).forEach(k => {
            resInputs.innerHTML += `
                <div class="res-setter">
                    <span>${resTypes[k]}代價</span>
                    <div>
                        <button onclick="updateTemp('${k}',-1)">-</button>
                        <span class="val" id="t-${k}">0</span>
                        <button onclick="updateTemp('${k}',1)">+</button>
                    </div>
                </div>`;
        });

        // 3. 數值更新邏輯
        function updateTemp(k, v) { 
            tempRes[k] = Math.max(0, tempRes[k] + v); 
            document.getElementById(`t-${k}`).innerText = tempRes[k]; 
        }

        function updateBonus(v) { 
            bonusScore = Math.max(0, bonusScore + v); 
            document.getElementById('t-score').innerText = bonusScore; 
        }

        // 4. 上架商品邏輯
        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            if(!name) return alert("請輸入商品名稱");
            
            db.ref('shop/items').push({ 
                name: name, 
                cost: {...tempRes}, 
                bonus: bonusScore 
            }).then(() => {
                // 重置所有 UI 與數值
                bonusScore = 0; 
                document.getElementById('t-score').innerText = 0;
                document.getElementById('itemName').value = "";
                Object.keys(tempRes).forEach(k => { 
                    tempRes[k] = 0; 
                    document.getElementById(`t-${k}`).innerText = 0; 
                });
                alert("商品上架成功！");
            });
        }
        
        // 5. 監聽並渲染商品列表
        db.ref('shop/items').on('value', s => {
            const display = document.getElementById('items-display');
            display.innerHTML = "";
            const data = s.val();
            if(!data) {
                display.innerHTML = "<p style='color:#666'>目前沒有商品</p>";
                return;
            }
            for(let key in data) {
                const item = data[key];
                display.innerHTML += `
                    <div class="shop-item">
                        <div>
                            <strong>${item.name}</strong> 
                            <div style="font-size:0.8em; color:#aaa; margin-top:4px;">
                                <span style="color:#f39c12">🏆 分數:+${item.bonus || 0}</span>
                            </div>
                        </div>
                        <button style="background:#c0392b" onclick="deleteItem('${key}')"><i class="fas fa-trash-alt"></i> 下架</button>
                    </div>`;
            }
        });

        function deleteItem(key) { 
            if(confirm("確定下架此商品？")) db.ref(`shop/items/${key}`).remove(); 
        }
    </script>
</body>
</html>
