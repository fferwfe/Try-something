<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店管理 - 人生履歷</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
        .config-card { background: #222; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; border: 1px solid #444; }
        .status-bar { margin-bottom: 20px; padding: 15px; border-radius: 10px; font-weight: bold; }
        .open { background: #27ae60; } .closed { background: #c0392b; }
        input { padding: 12px; width: 85%; border-radius: 8px; border: none; margin-bottom: 20px; text-align: center; font-size: 16px; }
        .res-setter { display: grid; grid-template-columns: 1fr 2fr; align-items: center; margin: 8px 0; border-bottom: 1px solid #333; }
        .val { color: #ffd700; font-weight: bold; min-width: 30px; display: inline-block; }
        button { padding: 10px; cursor: pointer; border-radius: 5px; border: none; background: #444; color: white; }
        .toggle-btn { width: 220px; margin-bottom: 20px; font-size: 1.1em; background: #3498db; }
        .add-btn { background: #27ae60; width: 100%; padding: 15px; margin-top: 20px; }
        .shop-item { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: left; position: relative; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>
    <h1><i class="fas fa-store-cog"></i> 商店系統管理</h1>
    <div id="shop-status" class="status-bar closed">商店關閉中</div>
    <button class="toggle-btn" onclick="toggleShop()">切換商店狀態</button>

    <div class="config-card">
        <input type="text" id="itemName" placeholder="新商品名稱 (例如：大房子)">
        <div id="res-inputs"></div>
        <button class="add-btn" onclick="addItem()">上架商品</button>
    </div>

    <div style="max-width:500px; margin: 30px auto; text-align: left;" id="items-display"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const resTypes = { time: '時間', money: '金錢', health: '健康', knowledge: '知識', social: '人際' };
        let isShopOpen = false;

        db.ref('shopSettings/isOpen').on('value', s => {
            isShopOpen = s.val() || false;
            const bar = document.getElementById('shop-status');
            bar.innerText = isShopOpen ? "✅ 商店營業中" : "❌ 商店關閉中";
            bar.className = isShopOpen ? "status-bar open" : "status-bar closed";
        });
        function toggleShop() { db.ref('shopSettings/isOpen').set(!isShopOpen); }

        let tempRes = { time:0, money:0, health:0, knowledge:0, social:0 };
        const resInputs = document.getElementById('res-inputs');
        Object.keys(resTypes).forEach(k => {
            resInputs.innerHTML += `<div class="res-setter"><span>${resTypes[k]}</span><div>
                <button onclick="updateTemp('${k}',-1)">-</button><span class="val" id="t-${k}">0</span><button onclick="updateTemp('${k}',1)">+</button>
            </div></div>`;
        });
        function updateTemp(k, v) { tempRes[k] = Math.max(0, tempRes[k] + v); document.getElementById(`t-${k}`).innerText = tempRes[k]; }
        
        function addItem() {
            const name = document.getElementById('itemName').value;
            if(!name) return alert("請輸入名稱");
            db.ref('shop/items').push({ name: name, cost: tempRes });
            document.getElementById('itemName').value = "";
            Object.keys(tempRes).forEach(k => { tempRes[k]=0; document.getElementById(`t-${k}`).innerText=0; });
        }
        
        db.ref('shop/items').on('value', s => {
            const display = document.getElementById('items-display');
            display.innerHTML = "";
            const data = s.val();
            for(let key in data) {
                const item = data[key];
                display.innerHTML += `<div class="shop-item"><strong>${item.name}</strong> <button style="float:right; background:#c0392b" onclick="deleteItem('${key}')">下架</button></div>`;
            }
        });
        function deleteItem(key) { if(confirm("確定刪除？")) db.ref(`shop/items/${key}`).remove(); }
    </script>
</body>
</html>
