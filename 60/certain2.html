<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜獎狀</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Microsoft JhengHei','Segoe UI',sans-serif;
  color:#2b2117;
}

body{
  background:url("images/backgrounds/gold.jpg") center/cover no-repeat;
  position:relative;
}

/* 整體置中區 */
.container{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4vh 6vw;
  box-sizing:border-box;
}

/* 主標題 */
.title{
  font-size:clamp(34px, 3.2vw, 58px);
  font-weight:900;
  letter-spacing:.18em;
  color:#8b5a18;
  text-shadow:
    0 1px 0 rgba(255,255,255,.9),
    0 2px 8px rgba(255,255,255,.5);
}

/* 英文副標 */
.subtitle{
  margin-top:10px;
  font-size:clamp(14px, 1.1vw, 22px);
  letter-spacing:.18em;
  color:#9a6f2c;
  opacity:.92;
}

/* 玩家名 */
.name{
  margin-top:9vh;
  font-size:clamp(40px, 4.2vw, 78px);
  font-weight:900;
  line-height:1.2;
  color:#3b2a16;
  text-shadow:
    0 2px 0 rgba(255,255,255,.92),
    0 8px 20px rgba(255,255,255,.35);
}

/* 稱號 */
.role{
  margin-top:14px;
  font-size:clamp(18px, 1.6vw, 30px);
  font-weight:700;
  color:#7a5a2b;
  letter-spacing:.08em;
}

/* 獎項 */
.award{
  margin-top:4.5vh;
  min-height:1.4em;
  font-size:clamp(28px, 2.4vw, 46px);
  font-weight:900;
  color:#a32020;
  text-shadow:
    0 1px 0 rgba(255,255,255,.9),
    0 0 16px rgba(255,230,230,.55);
}

/* 總分 */
.score{
  margin-top:4vh;
  font-size:clamp(22px, 1.8vw, 34px);
  font-weight:800;
  color:#5b431f;
}

/* 頒發文字 */
.desc{
  margin-top:3vh;
  max-width:900px;
  font-size:clamp(16px, 1.2vw, 22px);
  line-height:1.8;
  color:#6f552a;
}

/* 日期與單位 */
.footer{
  position:absolute;
  left:0;
  right:0;
  bottom:5vh;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 7vw;
  box-sizing:border-box;
  font-size:clamp(14px, 1vw, 20px);
  color:#7a6033;
}

.footer-right{
  text-align:right;
}

@media (max-width:900px){
  .footer{
    flex-direction:column;
    gap:10px;
    align-items:center;
    text-align:center;
  }
  .footer-right{
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="title">人生履歷榮譽證書</div>
  <div class="subtitle">LIFE RESUME CERTIFICATE</div>

  <div class="name" id="playerName">玩家名稱</div>
  <div class="role" id="playerTitle">稱號</div>

  <div class="award" id="awardText"></div>

  <div class="score" id="score">總分：0</div>

  <div class="desc" id="descText">
    特頒此狀，以表彰於本次活動中展現之精神、行動與成長，
    願持續在人生履歷中寫下屬於自己的精彩篇章。
  </div>
</div>

<div class="footer">
  <div>頒發日期：<span id="date"></span></div>
  <div class="footer-right">人生履歷系統</div>
</div>

<script>
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

const rawPid = new URLSearchParams(location.search).get("pid");
if(!rawPid){
  alert("缺少 pid");
}
const pid = String(rawPid || "").startsWith("p") ? rawPid : `p${rawPid}`;

document.getElementById("date").innerText =
  new Date().toLocaleDateString("zh-TW");

db.ref("players/" + pid).once("value").then(snap=>{
  const p = snap.val() || {};
  const r = p.res || {};

  document.getElementById("playerName").innerText =
    p.name || `玩家 ${pid}`;

  document.getElementById("playerTitle").innerText =
    p.titleCustom || p.roleLabel || p.roleLabelAuto || "冒險者";

  document.getElementById("score").innerText =
    "總分：" + (Number(r.score) || 0);

  document.getElementById("awardText").innerText =
    p.award ? `🏆 ${p.award}` : "";

  // 如果之後你想自己改證書內文，可在 players/pX/certificateText 寫字
  if(p.certificateText){
    document.getElementById("descText").innerText = p.certificateText;
  }
}).catch(err=>{
  console.error(err);
  alert("讀取資料失敗");
});
</script>

</body>
</html>
