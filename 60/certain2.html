<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜獎狀（投影模式）</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Microsoft JhengHei','Segoe UI',sans-serif;
  color:#2b2117;
}

body{
  background:url("images/backgrounds/gold.jpg") center/cover no-repeat;
  position:relative;
  overflow:auto;
}

/* 整體舞台 */
.container{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  padding:3vh 4vw 4vh;
  box-sizing:border-box;
}

/* 標題 */
.title{
   font-size:clamp(100px, 2.6vw, 60px);
  font-weight:900;
  letter-spacing:.18em;
  color:#8b5a18;
  text-shadow:
    0 1px 0 rgba(255,255,255,.9),
    0 2px 8px rgba(255,255,255,.5);
}

.subtitle{
  margin-top:8px;
  font-size:clamp(13px, 1vw, 20px);
  letter-spacing:.18em;
  color:#9a6f2c;
  opacity:.92;
}

/* 玩家名字：投影幕最大重點 */
.name{
  margin-top:6vh;
  font-size:clamp(60px, 6vw, 120px);
  font-weight:900;
  line-height:1.15;
  color:#3b2a16;
  text-shadow:
    0 2px 0 rgba(255,255,255,.92),
    0 8px 20px rgba(255,255,255,.35);
}

/* 稱號 */
.role{
  margin-top:12px;
  font-size:clamp(20px, 1.8vw, 34px);
  font-weight:700;
  color:#7a5a2b;
  letter-spacing:.08em;
}

/* 獎項 */
.award{
  margin-top:3vh;
  min-height:1.4em;
  font-size:clamp(40px, 3.5vw, 70px);
  font-weight:900;
  color:#a32020;
  text-shadow:
    0 1px 0 rgba(255,255,255,.9),
    0 0 16px rgba(255,230,230,.55);
}

/* 分數 */
.score{
  margin-top:2vh;
  font-size:clamp(28px, 2.2vw, 44px);
  font-weight:900;
  color:#5b431f;
}

/* 五資源：投影一行版 */
.resources{
  margin-top:3vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:28px;
  flex-wrap:wrap;
  width:min(1500px, 94vw);
}

.res{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:clamp(22px, 1.8vw, 32px);
  font-weight:900;
  color:#5c431e;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}

.res .label{
  color:#7a6033;
}

/* 商品 / 成就 */
.ach{
  margin-top:2.5vh;
  width:min(1500px, 96vw);
}

.ach-title{
  font-size:clamp(22px, 1.5vw, 30px);
  font-weight:900;
  color:#7a4d12;
  margin-bottom:14px;
}

.ach-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
  gap:14px;
  justify-content:center;
}

.item{
  background:rgba(255,248,235,.56);
  border:1px solid rgba(180,131,35,.16);
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 6px 18px rgba(125,94,34,.06);
}

.item img{
  width:100%;
  height:88px;
  object-fit:cover;
  border-radius:8px;
  display:block;
  background:#eadfcf;
}

.item-name{
  margin-top:8px;
  font-size:14px;
  line-height:1.3;
  font-weight:800;
  color:#5f4520;
  word-break:break-word;
}

.item-qty{
  margin-top:4px;
  font-size:12px;
  color:#8a6a38;
  font-weight:700;
}

.empty{
  font-size:18px;
  color:#7a6033;
  padding:10px 0;
}

/* 頁尾 */
.footer{
  margin-top:auto;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  font-size:clamp(16px, 1vw, 20px);
  color:#7a6033;
  padding-top:18px;
}

.footer-right{
  text-align:right;
}

@media (max-width:800px){
  .ach-list{
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
  }
  .footer{
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .footer-right{
    text-align:center;
  }
}

@media print{
  html,body{
    background:white !important;
  }
  body{
    background-image:none !important;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="title">慈興學界薪傳成長系列之心動奇蹟</div>
  <div class="subtitle">LIFE RESUME CERTIFICATE</div>

  <div class="name" id="playerName">玩家名稱</div>
  <div class="role" id="playerTitle">稱號</div>
  <div class="award" id="awardText"></div>
  <div class="score" id="score">總分：0</div>

  <div class="resources">
    <div class="res"><span class="label">⏳ 時間</span><span id="time">0</span></div>
    <div class="res"><span class="label">💰 金錢</span><span id="money">0</span></div>
    <div class="res"><span class="label">❤️ 健康</span><span id="health">0</span></div>
    <div class="res"><span class="label">📘 知識</span><span id="knowledge">0</span></div>
    <div class="res"><span class="label">🤝 人際</span><span id="social">0</span></div>
  </div>

  <div class="ach">
    <div class="ach-title">🛍 獲得人生成就</div>
    <div class="ach-list" id="achList"></div>
  </div>

  <div class="footer">
    <div>頒發日期：<span id="date"></span></div>
    <div class="footer-right">人生履歷系統</div>
  </div>
</div>

<script>
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

const rawPid = new URLSearchParams(location.search).get("pid");
if(!rawPid){
  alert("缺少 pid");
}
const pid = String(rawPid || "").startsWith("p") ? rawPid : `p${rawPid}`;

document.getElementById("date").innerText =
  new Date().toLocaleDateString("zh-TW");

const FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="88" viewBox="0 0 120 88">
  <rect width="120" height="88" rx="8" fill="#eadfcf"/>
  <text x="60" y="39" text-anchor="middle" font-size="12" fill="#8a6a38" font-family="Arial, sans-serif">No Image</text>
  <text x="60" y="55" text-anchor="middle" font-size="11" fill="#9f8151" font-family="Arial, sans-serif">商品圖片</text>
</svg>
`);

function safeNumber(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function isValidImageUrl(v){
  if(typeof v !== "string") return false;
  const s = v.trim();
  return (
    s.startsWith("http://") ||
    s.startsWith("https://") ||
    s.startsWith("./") ||
    s.startsWith("../") ||
    s.startsWith("/") ||
    s.startsWith("data:image/")
  );
}

function normalizeName(s){
  return String(s || "").trim();
}

function pickImageForItem(item, shopImageMap){
  const ownImageUrl = item && typeof item.imageUrl === "string" ? item.imageUrl.trim() : "";
  const ownImg = item && typeof item.img === "string" ? item.img.trim() : "";
  const itemName = normalizeName(item && (item.name || item.title || item.label));

  if(isValidImageUrl(ownImageUrl)) return ownImageUrl;
  if(isValidImageUrl(ownImg)) return ownImg;

  if(itemName && shopImageMap[itemName] && isValidImageUrl(shopImageMap[itemName])){
    return shopImageMap[itemName];
  }

  return FALLBACK_IMG;
}

function renderPurchasedItems(list, shopImageMap){
  const achList = document.getElementById("achList");
  achList.innerHTML = "";

  if(!list.length){
    achList.innerHTML = `<div class="empty">尚無已購買商品</div>`;
    return;
  }

  list.forEach(it=>{
    const div = document.createElement("div");
    div.className = "item";

    const img = document.createElement("img");
    img.src = pickImageForItem(it, shopImageMap);
    img.alt = it.name || it.title || "商品圖片";
    img.onerror = () => {
      img.onerror = null;
      img.src = FALLBACK_IMG;
    };

    const name = document.createElement("div");
    name.className = "item-name";
    name.innerText = it.name || it.title || it.label || "商品";

    const qty = document.createElement("div");
    qty.className = "item-qty";
    qty.innerText = `x${safeNumber(it.qty || 1)}`;

    div.appendChild(img);
    div.appendChild(name);
    div.appendChild(qty);
    achList.appendChild(div);
  });
}

Promise.all([
  db.ref("players/" + pid).once("value"),
  db.ref("shop/items").once("value")
]).then(([playerSnap, shopSnap])=>{
  const p = playerSnap.val() || {};
  const r = p.res || {};
  const shopItems = shopSnap.val() || {};

  document.getElementById("playerName").innerText =
    p.name || `玩家 ${pid}`;

  document.getElementById("playerTitle").innerText =
    p.titleCustom || p.roleLabel || p.roleLabelAuto || "冒險者";

  document.getElementById("score").innerText =
    "總分：" + safeNumber(r.score);

  document.getElementById("awardText").innerText =
    p.award ? `🏆 ${p.award}` : "";

  document.getElementById("time").innerText = safeNumber(r.time);
  document.getElementById("money").innerText = safeNumber(r.money);
  document.getElementById("health").innerText = safeNumber(r.health);
  document.getElementById("knowledge").innerText = safeNumber(r.knowledge);
  document.getElementById("social").innerText = safeNumber(r.social);

  const shopImageMap = {};
  Object.values(shopItems).forEach(item=>{
    const name = normalizeName(item && item.name);
    const imageUrl = item && (item.imageUrl || item.img);
    if(name && isValidImageUrl(imageUrl)){
      shopImageMap[name] = imageUrl;
    }
  });

  // 顯示全部已購買商品
  const inv = p.inventory || {};
  const list = Object.values(inv);

  renderPurchasedItems(list, shopImageMap);
}).catch(err=>{
  console.error(err);
  alert("讀取資料失敗");
});
</script>
</body>
</html>
