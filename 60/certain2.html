<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜獎狀</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --blue:#2563eb;
  --gold:#b45309;
  --award:#b91c1c;
  --overlay:rgba(255,255,255,.78);
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
  color:var(--text);
}

body{
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

.page{
  position:relative;
  max-width:1000px;
  margin:30px auto;
  padding:40px;
  background:var(--overlay);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
  overflow:hidden;
  backdrop-filter: blur(6px);
}

.page::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.65);
  pointer-events:none;
}

.title{
  text-align:center;
  position:relative;
  z-index:1;
}
.title h1{
  font-size:42px;
  margin:0;
  letter-spacing:4px;
}
.subtitle{
  margin-top:8px;
  font-size:16px;
  color:var(--muted);
}

.main{
  margin-top:40px;
  text-align:center;
  position:relative;
  z-index:1;
}
.player{
  font-size:36px;
  font-weight:900;
}

.role{
  margin-top:10px;
  font-size:20px;
  color:var(--blue);
  font-weight:800;
}

.award-wrap{
  margin-top:20px;
  display:flex;
  justify-content:center;
}

.award-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 20px;
  border-radius:999px;
  background:linear-gradient(135deg, #fff7ed, #ffedd5);
  color:var(--award);
  font-size:24px;
  font-weight:900;
  box-shadow:0 10px 28px rgba(185,28,28,.12);
  border:1px solid rgba(185,28,28,.12);
}

.award-badge.hidden{
  display:none;
}

.score-wrap{
  margin-top:40px;
  display:flex;
  justify-content:center;
  position:relative;
  z-index:1;
}
.score-card{
  width:min(520px, 100%);
  background:#f1f5f9;
  border-radius:20px;
  padding:24px 20px;
  text-align:center;
}
.score-card .k{
  font-size:18px;
  color:var(--muted);
}
.score-card .v{
  margin-top:10px;
  font-size:56px;
  font-weight:900;
  line-height:1;
  color:var(--gold);
}

.stats{
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  position:relative;
  z-index:1;
}
.stat{
  background:#f1f5f9;
  border-radius:16px;
  padding:18px;
}
.stat .k{
  font-size:16px;
  color:var(--muted);
}
.stat .v{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
}

.ach{
  margin-top:40px;
  position:relative;
  z-index:1;
}
.ach h3{
  text-align:center;
  margin-bottom:14px;
}

.ach-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(100px,1fr));
  gap:10px;
}

.item-card{
  background:#f1f5f9;
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.item-card img{
  width:100%;
  height:70px;
  object-fit:cover;
  border-radius:6px;
  display:block;
  background:#e5e7eb;
}

.item-name{
  font-size:13px;
  margin-top:6px;
  font-weight:700;
  line-height:1.35;
  word-break:break-word;
}

.item-qty{
  font-size:12px;
  color:#64748b;
  margin-top:2px;
}

.empty-bag{
  text-align:center;
  color:var(--muted);
  padding:10px 0;
}

.footer{
  margin-top:50px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:14px;
  color:var(--muted);
  flex-wrap:wrap;
  position:relative;
  z-index:1;
}

@media (max-width:768px){
  .page{
    margin:16px;
    padding:24px;
  }
  .title h1{
    font-size:30px;
    letter-spacing:2px;
  }
  .player{
    font-size:28px;
  }
  .role{
    font-size:18px;
  }
  .award-badge{
    font-size:20px;
    padding:10px 16px;
  }
  .score-card .v{
    font-size:44px;
  }
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media (max-width:520px){
  .stats{
    grid-template-columns:1fr;
  }
  .footer{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media print{
  html,body{
    background:white !important;
  }
  body{
    background-image:none !important;
  }
  .page{
    box-shadow:none;
    margin:0;
    border-radius:0;
    background:white;
    backdrop-filter:none;
  }
}
</style>
</head>

<body>
<div class="page">

  <div class="title">
    <h1>人生履歷獎狀</h1>
    <div class="subtitle">Life Resume Certificate</div>
  </div>

  <div class="main">
    <div class="player" id="playerName">玩家</div>
    <div class="role" id="playerTitle">稱號</div>

    <div class="award-wrap">
      <div class="award-badge hidden" id="awardBadge">
        <span>🏆</span>
        <span id="awardText">Ruby獎</span>
      </div>
    </div>
  </div>

  <div class="score-wrap">
    <div class="score-card">
      <div class="k">🏆 總分</div>
      <div class="v" id="score">0</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">⏳ 時間</div><div class="v" id="time">0</div></div>
    <div class="stat"><div class="k">💰 金錢</div><div class="v" id="money">0</div></div>
    <div class="stat"><div class="k">❤️ 健康</div><div class="v" id="health">0</div></div>
    <div class="stat"><div class="k">📘 知識</div><div class="v" id="knowledge">0</div></div>
    <div class="stat"><div class="k">🤝 人際</div><div class="v" id="social">0</div></div>
  </div>

  <div class="ach">
    <h3>🎒 背包</h3>
    <div class="ach-list" id="achList"></div>
  </div>

  <div class="footer">
    <div>頒發日期：<span id="date"></span></div>
    <div>人生履歷系統</div>
  </div>

</div>

<script>
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

const rawPid = new URLSearchParams(location.search).get("pid");
if(!rawPid) alert("缺少 pid");

// 支援 ?pid=1 或 ?pid=p1
const pid = String(rawPid || "").startsWith("p") ? String(rawPid) : `p${rawPid}`;

document.getElementById("date").innerText =
  new Date().toLocaleDateString("zh-TW");

const FALLBACK_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="70" viewBox="0 0 100 70">
  <rect width="100" height="70" rx="8" fill="#e5e7eb"/>
  <text x="50" y="34" text-anchor="middle" font-size="12" fill="#64748b" font-family="Arial, sans-serif">No Image</text>
  <text x="50" y="50" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Arial, sans-serif">商品圖片</text>
</svg>
`);

const DEFAULT_BG = "60/images/backgrounds/default.jpg";

function safeNumber(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function isValidImageUrl(v){
  if(typeof v !== "string") return false;
  const s = v.trim();
  return (
    s.startsWith("http://") ||
    s.startsWith("https://") ||
    s.startsWith("./") ||
    s.startsWith("../") ||
    s.startsWith("/") ||
    s.startsWith("data:image/")
  );
}

function normalizeName(s){
  return String(s || "").trim();
}

function pickImageForItem(item, shopImageMap){
  const ownImageUrl = item && typeof item.imageUrl === "string" ? item.imageUrl.trim() : "";
  const ownImg = item && typeof item.img === "string" ? item.img.trim() : "";
  const itemName = normalizeName(item && (item.name || item.title || item.label));

  if(isValidImageUrl(ownImageUrl)) return ownImageUrl;
  if(isValidImageUrl(ownImg)) return ownImg;

  if(itemName && shopImageMap[itemName] && isValidImageUrl(shopImageMap[itemName])){
    return shopImageMap[itemName];
  }

  return FALLBACK_IMG;
}

function renderInventory(list, shopImageMap){
  const ach = document.getElementById("achList");
  ach.innerHTML = "";

  if(!list.length){
    ach.innerHTML = `<div class="empty-bag">尚無物品</div>`;
    return;
  }

  list.forEach(it=>{
    const card = document.createElement("div");
    card.className = "item-card";

    const img = document.createElement("img");
    img.src = pickImageForItem(it, shopImageMap);
    img.alt = it.name || it.title || "商品圖片";
    img.onerror = () => {
      img.onerror = null;
      img.src = FALLBACK_IMG;
    };

    const name = document.createElement("div");
    name.className = "item-name";
    name.innerText = it.name || it.title || "商品";

    const qty = document.createElement("div");
    qty.className = "item-qty";
    qty.innerText = `x${safeNumber(it.qty || 1)}`;

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(qty);

    ach.appendChild(card);
  });
}

function setAward(awardValue){
  const badge = document.getElementById("awardBadge");
  const text = document.getElementById("awardText");
  const award = String(awardValue || "").trim();

  if(!award){
    badge.classList.add("hidden");
    text.innerText = "";
    return;
  }

  text.innerText = award;
  badge.classList.remove("hidden");
}

function setBackground(bgValue){
  const bg = String(bgValue || "").trim();

  if(!bg){
    document.body.style.backgroundImage = `url("${DEFAULT_BG}")`;
    return;
  }

  let finalBg = bg;

  // 若只填檔名，自動補到背景資料夾
  if(
    !bg.startsWith("http://") &&
    !bg.startsWith("https://") &&
    !bg.startsWith("./") &&
    !bg.startsWith("../") &&
    !bg.startsWith("/") &&
    !bg.startsWith("data:image/")
  ){
    finalBg = `60/images/backgrounds/${bg}`;
  }

  document.body.style.backgroundImage = `url("${finalBg}")`;
}

// 先套預設背景
setBackground(DEFAULT_BG);

Promise.all([
  db.ref(`players/${pid}`).once("value"),
  db.ref("shop/items").once("value"),
  db.ref("certificateSettings").once("value")
]).then(([playerSnap, shopSnap, certSnap])=>{
  const p = playerSnap.val() || {};
  const r = p.res || {};
  const shopItems = shopSnap.val() || {};
  const cert = certSnap.val() || {};

  document.getElementById("playerName").innerText = p.name || `玩家 ${pid}`;
  document.getElementById("playerTitle").innerText =
    p.titleCustom || p.roleLabel || p.roleLabelAuto || "冒險者";

  document.getElementById("time").innerText = safeNumber(r.time);
  document.getElementById("money").innerText = safeNumber(r.money);
  document.getElementById("health").innerText = safeNumber(r.health);
  document.getElementById("knowledge").innerText = safeNumber(r.knowledge);
  document.getElementById("social").innerText = safeNumber(r.social);
  document.getElementById("score").innerText = safeNumber(r.score);

  // 獎項：優先抓玩家自己的 award，沒有就抓證書預設獎項
  setAward(p.award || cert.defaultAward || "");

  // 背景：優先抓玩家自己的 certificateBg，再抓全域設定
  setBackground(p.certificateBg || cert.background || DEFAULT_BG);

  const shopImageMap = {};
  Object.values(shopItems).forEach(item=>{
    const name = normalizeName(item && item.name);
    const imageUrl = item && item.imageUrl;
    if(name && isValidImageUrl(imageUrl)){
      shopImageMap[name] = imageUrl;
    }
  });

  const inv = p.inventory || {};
  const list = Object.values(inv);

  renderInventory(list, shopImageMap);
}).catch(err=>{
  console.error(err);
  alert("讀取資料失敗");
});
</script>
</body>
</html>
