<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件庫匯入工具</title>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
body{
  font-family:"Microsoft JhengHei";
  background:#f6f8fb;
  padding:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  max-width:800px;
  margin:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
textarea{
  width:100%;
  height:350px;
  margin-top:10px;
  font-family:monospace;
}
button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.blue{background:#2563eb;color:#fff;}
.green{background:#16a34a;color:#fff;}
</style>
</head>

<body>

<div class="card">
  <h2>🔥 事件庫一鍵匯入</h2>

  <label>選擇事件庫</label>
  <select id="pool">
    <option value="single">single</option>
    <option value="group">group</option>
    <option value="special">special</option>
  </select>

  <textarea id="jsonInput" placeholder="貼上事件JSON"></textarea>

  <button class="blue" onclick="formatJSON()">格式化</button>
  <button class="green" onclick="importData()">匯入Firebase</button>

  <div id="status"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
  authDomain: "try-something-ddd1e.firebaseapp.com",
  databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "try-something-ddd1e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function formatJSON(){
  try{
    const obj = JSON.parse(document.getElementById("jsonInput").value);
    document.getElementById("jsonInput").value = JSON.stringify(obj,null,2);
    setStatus("✅ JSON正確");
  }catch(e){
    setStatus("❌ JSON錯誤");
  }
}

async function importData(){
  try{
    const pool = document.getElementById("pool").value;
    const data = JSON.parse(document.getElementById("jsonInput").value);

    if(!confirm("確定覆蓋 events/"+pool+" ?")) return;

    await db.ref("events/"+pool).set(data);

    setStatus("🔥 匯入成功 → events/"+pool);
  }catch(e){
    setStatus("❌ 失敗："+e.message);
  }
}

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}
</script>

</body>
</html>
