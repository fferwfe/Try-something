<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大螢幕 - 排行榜 + 達成清單</title>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    html, body{
      margin:0;
      height:100%;
    }

    body{
      background: url("./60/images/backgrounds/bg.jpg") center center / cover no-repeat fixed;
      font-family:'Microsoft JhengHei',sans-serif;
      color:#2c3e50;
      padding:10px 20px;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    /* 白色遮罩 */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(255,255,255,0.7);
      z-index:0;
    }

    /* 提升層級 */
    #display-header, #main{
      position:relative;
      z-index:1;
    }

    /* Header */
    #display-header{
      display:flex;
      gap:15px;
      height:60px;
      margin-bottom:10px;
    }

    #announcement-bar{
      flex:3;
      background:#3498db;
      border-radius:12px;
      display:none;
      overflow:hidden;
    }

    #msg-box{
      padding-left:100%;
      animation: marquee-left 10s linear infinite;
      color:white;
      font-weight:900;
      line-height:60px;
    }

    @keyframes marquee-left{
      0%{transform:translateX(0);}
      100%{transform:translateX(-100%);}
    }

    #timer-bar{
      flex:1;
      background:#e74c3c;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:2em;
      font-weight:900;
    }

    /* Layout */
    #main{
      display:flex;
      gap:16px;
      flex:1;
    }

    #left{flex:1.2;}
    #right{flex:1;}

    /* 卡片 */
    .p-row{
      background:rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border-radius:10px;
      margin-bottom:6px;
      padding:10px;
      display:flex;
      align-items:center;
      box-shadow:0 6px 16px rgba(0,0,0,.08);
    }

    .rank-num{
      width:30px;
      font-weight:900;
    }

    .player-link{
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      border:none;
      background:none;
    }

    .res-summary{
      flex:1;
      display:flex;
      justify-content:space-around;
    }

    .buy-card{
      background:rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border-radius:12px;
      padding:10px;
      margin-bottom:10px;
      box-shadow:0 6px 16px rgba(0,0,0,.08);
    }

    .chip{
      background:white;
      padding:4px 8px;
      border-radius:999px;
      display:inline-flex;
      gap:6px;
      margin:2px;
      font-size:0.9em;
    }
  </style>
</head>

<body>

<div id="display-header">
  <div id="announcement-bar"><div id="msg-box"></div></div>
  <div id="timer-bar" id="timer-box">00:00</div>
</div>

<div id="main">
  <div id="left">
    <div id="board-list"></div>
  </div>
  <div id="right">
    <div id="purchases-list"></div>
  </div>
</div>

<script>
const db = firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
}).database();

function openCert(pid){
  window.open(`certificate1.html?pid=${pid}`,"_blank");
}

function safe(v){
  return Number(v)||0;
}

function render(data){
  const list = document.getElementById("board-list");
  const right = document.getElementById("purchases-list");

  list.innerHTML="";
  right.innerHTML="";

  const arr=[];

  for(let i=1;i<=15;i++){
    const p=data["p"+i]||{};
    const r=p.res||{};
    const score=safe(r.score);

    arr.push({
      pid:i,
      name:p.name||("玩家"+i),
      res:r,
      score,
      inventory:p.inventory||{}
    });
  }

  arr.sort((a,b)=>b.score-a.score);

  arr.forEach((p,i)=>{
    list.innerHTML+=`
      <div class="p-row">
        <div class="rank-num">${i+1}</div>
        <button class="player-link" onclick="openCert(${p.pid})">${p.name}</button>
        <div class="res-summary">
          <div>💰${safe(p.res.money)}</div>
          <div>❤️${safe(p.res.health)}</div>
          <div>📘${safe(p.res.knowledge)}</div>
          <div>🤝${safe(p.res.social)}</div>
        </div>
      </div>
    `;

    const items=Object.values(p.inventory||{});

    right.innerHTML+=`
      <div class="buy-card">
        <b>${p.name}</b><br>
        ${items.map(it=>`<div class="chip">${it.name||"商品"} x${it.qty||1}</div>`).join("")}
      </div>
    `;
  });
}

db.ref("players").on("value",s=>{
  render(s.val()||{});
});
</script>

</body>
</html>
