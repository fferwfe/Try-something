<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜獎狀</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --blue:#2563eb;
  --gold:#fbbf24;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
  color:var(--text);
}

.page{
  max-width:1000px;
  margin:30px auto;
  padding:40px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
}

/* 標題 */
.title{text-align:center;}
.title h1{
  font-size:42px;
  margin:0;
  letter-spacing:4px;
}
.subtitle{
  margin-top:8px;
  font-size:16px;
  color:var(--muted);
}

/* 主體 */
.main{
  margin-top:40px;
  text-align:center;
}
.player{
  font-size:36px;
  font-weight:900;
}
.role{
  margin-top:10px;
  font-size:20px;
  color:var(--blue);
  font-weight:800;
}

/* 總分 */
.score-wrap{
  margin-top:40px;
  display:flex;
  justify-content:center;
}
.score-card{
  width:min(520px, 100%);
  background:#f1f5f9;
  border-radius:20px;
  padding:24px 20px;
  text-align:center;
}
.score-card .k{font-size:18px;color:var(--muted);}
.score-card .v{
  margin-top:10px;
  font-size:56px;
  font-weight:900;
}

/* 五資源 */
.stats{
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.stat{
  background:#f1f5f9;
  border-radius:16px;
  padding:18px;
}
.stat .k{font-size:16px;color:var(--muted);}
.stat .v{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
}

/* ⭐ 改這裡：商品顯示 */
.ach{margin-top:40px;}
.ach h3{text-align:center;}

.ach-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(100px,1fr));
  gap:10px;
}

.item-card{
  background:#f1f5f9;
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.item-card img{
  width:100%;
  height:70px;
  object-fit:cover;
  border-radius:6px;
}

.item-name{
  font-size:13px;
  margin-top:4px;
  font-weight:700;
}

.item-qty{
  font-size:12px;
  color:#64748b;
}

/* footer */
.footer{
  margin-top:50px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

/* 手機 */
@media (max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:520px){
  .stats{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="page">

  <div class="title">
    <h1>人生履歷獎狀</h1>
    <div class="subtitle">Life Resume Certificate</div>
  </div>

  <div class="main">
    <div class="player" id="playerName">玩家</div>
    <div class="role" id="playerTitle">稱號</div>
  </div>

  <!-- 總分 -->
  <div class="score-wrap">
    <div class="score-card">
      <div class="k">🏆 總分</div>
      <div class="v" id="score">0</div>
    </div>
  </div>

  <!-- 五資源 -->
  <div class="stats">
    <div class="stat"><div class="k">⏳ 時間</div><div class="v" id="time">0</div></div>
    <div class="stat"><div class="k">💰 金錢</div><div class="v" id="money">0</div></div>
    <div class="stat"><div class="k">❤️ 健康</div><div class="v" id="health">0</div></div>
    <div class="stat"><div class="k">📘 知識</div><div class="v" id="knowledge">0</div></div>
    <div class="stat"><div class="k">🤝 人際</div><div class="v" id="social">0</div></div>
  </div>

  <!-- 商品 -->
  <div class="ach">
    <h3>🎒 背包</h3>
    <div class="ach-list" id="achList"></div>
  </div>

  <div class="footer">
    <div>頒發日期：<span id="date"></span></div>
    <div>人生履歷系統</div>
  </div>

</div>

<script>
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

/* pid */
const pid = new URLSearchParams(location.search).get("pid");
if(!pid) alert("缺少 pid");

/* 日期 */
document.getElementById("date").innerText =
  new Date().toLocaleDateString("zh-TW");

/* 讀資料 */
db.ref(`players/p${pid}`).once("value").then(s=>{
  const p = s.val() || {};
  const r = p.res || {};

  const set = (id,v)=> document.getElementById(id).innerText = Number(v || 0);

  document.getElementById("playerName").innerText = p.name || `玩家 ${pid}`;
  document.getElementById("playerTitle").innerText =
    p.titleCustom || p.roleLabel || "冒險者";

  set("time", r.time);
  set("money", r.money);
  set("health", r.health);
  set("knowledge", r.knowledge);
  set("social", r.social);
  set("score", r.score);

  /* ⭐ 商品顯示 */
  const inv = p.inventory || {};
  const list = Object.values(inv);

  const ach = document.getElementById("achList");
  ach.innerHTML = "";

  if(!list.length){
    ach.innerHTML = `<div>尚無物品</div>`;
  }else{
    list.forEach(it=>{
      const card = document.createElement("div");
      card.className = "item-card";

      const img = document.createElement("img");
      img.src = it.img || "https://via.placeholder.com/100x70";

      const name = document.createElement("div");
      name.className = "item-name";
      name.innerText = it.name || "商品";

      const qty = document.createElement("div");
      qty.className = "item-qty";
      qty.innerText = `x${it.qty || 1}`;

      card.appendChild(img);
      card.appendChild(name);
      card.appendChild(qty);

      ach.appendChild(card);
    });
  }
});
</script>
</body>
</html>
