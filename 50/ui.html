<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>UI 設定台｜背景選擇</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

  
  <script src="js/firebase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/site-ui-db.js"></script>
<!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:rgba(15,23,42,.65);
      --shadow:rgba(2,6,23,.12);
      --blue:#3b82f6;
      --warn:#f59e0b;
      --radius:18px;
    }
    body{
      margin:0;
      padding:18px;
      min-height:100vh;
      font-family:system-ui,"Microsoft JhengHei",sans-serif;
      background:linear-gradient(135deg,#eef2ff,#f8fafc);
      color:var(--text);
    }
    .wrap{max-width:900px;margin:auto}
    h1{font-size:20px;margin:0 0 6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:16px}

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 18px 40px var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }
    label{
      font-weight:900;
      margin:10px 0 6px;
      display:block
    }
    select,input{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(2,6,23,.15);
      font-size:15px;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
    }
    .btns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px
    }
    .btn{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:12px 14px;
      font-weight:900;
      color:#fff;
      display:inline-flex;
      gap:8px;
      align-items:center;
      background:var(--blue);
      box-shadow:0 8px 18px var(--shadow);
    }
    .btn.warn{
      background:var(--warn);
      color:#1b1203
    }
    .hint{
      font-size:13px;
      color:var(--muted);
      margin-top:6px
    }
    .preview{
      margin-top:12px;
      border-radius:16px;
      overflow:hidden;
      border:1px dashed rgba(2,6,23,.25);
      height:180px;
      background:#f1f5f9;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-weight:900;
      position:relative;
    }
    .preview::after{
      content:"";
      position:absolute;
      inset:0;
      background:var(--preview-bg) center/cover no-repeat;
      opacity:.9;
    }
  
    .hr{height:1px;background:rgba(2,6,23,.08);margin:14px 0}
    .row label{display:block;margin:0 0 6px;font-weight:900}
    .muted{color:var(--muted);font-weight:800}
    .toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(2,6,23,.10);border-radius:14px;background:#fff;}
    .toggle input{width:18px;height:18px}
  </style>
</head>

<body data-page="admin">
<div class="wrap">
  <h1>🖼️ 背景設定</h1>
  <div class="sub">
    選「哪一個網頁」＋「哪一張圖片」當背景  
    （資料來源：<code>/system/uiConfig/bgOverride</code>）
  </div>

  <!-- 背景指定 -->
  <div class="card">
    <div class="grid">
      <div>
        <label>選擇網頁</label>
        <select id="pageKey">
          <option value="player">player</option>
          <option value="admin">admin</option>
          <option value="shop">shop</option>
          <option value="display">display</option>
          <option value="super">super</option>
        </select>
        <div class="hint">你要設定哪一個頁面的背景</div>
      </div>

      <div>
        <label>背景圖片檔名</label>
        <input id="bgFile" placeholder="例如：bg-player.jpg 或 my-bg.jpg">
        <div class="hint">圖片放在 <code>/images/backgrounds/</code></div>
      </div>
    </div>

    <div class="preview" id="preview">背景預覽</div>

    <div class="btns">
      <button class="btn" id="save">
        <i class="fa-solid fa-floppy-disk"></i> 套用背景
      </button>
      <button class="btn warn" id="clear">
        <i class="fa-solid fa-broom"></i> 清除（回固定）
      </button>
    </div>
  </div>

  <!-- 背景樣式 -->
  <div class="card">
    <label>背景透明度</label>
    <input id="bgOpacity" type="number" step="0.01" min="0" max="1" value="0.18">

    <label>背景模糊(px)</label>
    <input id="bgBlurPx" type="number" min="0" max="40" value="0">

    <div class="btns">
      <button class="btn" id="saveStyle">
        <i class="fa-solid fa-sliders"></i> 儲存樣式
      </button>
    </div>
  </div>

    <div class="card" style="margin-top:14px;">
      <h2 style="margin:0 0 10px;">🔊 系統音效（SFX）</h2>
      <div class="sub" style="margin:0 0 12px;">
        音效檔請放在 <b>/sfx</b> 資料夾（或你在下方設定的路徑）。這裡只管理「檔名與開關/音量」。
      </div>

      <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px;">
        <div class="row">
          <label><b>啟用音效</b></label>
          <label class="toggle">
            <input type="checkbox" id="sfxEnabled">
            <span>開啟</span>
          </label>
        </div>

        <div class="row">
          <label><b>音量</b> <span class="muted" id="sfxVolumeVal">0.35</span></label>
          <input type="range" id="sfxVolume" min="0" max="1" step="0.01" value="0.35">
        </div>

        <div class="row" style="grid-column:1/-1;">
          <label><b>音效資料夾</b> <span class="muted">（例：./sfx）</span></label>
          <input id="sfxDir" placeholder="./sfx">
        </div>
      </div>

      <div class="hr"></div>

      <h3 style="margin:0 0 10px;">音效檔對應表</h3>

      <div class="grid" style="grid-template-columns:1fr 1fr 120px; gap:10px; align-items:end;">
        <div class="row">
          <label>key（程式用）</label>
          <input id="sfxKey" placeholder="buy / win / click ...">
        </div>
        <div class="row">
          <label>檔名（放在 sfxDir 裡）</label>
          <input id="sfxFile" placeholder="buy.mp3">
        </div>
        <button class="btn" id="btnAddSfx" style="height:44px;background:var(--blue);color:#fff;font-weight:900;border-radius:12px;border:none;cursor:pointer;">新增/更新</button>
      </div>

      <div style="margin-top:12px; overflow:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:14px;">
          <thead>
            <tr style="text-align:left; color:var(--muted);">
              <th style="padding:8px 6px;">key</th>
              <th style="padding:8px 6px;">檔名</th>
              <th style="padding:8px 6px;">測試</th>
              <th style="padding:8px 6px;">刪除</th>
            </tr>
          </thead>
          <tbody id="sfxTable"></tbody>
        </table>
      </div>
    </div>

</div>

<script>
const db = window.db;
const ref = db.ref("system/uiConfig");
const $ = id => document.getElementById(id);

function clamp01(v){
  v = Number(v);
  return Number.isFinite(v) ? Math.max(0,Math.min(1,v)) : 0;
}

function updatePreview(){
  const f = $("bgFile").value.trim();
  $("preview").style.setProperty("--preview-bg", f ? `url('./images/backgrounds/${f}')` : "none");
}

function renderSfxTable(sfxFiles){
  const tbody = $("sfxTable");
  tbody.innerHTML = "";
  const entries = Object.entries(sfxFiles || {}).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!entries.length){
    tbody.innerHTML = `<tr><td colspan="4" style="padding:10px 6px; color:var(--muted);">尚未設定任何音效 key</td></tr>`;
    return;
  }
  for(const [k, fn] of entries){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="padding:8px 6px; font-weight:900;">${k}</td>
      <td style="padding:8px 6px;">${fn}</td>
      <td style="padding:8px 6px;">
        <button class="btnTest" data-key="${k}" style="padding:6px 10px;border-radius:10px;border:1px solid rgba(2,6,23,.10);background:#fff;cursor:pointer;font-weight:900;">播放</button>
      </td>
      <td style="padding:8px 6px;">
        <button class="btnDel" data-key="${k}" style="padding:6px 10px;border-radius:10px;border:1px solid rgba(2,6,23,.10);background:#fff;cursor:pointer;font-weight:900;color:#b91c1c;">刪除</button>
      </td>
    `;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll(".btnTest").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.getAttribute("data-key");
      window.SFX?.play?.(key);
    });
  });
  tbody.querySelectorAll(".btnDel").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const key = btn.getAttribute("data-key");
      if(!confirm(`刪除音效 key="${key}"？`)) return;
      await ref.child("sfxFiles").child(key).remove();
      await ref.update({updatedAt:Date.now()});
    });
  });
}

/* ===== 背景 UI ===== */
$("bgFile").addEventListener("input", updatePreview);

$("pageKey").addEventListener("change", async ()=>{
  const s = await ref.get();
  const v = s.val() || {};
  $("bgFile").value = (v.bgOverride || {})[$("pageKey").value] || "";
  updatePreview();
});

/* ===== 音效 UI ===== */
function bindSfxControls(v){
  const d = v.defaults || {};
  $("sfxEnabled").checked = (d.sfxEnabled ?? true) === true;

  const vol = clamp01(d.sfxVolume ?? 0.35);
  $("sfxVolume").value = String(vol);
  $("sfxVolumeVal").textContent = vol.toFixed(2);

  $("sfxDir").value = String(d.sfxDir || "./sfx");
  renderSfxTable(v.sfxFiles || {});
}

$("sfxEnabled").addEventListener("change", async ()=>{
  await ref.child("defaults").update({ sfxEnabled: $("sfxEnabled").checked });
  await ref.update({updatedAt:Date.now()});
});

$("sfxVolume").addEventListener("input", ()=>{
  $("sfxVolumeVal").textContent = Number($("sfxVolume").value).toFixed(2);
});
$("sfxVolume").addEventListener("change", async ()=>{
  await ref.child("defaults").update({ sfxVolume: clamp01($("sfxVolume").value) });
  await ref.update({updatedAt:Date.now()});
});

$("sfxDir").addEventListener("change", async ()=>{
  const dir = $("sfxDir").value.trim() || "./sfx";
  await ref.child("defaults").update({ sfxDir: dir });
  await ref.update({updatedAt:Date.now()});
});

$("btnAddSfx").addEventListener("click", async ()=>{
  const key = $("sfxKey").value.trim();
  const fn  = $("sfxFile").value.trim();
  if(!key) return alert("請填 key（例如 buy / win / click）");
  if(!fn) return alert("請填檔名（例如 buy.mp3）");
  await ref.child("sfxFiles").child(key).set(fn);
  await ref.update({updatedAt:Date.now()});
  $("sfxKey").value = "";
  $("sfxFile").value = "";
  window.SFX?.play?.("click");
});

/* ===== 監聽 DB ===== */
ref.on("value", snap=>{
  const v = snap.val() || {};
  $("bgOpacity").value = v.defaults?.bgOpacity ?? 0.18;
  $("bgBlurPx").value = v.defaults?.bgBlurPx ?? 0;
  $("bgFile").value = (v.bgOverride || {})[$("pageKey").value] || "";
  updatePreview();

  bindSfxControls(v);
});

/* ===== Save buttons ===== */
$("save").onclick = async ()=>{
  await ref.child("bgOverride").child($("pageKey").value).set($("bgFile").value.trim());
  await ref.update({updatedAt:Date.now()});
  window.SFX?.play?.("ok");
  alert("背景已套用");
};

$("clear").onclick = async ()=>{
  await ref.child("bgOverride").child($("pageKey").value).remove();
  await ref.update({updatedAt:Date.now()});
  window.SFX?.play?.("alert");
  alert("已清除，會回固定背景");
};

$("saveStyle").onclick = async ()=>{
  await ref.child("defaults").update({
    bgOpacity: clamp01($("bgOpacity").value),
    bgBlurPx: Number($("bgBlurPx").value) || 0
  });
  await ref.update({updatedAt:Date.now()});
  window.SFX?.play?.("ok");
  alert("背景樣式已儲存");
};
</script>

</body>
</html>
