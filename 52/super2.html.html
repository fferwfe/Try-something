<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>人生履歷｜Super 照片牆（可切玩家）</title>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-storage-compat.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --bg:#0b1220;
      --card:#121a24;
      --row:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.10);
      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
      --yellow:#f1c40f;
      --blue:#3498db;
      --ok:#22c55e;
      --danger:#ef4444;
      --r:18px;
    }
    body{
      margin:0;
      font-family:'Segoe UI','Microsoft JhengHei',sans-serif;
      background:
        radial-gradient(1200px 800px at 15% 10%, rgba(52,152,219,.18), transparent 60%),
        radial-gradient(900px 650px at 85% 0%, rgba(34,197,94,.14), transparent 55%),
        radial-gradient(900px 650px at 60% 92%, rgba(241,196,15,.12), transparent 55%),
        var(--bg);
      color:var(--text);
      padding:18px;
    }
    .wrap{max-width:1200px;margin:0 auto;}
    .topbar{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;
      margin:6px 0 14px;
    }
    h1{margin:0;font-size:1.35rem}
    .hint{opacity:.85;font-size:.92rem;line-height:1.45}
    .card{
      background:linear-gradient(180deg, rgba(18,26,36,.98), rgba(18,26,36,.90));
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--r);
      box-shadow:0 14px 40px rgba(0,0,0,.35);
      padding:14px;
      margin:12px 0;
    }
    .row{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    }
    input,select,button{
      font-size:16px;border-radius:14px;border:none;padding:10px 12px;
    }
    select,input{background:#ecf0f1;color:#111;min-height:42px}
    button{
      cursor:pointer;
      font-weight:950;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      user-select:none;
    }
    .btn{background:var(--blue);color:#fff}
    .btn:active{transform:scale(.98)}
    .btn.ghost{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12)}
    .btn.ok{background:var(--ok);color:#07130b}
    .btn.disabled{opacity:.55;pointer-events:none}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      font-weight:950;
    }
    .badge{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      font-weight:950;
      font-size:.86em;
    }
    .badge.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.22);color:#b7f7c7}
    .badge.danger{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.22);color:#ffc2c2}
    .badge.gray{background:rgba(148,163,184,.16);border-color:rgba(148,163,184,.20);color:#d7e2f4}
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }
    @media (max-width: 980px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media (max-width: 520px){.grid{grid-template-columns:repeat(1,1fr);}}
    .tile{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:260px;
    }
    .thumb{
      width:100%;
      aspect-ratio: 1 / 1;
      object-fit:cover;
      background:rgba(0,0,0,.25);
      cursor:pointer;
      display:block;
    }
    .meta{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
    .meta .title{font-weight:950}
    .meta .small{opacity:.82;font-size:13px;word-break:break-all}
    a{color:#9ad2ff;word-break:break-all}
    a:hover{filter:brightness(1.08)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
    /* preview */
    #mask{
      position:fixed;inset:0;
      background:rgba(0,0,0,.72);
      display:none;align-items:center;justify-content:center;
      z-index:9999;
      padding:18px;
    }
    #mask.open{display:flex}
    #big{
      max-width:min(1200px, 94vw);
      max-height:min(820px, 88vh);
      border-radius:18px;
      object-fit:contain;
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      background:rgba(0,0,0,.25);
    }
    /* cover login */
    #cover{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.55);
      z-index:10000;
    }
    #cover .box{
      width:min(460px, 92vw);
      background:rgba(18,26,36,.95);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:18px;
      text-align:left;
      box-shadow:0 12px 40px rgba(0,0,0,.55);
    }
    .hide{display:none !important}
  </style>
</head>

<body>
  <!-- Login Cover -->
  <div id="cover">
    <div class="box" id="coverBox"></div>
  </div>

  <div class="wrap hide" id="main">
    <div class="topbar">
      <div>
        <h1>🖼️ Super 照片牆（可切玩家）</h1>
        <div class="hint">讀取 <b>uploadsIndex</b> 的 <b>url</b> 來顯示縮圖；按「已看過」只會把 status 設為 <b>seen</b>，不刪檔、不刪資料。</div>
      </div>
      <div class="row">
        <span class="pill">Email：<span id="whoEmail">-</span></span>
        <span class="pill">UID：<span id="whoUid">-</span></span>
        <button class="btn ghost" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <span class="pill"><i class="fa-solid fa-filter"></i> 篩選</span>

        <select id="filterStatus" style="width:180px;">
          <option value="all">全部狀態</option>
          <option value="pending" selected>只看 pending</option>
          <option value="seen">seen（已看過）</option>
        </select>

        <select id="filterPlayer" style="width:180px;">
          <option value="all" selected>全部玩家</option>
          <option value="1">p1</option><option value="2">p2</option><option value="3">p3</option><option value="4">p4</option><option value="5">p5</option><option value="6">p6</option>
          <option value="7">p7</option><option value="8">p8</option><option value="9">p9</option><option value="10">p10</option><option value="11">p11</option>
        </select>

        <button class="btn" id="btnReload"><i class="fa-solid fa-rotate"></i> 重新載入</button>
        <span class="pill">顯示：<b id="count">0</b> 筆</span>
      </div>
    </div>

    <div class="card">
      <div id="grid" class="grid"></div>
      <div id="empty" class="hint" style="margin-top:10px;display:none;">目前沒有符合條件的照片。</div>
    </div>
  </div>

  <!-- Preview -->
  <div id="mask" onclick="closePreview()">
    <img id="big" alt="preview">
  </div>

<script>
  // =========================
  // Firebase 初始化（沿用你現有專案）
  // =========================
  const firebaseConfig = {
    apiKey: "AIzaSyB0Gvpk5Y6ZermG67lFm-ecaXYGL5pl7mk",
    authDomain: "try-something-ddd1e.firebaseapp.com",
    databaseURL: "https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "try-something-ddd1e",
    storageBucket: "try-something-ddd1e.firebasestorage.app",
    messagingSenderId: "245905464126",
    appId: "1:245905464126:web:4aea37e1b2bb0bdd1a2a6f"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // super uid（跟你 super.html 一致）
  const SUPER_UID = "AT3xEkjygoZEcCbrG8VdZVklEfj1";

  const $ = (id)=>document.getElementById(id);

  function showCover(html){ $("cover").classList.remove("hide"); $("coverBox").innerHTML = html; }
  function hideCover(){ $("cover").classList.add("hide"); }
  function showMain(){ $("main").classList.remove("hide"); }
  function hideMain(){ $("main").classList.add("hide"); }

  function renderLogin(){
    return `
      <div style="font-weight:950;font-size:1.1em;margin-bottom:6px;"><i class="fa-solid fa-shield"></i> Super 登入</div>
      <div class="hint" style="margin-bottom:10px;">請輸入 super 的 Email / Password</div>
      <input id="loginEmail" type="email" placeholder="Email" style="width:100%;margin:8px 0;">
      <input id="loginPass" type="password" placeholder="Password" style="width:100%;margin:8px 0;">
      <button class="btn" style="width:100%;" id="btnLogin"><i class="fa-solid fa-right-to-bracket"></i> 登入</button>
      <div class="hint" id="loginHint" style="color:#ffb4b4;margin-top:8px;"></div>
    `;
  }
  function renderDenied(){
    return `
      <div style="font-weight:950;font-size:1.1em;margin-bottom:6px;"><i class="fa-solid fa-ban"></i> 權限不足</div>
      <div class="hint">你已登入，但不是 super（uid 不符）。</div>
      <button class="btn ghost" style="width:100%;margin-top:12px;" id="btnLogoutCover"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
    `;
  }

  function bindLogin(){
    const btn = document.getElementById("btnLogin");
    if(!btn) return;
    btn.onclick = async ()=>{
      const email = document.getElementById("loginEmail")?.value?.trim();
      const pass  = document.getElementById("loginPass")?.value;
      const hint  = document.getElementById("loginHint");
      if(!email || !pass){
        if(hint) hint.textContent = "請輸入 Email / Password";
        return;
      }
      try{
        if(hint) hint.textContent = "";
        await auth.signInWithEmailAndPassword(email, pass);
      }catch(err){
        if(hint) hint.textContent = err?.message || String(err);
      }
    };
  }

  async function gateAuth(user){
    if(!user){
      hideMain();
      showCover(renderLogin());
      bindLogin();
      return;
    }
    if(user.uid !== SUPER_UID){
      hideMain();
      showCover(renderDenied());
      document.getElementById("btnLogoutCover").onclick = ()=>auth.signOut();
      return;
    }
    $("whoEmail").textContent = user.email || "-";
    $("whoUid").textContent = user.uid || "-";
    hideCover();
    showMain();
    await loadWall();
  }

  // =========================
  // Preview
  // =========================
  function openPreview(url){
    $("big").src = url;
    $("mask").classList.add("open");
  }
  function closePreview(){
    $("mask").classList.remove("open");
    $("big").removeAttribute("src");
  }
  window.closePreview = closePreview;

  // =========================
  // Data
  // =========================
  function isLikelyImage(url){
    return !!url && /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(url);
  }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function markSeen(uploadId, pid){
    const now = Date.now();
    const updates = {};
    updates[`uploadsIndex/${uploadId}/status`] = "seen";
    updates[`uploadsIndex/${uploadId}/reviewedAt`] = now;
    updates[`uploadsIndex/${uploadId}/reviewedBy`] = SUPER_UID;

    updates[`players/p${pid}/uploads/${uploadId}/status`] = "seen";
    updates[`players/p${pid}/uploads/${uploadId}/reviewedAt`] = now;
    updates[`players/p${pid}/uploads/${uploadId}/reviewedBy`] = SUPER_UID;

    // 通知玩家（可在玩家頁做通知中心顯示）
    const nref = db.ref(`players/p${pid}/notifications`).push();
    updates[`players/p${pid}/notifications/${nref.key}`] = {
      type: "upload_seen",
      uploadId,
      text: "管理員已看過你的上傳 ✅",
      createdAt: now
    };

    await db.ref().update(updates);
  }

  function badge(status){
    if(status === "seen") return `<span class="badge ok">seen</span>`;
    if(status === "pending") return `<span class="badge gray">pending</span>`;
    return `<span class="badge danger">${escapeHtml(status||"-")}</span>`;
  }

  function tileHtml(x){
    const pid = Number(x.playerId||0) || 0;
    const status = (x.status || "pending");
    const url = (x.url || "").trim();
    const when = x.createdAt ? new Date(x.createdAt).toLocaleString() : "-";
    const fn = x.fileName || "-";

    const canPreview = isLikelyImage(url);
    const previewAttr = canPreview ? `data-preview="${encodeURIComponent(url)}"` : "";
    const btnDisabled = (status === "seen") ? "disabled" : "";
    const btnClass = (status === "seen") ? "btn ok disabled" : "btn ok";

    return `
      <div class="tile">
        ${url ? `
          <img class="thumb" src="${escapeHtml(url)}" loading="lazy" alt="thumb" ${previewAttr}>
        ` : `
          <div style="width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);">
            <div class="hint" style="text-align:center;padding:14px;">
              這筆沒有 <b>url</b><br>（無法顯示縮圖）
            </div>
          </div>
        `}

        <div class="meta">
          <div class="row" style="justify-content:space-between;">
            <div class="row">
              ${badge(status)}
              <span class="pill">p<b>${pid||"?"}</b></span>
            </div>
          </div>

          <div class="title">${escapeHtml(x.taskTitle || "上傳照片")}</div>
          <div class="small">檔名：${escapeHtml(fn)}</div>
          <div class="small">時間：${escapeHtml(when)}</div>

          ${url ? `<div class="small">連結：<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">開啟原圖</a></div>` : ``}

          <div class="actions">
            <button class="${btnClass}" data-seen="${escapeHtml(x.id)}|${pid}" ${btnDisabled}>
              <i class="fa-solid fa-eye"></i> 已看過
            </button>
          </div>
        </div>
      </div>
    `;
  }

  async function loadWall(){
    const status = $("filterStatus").value || "pending";
    const pid = $("filterPlayer").value || "all";

    // 取最近 300 筆（可再加大）
    const snap = await db.ref("uploadsIndex").limitToLast(300).once("value");
    const all = snap.val() || {};
    let arr = Object.entries(all).map(([id,d])=>({id, ...(d||{})}));

    // sort desc by createdAt
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    // filter
    if(status !== "all") arr = arr.filter(x => (x.status||"pending") === status);
    if(pid !== "all") arr = arr.filter(x => String(x.playerId||"") === String(pid));

    $("count").textContent = String(arr.length);

    const grid = $("grid");
    const empty = $("empty");

    if(!arr.length){
      grid.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    grid.innerHTML = arr.map(x=>tileHtml(x)).join("");
  }

  // =========================
  // Events
  // =========================
  document.addEventListener("click", async (e)=>{
    const img = e.target.closest("img.thumb");
    if(img && img.hasAttribute("data-preview")){
      const url = decodeURIComponent(img.getAttribute("data-preview"));
      openPreview(url);
      return;
    }

    const btn = e.target.closest("button");
    if(!btn) return;

    if(btn.id === "btnReload"){
      await loadWall();
      return;
    }
    if(btn.id === "btnLogout"){
      await auth.signOut();
      return;
    }

    if(btn.hasAttribute("data-seen")){
      const [uploadId, pid] = btn.getAttribute("data-seen").split("|");
      if(btn.classList.contains("disabled")) return;
      btn.classList.add("disabled");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 處理中`;
      try{
        await markSeen(uploadId, pid);
        await loadWall();
      }catch(err){
        console.error(err);
        alert("設定已看過失敗：" + (err?.message || err));
        await loadWall();
      }
      return;
    }
  });

  document.addEventListener("change", async (e)=>{
    const t = e.target;
    if(t && (t.id === "filterStatus" || t.id === "filterPlayer")){
      await loadWall();
    }
  });

  // Init
  showCover(renderLogin());
  bindLogin();
  auth.onAuthStateChanged(gateAuth);
</script>
</body>
</html>
