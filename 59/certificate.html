<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生履歷｜獎狀</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --blue:#2563eb;
  --gold:#fbbf24;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;
  color:var(--text);
}

.page{
  max-width:900px;
  margin:30px auto;
  padding:40px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
  position:relative;
}

/* 標題 */
.title{
  text-align:center;
}
.title h1{
  font-size:42px;
  margin:0;
  letter-spacing:4px;
}
.subtitle{
  margin-top:8px;
  font-size:16px;
  color:var(--muted);
}

/* 主體 */
.main{
  margin-top:40px;
  text-align:center;
}
.player{
  font-size:36px;
  font-weight:900;
}
.role{
  margin-top:10px;
  font-size:20px;
  color:var(--blue);
  font-weight:800;
}

/* 數據 */
.stats{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.stat{
  background:#f1f5f9;
  border-radius:16px;
  padding:18px;
}
.stat .k{
  font-size:14px;
  color:var(--muted);
}
.stat .v{
  margin-top:6px;
  font-size:26px;
  font-weight:900;
}

/* 成就 */
.ach{
  margin-top:40px;
}
.ach h3{
  margin-bottom:14px;
}
.ach-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.badge{
  padding:8px 14px;
  border-radius:999px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  font-weight:800;
}

/* 底部 */
.footer{
  margin-top:50px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

/* 列印模式 */
@media print{
  body{background:white;}
  .page{
    box-shadow:none;
    margin:0;
    border-radius:0;
  }
}
</style>
</head>

<body>
<div class="page">

  <div class="title">
    <h1>人生履歷獎狀</h1>
    <div class="subtitle">Life Resume Certificate</div>
  </div>

  <div class="main">
    <div class="player" id="playerName">玩家</div>
    <div class="role" id="playerTitle">稱號</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">⏳ 時間</div><div class="v" id="time">0</div></div>
      </div>
    <div class="stats">
    <div class="stat"><div class="k">💰 金錢</div><div class="v" id="money">0</div></div>
    <div class="stat"><div class="k">❤️ 健康</div><div class="v" id="health">0</div></div>
    <div class="stat"><div class="k">📘 知識</div><div class="v" id="knowledge">0</div></div>
    <div class="stat"><div class="k">🤝 人際</div><div class="v" id="social">0</div></div>
    <div class="stat"><div class="k">🏆 總分</div><div class="v" id="score">0</div></div>
  </div>

  <div class="ach">
    <h3>🏅 人生成就</h3>
    <div class="ach-list" id="achList">
      <span class="badge">尚無成就</span>
    </div>
  </div>

  <div class="footer">
    <div>頒發日期：<span id="date"></span></div>
    <div>人生履歷系統</div>
  </div>

</div>

<script>
/* Firebase */
firebase.initializeApp({
  databaseURL:"https://try-something-ddd1e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = firebase.database();

/* pid */
const pid = new URLSearchParams(location.search).get("pid");
if(!pid) alert("缺少 pid");

/* 日期 */
document.getElementById("date").innerText =
  new Date().toLocaleDateString("zh-TW");

/* 讀資料（只讀一次，低負擔） */
db.ref(`players/p${pid}`).once("value").then(s=>{
  const p = s.val() || {};
  const r = p.res || {};

  document.getElementById("playerName").innerText = p.name || `玩家 ${pid}`;
  document.getElementById("playerTitle").innerText =
    p.titleCustom || p.roleLabel || p.roleLabelAuto || "冒險者";

  const set = (id,v)=> document.getElementById(id).innerText = Number(v||0);

  set("time",r.time);
  set("money",r.money);
  set("health",r.health);
  set("knowledge",r.knowledge);
  set("social",r.social);
  set("score",r.score);

  const inv = p.inventory || {};
  const list = Object.values(inv);

  const ach = document.getElementById("achList");
  ach.innerHTML = "";

  if(!list.length){
    ach.innerHTML = `<span class="badge">尚無成就</span>`;
  }else{
    list.forEach(it=>{
      const b = document.createElement("span");
      b.className = "badge";
      b.innerText = it.name || "成就";
      ach.appendChild(b);
    });
  }
});
</script>
</body>

</html>
